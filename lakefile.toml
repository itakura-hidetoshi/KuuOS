# Keep strict compiler warnings, but do not require cosmetic rewriting of
# byte-preserved historical proofs (unnecessary simpa, unused parameters and
# automatically included section typeclass assumptions). The latter is the
# exact Lean 4.30 `linter.unusedSectionVars` warning observed in existing v0.4.
# Other warnings and all actual elaboration/type/proof errors remain fatal;
# no axioms or historical proof files change.
# Frozen v2.12 has unreachable fallback tactics and unnecessary `<;>` combinators.
# These Batteries-provided style linters are registered only after some imports.
# Use Lake's weak option prefix so core-only modules do not fail on unknown -D
# flags; source proofs and all 107 public roots remain untouched.
# Pinned mathlib's `linter.unusedTactic` rejects inert tactics in frozen v2.12;
# suppress this style-only diagnostic with `weak.` without changing proof terms.
leanOptions = { warningAsError = true, linter.unnecessarySimpa = false, linter.unusedVariables = false, linter.unusedSectionVars = false, weak.linter.unreachableTactic = false, weak.linter.unnecessarySeqFocus = false, weak.linter.unusedTactic = false }
