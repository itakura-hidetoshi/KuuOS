name: KuuOS v1.107 CodeAI MemoryOS face-equation transport candidates

on:
  pull_request:
    paths:
      - "scripts/kuuos_v1107_codeai_visible_face_table_v1.py"
      - ".github/workflows/kuuos-v1107-codeai-visible-face-table-v1.yml"

permissions:
  contents: read
  actions: read

jobs:
  v1107-codeai-memoryos-direct-lean-mcp:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup pinned Lean v4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned existing parent build cache read-only
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve pinned mathlib
        run: lake exe cache get
      - name: Strict imported v1.106 proof closure before candidate trials
        run: |
          set -euo pipefail
          timeout 2400 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAFourHornLabelTableV1_106
      - name: Install fixed real Lean MCP transport
        run: python3 -m pip install uv
      - name: CodeAI and MemoryOS read-only hints then all fixed direct Lean trials; real MCP only green
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1107_codeai_visible_face_table_v1.py
          PYTHONPATH=. python3 scripts/kuuos_v1107_codeai_visible_face_table_v1.py
      - name: Archive all successes failures MemoryOS causal hypotheses and MCP receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1107-codeai-face-table-${{ github.run_id }}
          path: |
            /tmp/kuuos-v1107-memoryos/
            /tmp/kuuos-v1107-codeai-face-table/
            /tmp/kuuos-v1107-real-mcp-face-table/
          if-no-files-found: warn
          retention-days: 30
