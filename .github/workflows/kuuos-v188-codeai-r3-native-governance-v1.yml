name: KuuOS v1.88 R3 actual native CodeAI source-bound candidate governance
on:
  push:
    branches:
      - 'validation/kuuos-v188-r3-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-codeai-r3-governed-synthesis:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real KuuOS native CodeAI observation, R3 proposal and unsafe rejection
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r3_native_governance_v1.py
      - name: Preserve CodeAI R3 candidate and rejection receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r3-native-codeai-receipt
          path: artifacts/codeai-v188-r3-native-governance
          retention-days: 30
          if-no-files-found: warn
