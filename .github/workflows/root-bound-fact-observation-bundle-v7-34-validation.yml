name: Root-bound fact observation bundle v7.34 validation

on:
  pull_request:
    paths:
      - 'runtime/kuuos_runtime_root_bound_fact_observation_bundle_v7_34.py'
      - 'scripts/check_kuuos_runtime_root_bound_fact_observation_bundle_v7_34.py'
      - 'manifests/kuuos_root_bound_fact_observation_bundle_v7_34.json'
      - 'docs/KUUOS_ROOT_BOUND_FACT_OBSERVATION_BUNDLE_v7_34.md'
      - '.github/workflows/root-bound-fact-observation-bundle-v7-34-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile root-bound fact observation bundle
        run: |
          python -m py_compile             runtime/kuuos_runtime_root_bound_fact_observation_bundle_v7_34.py             scripts/check_kuuos_runtime_root_bound_fact_observation_bundle_v7_34.py

      - name: Run focused fact-bundle checks
        run: |
          PYTHONPATH=. python scripts/check_kuuos_runtime_root_bound_fact_observation_bundle_v7_34.py

      - name: Verify evidence and authority boundaries
        run: |
          grep -Fq '"missing_observation_rejects_task": false' manifests/kuuos_root_bound_fact_observation_bundle_v7_34.json
          grep -Fq '"stale_observation_rejects_task": false' manifests/kuuos_root_bound_fact_observation_bundle_v7_34.json
          grep -Fq '"claimed_fresh_wrong_head_is_binding_obstruction": true' manifests/kuuos_root_bound_fact_observation_bundle_v7_34.json
          grep -Fq '"filesystem_lean_source_digest_must_match": true' manifests/kuuos_root_bound_fact_observation_bundle_v7_34.json
          grep -Fq '"observation_bundle_grants_write_authority": false' manifests/kuuos_root_bound_fact_observation_bundle_v7_34.json

      - name: Confirm Strict Lean is not invoked
        run: |
          echo "Runtime-only root-bound fact-bundle validation: Strict Lean intentionally not invoked."
