name: KuuOS v1.88 R5 native CodeAI source-bound CANDIDATE/REJECT
on:
  push:
    branches:
      - 'validation/kuuos-v188-r5-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-codeai-r5-candidate-governance:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KuuOS native CodeAI observed R5 source candidate and explicit authority rejection
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r5_native_governance_v1.py
      - name: Save CodeAI proposal-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r5-native-codeai-receipt
          path: artifacts/codeai-v188-r5-native-governance
          retention-days: 30
          if-no-files-found: warn
