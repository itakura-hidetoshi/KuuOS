name: Root-bound development intake v7.33 validation

on:
  pull_request:
    paths:
      - 'runtime/kuuos_runtime_root_bound_development_intake_v7_33.py'
      - 'scripts/check_kuuos_runtime_root_bound_development_intake_v7_33.py'
      - 'manifests/kuuos_root_bound_development_intake_v7_33.json'
      - 'docs/KUUOS_ROOT_BOUND_DEVELOPMENT_INTAKE_v7_33.md'
      - '.github/workflows/root-bound-development-intake-v7-33-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile root-bound development intake
        run: |
          python -m py_compile             runtime/kuuos_runtime_root_bound_development_intake_v7_33.py             scripts/check_kuuos_runtime_root_bound_development_intake_v7_33.py

      - name: Run focused intake checks
        run: |
          PYTHONPATH=. python scripts/check_kuuos_runtime_root_bound_development_intake_v7_33.py

      - name: Verify intake and authority boundaries
        run: |
          grep -Fq '"mutation_intent_is_allowed": true' manifests/kuuos_root_bound_development_intake_v7_33.json
          grep -Fq '"intake_executes_mutation": false' manifests/kuuos_root_bound_development_intake_v7_33.json
          grep -Fq '"intake_grants_write_authority": false' manifests/kuuos_root_bound_development_intake_v7_33.json
          grep -Fq '"predecessor_authority_may_be_reused": false' manifests/kuuos_root_bound_development_intake_v7_33.json
          grep -Fq '"missing_required_mcp_plane_rejects_task": false' manifests/kuuos_root_bound_development_intake_v7_33.json

      - name: Confirm Strict Lean is not invoked
        run: |
          echo "Runtime-only root-bound task-intake validation: Strict Lean intentionally not invoked."
