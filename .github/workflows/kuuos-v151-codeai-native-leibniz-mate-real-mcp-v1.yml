name: KuuOS v1.51 CodeAI native Leibniz lifting mate direct Lean real MCP and independent audit

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v151-codeai-native-leibniz-mate-real-mcp-v1.yml'
      - 'formal/KUOS/DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51.lean'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  V151_CHECKOUT_BLOB: 'e0944cad043e2d11c28ac444f767d60c30dca6c4'
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  codeai-v151-direct-and-real-mcp:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore fixed mathlib and compile exact v1.50 dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          assert require_pins(pathlib.Path('.').resolve())['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          b=pathlib.Path('formal/KUOS/DependentOriginationStandardTypeAEndpointPushoutProductV1_50.lean').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='48ae0b637350ee8bfb63926327a4285d05b79af5'
          PY
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeAEndpointPushoutProductV1_50
      - name: CodeAI conditional external comparison candidates and pinned direct Lean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tempfile
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,FORBIDDEN_NEW
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v151-codeai')
          out.mkdir(parents=True,exist_ok=True)
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(original)==os.environ['V151_CHECKOUT_BLOB']=='e0944cad043e2d11c28ac444f767d60c30dca6c4'
          baseline=(root/'legacy/v5.291/formal/KUOS/DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51.lean').read_text()
          assert blob(baseline.encode())=='e0944cad043e2d11c28ac444f767d60c30dca6c4'
          patches=json.loads(r'''[{"name":"exact-native-lemmas","sha":"ed074ccd29f3b1ece21d5d4a1b5b136cf8a3400a","old":"  · simp [standardTypeAEndpointLeibnizSquare]\n  · simp [standardTypeAEndpointLeibnizSquare]","new":"  · exact (standardTypeAEndpointLeibnizSquare g).inl_ι\n  · exact (standardTypeAEndpointLeibnizSquare g).inr_ι"},{"name":"simp-native-lemmas","sha":"eb44fa1042d8434b99278fa0615f5302d5abddfa","old":"  · simp [standardTypeAEndpointLeibnizSquare]\n  · simp [standardTypeAEndpointLeibnizSquare]","new":"  · simpa only using (standardTypeAEndpointLeibnizSquare g).inl_ι\n  · simpa only using (standardTypeAEndpointLeibnizSquare g).inr_ι"},{"name":"rw-native-lemmas","sha":"176a5d5f77471fc3ec2e2c95888170cf3f191ad0","old":"  · simp [standardTypeAEndpointLeibnizSquare]\n  · simp [standardTypeAEndpointLeibnizSquare]","new":"  · simp only [Functor.PushoutObjObj.inl_ι]\n  · simp only [Functor.PushoutObjObj.inr_ι]"},{"name":"explicit-simpa-native","sha":"585595ede5f8f887f3eab87f2d60236c151ff525","old":"  · simp [standardTypeAEndpointLeibnizSquare]\n  · simp [standardTypeAEndpointLeibnizSquare]","new":"  · simpa only [standardTypeAEndpointLeibnizSquare] using\n      (Functor.PushoutObjObj.inl_ι (standardTypeAEndpointLeibnizSquare g))\n  · simpa only [standardTypeAEndpointLeibnizSquare] using\n      (Functor.PushoutObjObj.inr_ι (standardTypeAEndpointLeibnizSquare g))"}]''')
          variants={}
          for item in patches:
              assert baseline.count(item['old'])==1,('nonunique lemma patch',item['name'])
              code=baseline.replace(item['old'],item['new'],1)
              assert hashlib.sha1(b'blob '+str(len(code.encode())).encode()+b'\0'+code.encode()).hexdigest()==item['sha'],('candidate sha mismatch',item['name'])
              variants[item['name']]=code
          def decls(s):
              return re.findall(r'^(?:@\[[^\]]+\] )?(?:noncomputable )?(?:def|instance|theorem|lemma|structure|abbrev)\s+([A-Za-z_][A-Za-z0-9_]*)',s,re.M)
          for name,s in variants.items():
              assert not FORBIDDEN_NEW.search(s),('new axioms/sorry',name)
              assert decls(s)==decls(baseline),('named theorem inventory altered',name)
              assert 'standardTypeAEndpointLeibnizSquare' in s and 'standardTypeAEndpointPushoutProduct_hasLiftingProperty_iff' in s and 'ParametrizedAdjunction.hasLiftingProperty_iff' in s
          rows=[]
          try:
              for name,s in [('baseline',baseline),*variants.items()]:
                  target.write_text(s)
                  with tempfile.TemporaryDirectory(prefix='kuuos-v151-direct-') as tmp:
                      olean=pathlib.Path(tmp)/'candidate.olean'
                      p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true','-o',str(olean),rel],cwd=root,capture_output=True,text=True,timeout=600)
                      log=p.stdout+'\n'+p.stderr
                      errors=[x for x in log.splitlines() if re.search(r'\berror(?:\([^)]*\))?:',x)]
                      row={'candidate':name,'candidate_blob':blob(s.encode()),'candidate_sha256':digest(s),'exit_code':p.returncode,'olean_exists':olean.is_file(),'errors':errors,'success':p.returncode==0 and olean.is_file() and not errors and 'sorryAx' not in log}
                      rows.append(row)
                      (out/(name+'.log')).write_text(log)
                      print('KUUOS_V151_CODEAI_DIRECT '+json.dumps(row,sort_keys=True))
              assert not rows[0]['success'] and rows[0]['exit_code']!=0
              assert 'unsolved goals' in (out/'baseline.log').read_text()
              selected=next((row for row in rows if row['candidate']!='baseline' and row['success']),None)
              assert selected is not None, ('all CodeAI candidates failed',rows)
              chosen=variants[selected['candidate']]
              print('KUUOS_V151_CODEAI_SELECTED '+json.dumps(selected,sort_keys=True))
              (out/'source.lean').write_text(chosen)
              (out/'manifest.json').write_text(json.dumps({'source_head':os.environ['SOURCE_HEAD'],'checkout_blob':blob(original),'candidate_blob':selected['candidate_blob'],'candidate_sha256':selected['candidate_sha256'],'candidates':rows,'selected_candidate':selected['candidate'],'comparison_assumptions_preserved':True,'external_standard_family_not_instantiated':True,'source_restored':True,'git_write_performed':False,'independent_ci_success':False},indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V151_CODEAI_NEGATIVE_CONTROL_DIRECT_LEAN_COMPLETE')
          PY
      - name: Install real Lean MCP prerequisites
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Successful candidate only through actual KuuOS Lean MCP loop and second direct check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,run_loop,mcp_tactic_provider
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v151-codeai')
          source=(out/'source.lean').read_bytes()
          try:
              target.write_bytes(source)
              p=subprocess.run(['lake','-KleanArgs=-DwarningAsError=true','-KleanArgs=-DsorryAsError=true','build','KUOS.DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51'],cwd=root,capture_output=True,text=True,timeout=3600)
              (out/'complete-build.log').write_text(p.stdout+'\n'+p.stderr)
              print(p.stdout,p.stderr)
              assert p.returncode==0
              receipt=run_loop(root=root,rel_file=rel,output_dir=pathlib.Path('/tmp/kuuos-v151-live-mcp'),expected_sha256=digest(source),provider=mcp_tactic_provider,max_iterations=1)
              assert receipt['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY'
              assert receipt['source_restored'] and not receipt['independent_ci_success'] and not receipt['git_write_performed']
              assert receipt['candidate_sha256']==digest(source)
              assert receipt['rounds'][0]['semantic_success'] and not receipt['rounds'][0]['errors']
              assert receipt['rounds'][0]['direct_lean']['exit_code']==0
              (out/'mcp.json').write_text(json.dumps(receipt,indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V151_CODEAI_DIRECT_THEN_REAL_MCP_SUCCESS_NOT_INDEPENDENT_CI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v151-codeai-candidate
          path: /tmp/kuuos-v151-codeai
          retention-days: 30
          if-no-files-found: error

  independent-v151-kernel-and-seven-axioms:
    needs: codeai-v151-direct-and-real-mcp
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - uses: actions/download-artifact@v4
        with:
          name: kuuos-v151-codeai-candidate
          path: /tmp/kuuos-v151-independent
      - name: Independently bind source HEAD pins candidate bytes and real MCP receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          root=pathlib.Path('.').resolve()
          assert require_pins(root)['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          p=pathlib.Path('/tmp/kuuos-v151-independent')
          m=json.loads((p/'manifest.json').read_text())
          r=json.loads((p/'mcp.json').read_text())
          source=(p/'source.lean').read_bytes()
          dest=root/'formal/KUOS/DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51.lean'
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert m['source_head']==os.environ['SOURCE_HEAD']
          assert blob(dest.read_bytes())==m['checkout_blob']==os.environ['V151_CHECKOUT_BLOB']
          assert m['selected_candidate'] in {"exact-native-lemmas":"ed074ccd29f3b1ece21d5d4a1b5b136cf8a3400a","simp-native-lemmas":"eb44fa1042d8434b99278fa0615f5302d5abddfa","rw-native-lemmas":"176a5d5f77471fc3ec2e2c95888170cf3f191ad0","explicit-simpa-native":"585595ede5f8f887f3eab87f2d60236c151ff525"}
          assert blob(source)==m['candidate_blob']=={"exact-native-lemmas":"ed074ccd29f3b1ece21d5d4a1b5b136cf8a3400a","simp-native-lemmas":"eb44fa1042d8434b99278fa0615f5302d5abddfa","rw-native-lemmas":"176a5d5f77471fc3ec2e2c95888170cf3f191ad0","explicit-simpa-native":"585595ede5f8f887f3eab87f2d60236c151ff525"}[m['selected_candidate']]
          assert any(row['candidate']==m['selected_candidate'] and row['success'] for row in m['candidates'])
          assert hashlib.sha256(source).hexdigest()==m['candidate_sha256']==r['candidate_sha256']
          assert m['comparison_assumptions_preserved'] and m['external_standard_family_not_instantiated'] and m['source_restored'] and not m['git_write_performed'] and not m['independent_ci_success']
          assert r['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY' and r['source_restored'] and not r['independent_ci_success'] and not r['git_write_performed']
          assert r['rounds'][0]['direct_lean']['exit_code']==0 and r['rounds'][0]['semantic_success'] and not r['rounds'][0]['errors']
          dep=root/'formal/KUOS/DependentOriginationStandardTypeAEndpointPushoutProductV1_50.lean'
          assert blob(dep.read_bytes())=='48ae0b637350ee8bfb63926327a4285d05b79af5'
          dest.write_bytes(source)
          print('KUUOS_V151_INDEPENDENT_EXACT_SOURCE_PIN_AND_MCP_RECEIPT_MATCH')
          PY
          lake exe cache get
      - name: Independent full strict Lean v1.51 dependency closure
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51 2>&1 | tee /tmp/kuuos-v151-independent/build.log
      - name: Seven conditional external Duskin fibrancy declarations independent standard axiom audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess
          ns='KUOS.DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51'
          names=["standardTypeAEndpointLeibnizSquare","standardTypeAEndpointLeibnizSquare_ι","standardTypeAEndpointLeibnizSquare_ι_eq_endpointPushoutProductMap","standardTypeAHornPullbackHomSquare","standardTypeAEndpointPushoutProduct_hasLiftingProperty_iff","standardTypeAEndpointPushoutProduct_lifting_of_pullbackHom","standardTypeAHornPullbackHom_lifting_of_endpointPushoutProduct"]
          audit=pathlib.Path('formal/KUOS/DependentOriginationV151IndependentAxiomAudit.lean')
          audit.write_text('import '+ns+'\n'+'\n'.join('#print axioms '+ns+'.'+n for n in names)+'\n')
          p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true',str(audit)],capture_output=True,text=True,timeout=600)
          log=p.stdout+'\n'+p.stderr
          print(log)
          pathlib.Path('/tmp/kuuos-v151-independent/axioms.log').write_text(log)
          assert p.returncode==0 and 'sorryAx' not in log and 'error:' not in log
          rows=re.findall(r"'([^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",log,re.S)
          assert len(rows)==len(names) and {x[0] for x in rows}=={ns+'.'+n for n in names}
          allowed={'propext','Classical.choice','Quot.sound'}
          for _,ax in rows:
              assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed
          src=pathlib.Path('formal/KUOS/DependentOriginationStandardTypeANativeLeibnizLiftingMateV1_51.lean').read_text()
          assert 'standardTypeAEndpointLeibnizSquare' in src and 'standardTypeAHornPullbackHomSquare' in src
          assert 'ParametrizedAdjunction.hasLiftingProperty_iff' in src
          print('KUUOS_V151_SEVEN_DECLARATIONS_STANDARD_AXIOMS_COMPARISON_CONDITIONAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v151-independent-proof-audit
          path: /tmp/kuuos-v151-independent
          retention-days: 30
          if-no-files-found: error
