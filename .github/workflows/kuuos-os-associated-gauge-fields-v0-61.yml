name: KuuOS OS-Associated Gauge Fields v0.61

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/kuuos_os_gauge_field_types_v0_61.py'
      - 'runtime/kuuos_os_associated_fields_v0_61.py'
      - 'runtime/kuuos_os_curvature_holonomy_v0_61.py'
      - 'tests/test_kuuos_os_*_v0_61.py'
      - 'scripts/check_kuuos_os_associated_gauge_fields_v0_61.py'
      - 'scripts/ci_subsystem_lean_scope.py'
      - 'docs/KUUOS_OS_ASSOCIATED_GAUGE_FIELDS_v0_61.md'
      - 'manifests/kuuos_os_associated_gauge_fields_v0_61.json'
      - 'formal/KUOS/WORLD/KuuOSOSAssociatedGaugeFieldsV0_61.lean'
      - 'formal/KuuOSFormalV0_61.lean'
      - 'formal/KUOS.lean'
      - 'formal/KuuOSFormal.lean'
      - 'lakefile.toml'
      - '.github/workflows/kuuos-os-associated-gauge-fields-v0-61.yml'
  pull_request:
    paths:
      - 'runtime/kuuos_os_gauge_field_types_v0_61.py'
      - 'runtime/kuuos_os_associated_fields_v0_61.py'
      - 'runtime/kuuos_os_curvature_holonomy_v0_61.py'
      - 'tests/test_kuuos_os_*_v0_61.py'
      - 'scripts/check_kuuos_os_associated_gauge_fields_v0_61.py'
      - 'scripts/ci_subsystem_lean_scope.py'
      - 'docs/KUUOS_OS_ASSOCIATED_GAUGE_FIELDS_v0_61.md'
      - 'manifests/kuuos_os_associated_gauge_fields_v0_61.json'
      - 'formal/KUOS/WORLD/KuuOSOSAssociatedGaugeFieldsV0_61.lean'
      - 'formal/KuuOSFormalV0_61.lean'
      - 'formal/KUOS.lean'
      - 'formal/KuuOSFormal.lean'
      - 'lakefile.toml'
      - '.github/workflows/kuuos-os-associated-gauge-fields-v0-61.yml'

permissions:
  contents: read

concurrency:
  group: kuuos-os-gauge-v061-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  os-gauge-v061:
    name: OS gauge fields v0.61 runtime and Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      # PR Governance handles the integrated strict KuuOSFormal build.
      # Keep this required check's runtime/registration validation on all
      # triggers; delegate only unrelated root/Lake/doc Lean recompilation.
      - name: Select subsystem Lean scope (fail closed)
        id: lean-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          elif [[ -z "${BASE_SHA:-}" ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            PYTHONPATH=. python3 scripts/ci_subsystem_lean_scope.py \
              --workflow .github/workflows/kuuos-os-associated-gauge-fields-v0-61.yml \
              --base "${BASE_SHA}" --head HEAD \
              --github-output "${GITHUB_OUTPUT}" \
              --delegated-path formal/KuuOSFormal.lean \
              --delegated-path formal/KUOS.lean \
              --delegated-path docs/KUUOS_OS_ASSOCIATED_GAUGE_FIELDS_v0_61.md
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime and validator
        run: >-
          python3 -m compileall -q
          runtime/kuuos_os_gauge_field_types_v0_61.py
          runtime/kuuos_os_associated_fields_v0_61.py
          runtime/kuuos_os_curvature_holonomy_v0_61.py
          tests/test_kuuos_os_associated_fields_v0_61.py
          tests/test_kuuos_os_curvature_holonomy_v0_61.py
          scripts/check_kuuos_os_associated_gauge_fields_v0_61.py
      - name: Run OS gauge-field runtime validation
        run: PYTHONPATH=. python3 scripts/check_kuuos_os_associated_gauge_fields_v0_61.py
      - name: Verify canonical registration
        shell: bash
        run: |
          grep -Fq 'import KUOS.WORLD.KuuOSOSAssociatedGaugeFieldsV0_61' formal/KUOS.lean
          grep -Fq 'import KUOS.WORLD.KuuOSOSAssociatedGaugeFieldsV0_61' formal/KuuOSFormal.lean
          grep -Fq '"KuuOSFormalV0_61"' lakefile.toml
      # Read-only restoration of the validated main/base Lake workspace:
      # the shared Lean build remains separately checked by exact-head CI.
      - name: Restore trusted main Lake workspace (read-only)
        id: trusted-lake-cache
        if: steps.lean-scope.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report trusted Lake cache origin
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        env:
          CACHE_KEY: ${{ steps.trusted-lake-cache.outputs.cache-matched-key }}
        run: echo "Trusted main Lake cache: ${CACHE_KEY:-miss}"

      - name: Set up pinned Lean and Lake
        if: steps.lean-scope.outputs.needed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Resolve pinned dependencies only when missing
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Build v0.61 formal root
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -o pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KuuOSFormalV0_61 2>&1 | tee os-gauge-v061-build.log
      # Canonical aggregate is compiled in PR Governance and main Lean CI.
      # Explicit manual dispatch remains an independent full check.
      - name: Build aggregate formal root
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KuuOSFormal 2>&1 | tee aggregate-formal-build.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-os-gauge-v061-diagnostics
          path: |
            os-gauge-v061-build.log
            aggregate-formal-build.log
          if-no-files-found: ignore
