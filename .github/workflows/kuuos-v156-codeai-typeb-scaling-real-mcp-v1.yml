name: KuuOS v1.56 CodeAI Type-B scaling pushout direct Lean real MCP and independent 32-axiom audit

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v156-codeai-typeb-scaling-real-mcp-v1.yml'
      - 'scripts/ci_kuuos_v156_codeai.py'
      - 'scripts/kuuos_lean_mcp_repair_loop_v1.py'
      - 'formal/KUOS/DependentOriginationStandardTypeBScalingPushoutV1_56.lean'
      - 'tests/test_public_root_restoration.py'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CHECKOUT_BLOB: 'f5b4c1c505e86fbb4986f3ef1b89f5fb2fb07876'

jobs:
  codeai-v156-direct-and-real-mcp:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression test CodeAI guard without weakening prohibited-code gate
        run: |
          python3 tests/test_kuuos_lean_mcp_repair_loop_v1.py
          python3 tests/test_kuuos_lean_mcp_comment_guard_v1.py
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Verify fixed pins and exact v1.55 dependency before any candidate
        run: |
          set -euo pipefail
          python3 -c "import pathlib; from scripts.ci_kuuos_v156_codeai import pins; pins(pathlib.Path('.').resolve())"
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeAScaledLeibnizPushoutV1_55
      - name: Install real Lean MCP prerequisites
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Negative baseline, cause-separated CodeAI candidates, direct Lean, then real MCP
        run: python3 scripts/ci_kuuos_v156_codeai.py direct /tmp/kuuos-v156-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v156-candidate
          path: /tmp/kuuos-v156-candidate
          retention-days: 30
          if-no-files-found: error

  independent-v156-kernel-and-32-axioms:
    needs: codeai-v156-direct-and-real-mcp
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - uses: actions/download-artifact@v4
        with:
          name: kuuos-v156-candidate
          path: /tmp/kuuos-v156-independent
      - name: Restore fixed Mathlib dependencies
        run: lake exe cache get
      - name: Independently reconstruct selected source verify MCP build and all 32 axioms
        run: python3 scripts/ci_kuuos_v156_codeai.py independent /tmp/kuuos-v156-independent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v156-independent-proof-audit
          path: /tmp/kuuos-v156-independent
          retention-days: 30
          if-no-files-found: error
