name: KuuOS v1.87 adopted R2 exact-source 27-axiom Lean
on:
  push:
    branches:
      - 'validation/kuuos-v187-adopted-original-preflight-20261122'
      - 'fix/kuuos-v127-v129-ulift-20261115'
    paths:
      - 'formal/KUOS/DependentOriginationStandardCanonicalPresentationGapV1_87.lean'
      - 'formal/KUOS/DependentOriginationStandardCanonicalPresentationGapCodeAICandidateR2V1_87.lean'
      - 'scripts/ci_kuuos_v187_adopted_exact_source_v1.py'
      - '.github/workflows/kuuos-v187-adopted-exact-source-v1.yml'
      - 'tests/test_public_root_restoration.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v187-adopted-original-name-27-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Strict original-name v1.87 source-bound Lean and 27 axioms
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v187_adopted_exact_source_v1.py --out /tmp/kuuos-v187-original-27
      - name: Upload original-name exact-source proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v187-original-27
          path: /tmp/kuuos-v187-original-27
          if-no-files-found: warn
          retention-days: 30
