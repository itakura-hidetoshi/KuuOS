name: KuuOS v1.76 rank-existence/colimit CodeAI v5 (direct Lean only)
on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v176-rank-colimit-probe-v5.yml'
      - 'scripts/ci_kuuos_v176_rank_colimit_probe_v5.py'
      - 'scripts/kuuos_v176_codeai_rank_colimit_v5.json'
      - 'formal/KUOS/DependentOriginationStandardTypeABoundaryPrismRawTransfiniteV1_76.lean'
permissions:
  contents: read
env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  SOURCE_BLOB: 'c7fd4eb959d05a2eeb430ea39a12d04ed4030ee9'
jobs:
  v176-rank-existence-colimit-not-certification:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Strict build of exact v1.75 dependency
        run: |
          set -euo pipefail
          python3 -c "import pathlib; from scripts.ci_kuuos_v164_codeai import pins; pins(pathlib.Path('.').resolve())"
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeABoundaryPrismRankwiseSimultaneousBPhaseV1_75
      - name: Compare source-bounded v1.76 rank lift and cocone variants; restore original
        run: python3 scripts/ci_kuuos_v176_rank_colimit_probe_v5.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v176-codeai-rank-colimit-v5-not-proof
          path: /tmp/kuuos-v176-codeai-rank-colimit-v5
          retention-days: 30
          if-no-files-found: warn
