name: KuuOS v1.82 original-name adopted canonical endpoint 12 exact Strict Lean and axioms
on:
  push:
    branches:
      - 'fix/kuuos-v127-v129-ulift-20261115'
    paths:
      - '.github/workflows/kuuos-v182-adopted-exact-source-v1.yml'
      - 'formal/KUOS/DependentOriginationCanonicalEndpointLeibnizEpiDescentV1_82.lean'
      - 'formal/KUOS/DependentOriginationCanonicalEndpointLeibnizEpiDescentCodeAICandidateV1_82.lean'
      - 'scripts/ci_kuuos_v182_adopted_exact_source_v1.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v182-adopted-original-name-12-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Compile original-name v1.82 and audit all 12 axioms
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v182_adopted_exact_source_v1.py --out /tmp/kuuos-v182-pr-adopted-12
      - name: Upload exact-head 12-axiom proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v182-pr-adopted-12
          path: /tmp/kuuos-v182-pr-adopted-12
          retention-days: 30
          if-no-files-found: warn
