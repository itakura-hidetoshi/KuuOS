name: KuuOS v1.111 CodeAI round2 exact literal four-horn RLP namespace repair

on:
  pull_request:
    paths:
      - "scripts/kuuos_v1111_codeai_typeA_four_rlp_round2_v1.py"
      - "memoryos/external/github/2026/11/kuuos_codeai_lean_observations_v1111_round1_v1.json"
      - ".github/workflows/kuuos-v1111-codeai-typeA-four-rlp-round2-v1.yml"

permissions:
  contents: read

jobs:
  v1111-round2-direct-lean-real-mcp:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retain 3 exact prior failures as non-authoritative observations
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from runtime.kuuos_codeai_lean_observation_intake_v0_2 import read_observation_directory
          from runtime.kuuos_codeai_lean_observation_intake_v0_1 import read_observation_seed
          root=Path("memoryos/external/github/2026/11")
          cases=read_observation_directory(root)
          added=read_observation_seed(root/"kuuos_codeai_lean_observations_v1111_round1_v1.json")
          assert len(cases)>=36 and len(added)==3
          assert len({x["id"] for x in cases})==len(cases)
          assert all(x["outcome"]=="DIRECT_LEAN_FAILURE" and x["causal_status"]=="UNVERIFIED_HYPOTHESIS" for x in added)
          print("KUUOS_V1111_MEMORYOS_FAILURES",len(cases))
          PY
      - name: Setup pinned Lean4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned build overlay read-only
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve exact pinned mathlib
        run: lake exe cache get
      - name: Strict fixed v1.110 real horn source closure
        run: |
          set -euo pipefail
          timeout 3000 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAFourHornRestrictionV1_110
      - name: Install pinned real Lean MCP
        run: python3 -m pip install uv
      - name: CodeAI 5 RLP variants fixed direct Lean then real MCP for green only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1111_codeai_typeA_four_rlp_round2_v1.py
          PYTHONPATH=. python3 scripts/kuuos_v1111_codeai_typeA_four_rlp_round2_v1.py
      - name: Archive source-bound CodeAI candidates and real MCP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1111-codeai-real-four-rlp-round2-${{ github.run_id }}
          path: |
            /tmp/kuuos-v1111-codeai-rlp-round2/
            /tmp/kuuos-v1111-real-mcp-rlp-round2/
            /tmp/kuuos-v1111-memoryos-round2/
          if-no-files-found: warn
          retention-days: 30
