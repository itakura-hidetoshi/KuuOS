name: KuuOS v1.88 R9 original-name split helper pre-adoption 22-axiom Lean
on:
  push:
    branches:
      - 'validation/kuuos-v188-r9-original-name-preflight-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  r9-original-name-22-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: R9 exact original-name source and independent 22 public kernel axiom reports
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v188_r9_original_name_preflight_v1.py
      - name: Preserve independent original-name R9 receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r9-original-name-preflight
          path: /tmp/kuuos-v188-r9-original-name-preflight
          retention-days: 30
          if-no-files-found: warn
