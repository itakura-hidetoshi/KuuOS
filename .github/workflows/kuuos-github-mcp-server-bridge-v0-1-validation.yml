name: KuuOS GitHub MCP Server Bridge v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/kuuos_github_mcp_server_bridge_v0_1.py'
      - 'scripts/run_kuuos_github_mcp_server_bridge_v0_1.py'
      - 'scripts/check_kuuos_github_mcp_server_bridge_v0_1.py'
      - 'tests/test_kuuos_github_mcp_server_bridge_v0_1.py'
      - 'examples/kuuos_github_mcp_server_bridge_v0_1.json'
      - 'manifests/kuuos_github_mcp_server_bridge_v0_1.json'
      - 'docs/KUUOS_GITHUB_MCP_SERVER_BRIDGE_v0_1.md'
      - '.github/workflows/kuuos-github-mcp-server-bridge-v0-1-validation.yml'
  pull_request:
    paths:
      - 'runtime/kuuos_github_mcp_server_bridge_v0_1.py'
      - 'scripts/run_kuuos_github_mcp_server_bridge_v0_1.py'
      - 'scripts/check_kuuos_github_mcp_server_bridge_v0_1.py'
      - 'tests/test_kuuos_github_mcp_server_bridge_v0_1.py'
      - 'examples/kuuos_github_mcp_server_bridge_v0_1.json'
      - 'manifests/kuuos_github_mcp_server_bridge_v0_1.json'
      - 'docs/KUUOS_GITHUB_MCP_SERVER_BRIDGE_v0_1.md'
      - '.github/workflows/kuuos-github-mcp-server-bridge-v0-1-validation.yml'

permissions:
  contents: read

concurrency:
  group: kuuos-github-mcp-v01-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate runtime surfaces
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            python3 --version
          } > artifacts/diagnostics/context.log

          python3 -m compileall -q \
            runtime/kuuos_github_mcp_server_bridge_v0_1.py \
            scripts/run_kuuos_github_mcp_server_bridge_v0_1.py \
            scripts/check_kuuos_github_mcp_server_bridge_v0_1.py \
            tests/test_kuuos_github_mcp_server_bridge_v0_1.py \
            2>&1 | tee artifacts/diagnostics/python-compile.log

          python3 -m json.tool \
            examples/kuuos_github_mcp_server_bridge_v0_1.json > /dev/null
          python3 -m json.tool \
            manifests/kuuos_github_mcp_server_bridge_v0_1.json > /dev/null
          echo 'PASS: GitHub MCP bridge JSON surfaces' \
            | tee artifacts/diagnostics/json-validation.log

          python3 scripts/check_kuuos_github_mcp_server_bridge_v0_1.py \
            2>&1 | tee artifacts/diagnostics/runtime-check.log
          python3 -m unittest -v \
            tests.test_kuuos_github_mcp_server_bridge_v0_1 \
            2>&1 | tee -a artifacts/diagnostics/runtime-check.log

          {
            grep -Fq 'ghcr.io/github/github-mcp-server' \
              runtime/kuuos_github_mcp_server_bridge_v0_1.py
            grep -Fq 'KUUOS_GITHUB_MCP_AUTHORITY_READY' \
              runtime/kuuos_github_mcp_server_bridge_v0_1.py
            grep -Fq 'exact_sha_git_mutation_not_admitted_v0_1' \
              runtime/kuuos_github_mcp_server_bridge_v0_1.py
            grep -Fq 'mcp_tool_availability_is_not_git_authority' \
              manifests/kuuos_github_mcp_server_bridge_v0_1.json
            echo 'PASS: official server and authority boundaries'
          } 2>&1 | tee artifacts/diagnostics/binding-validation.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-github-mcp-server-bridge-runtime-v0-1-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/
          if-no-files-found: error
