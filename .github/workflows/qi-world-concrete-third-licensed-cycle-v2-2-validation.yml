name: Qi-WORLD Concrete Third Licensed Cycle v2.2

on:
  push:
    paths:
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py"
      - "runtime/kuuos_qi_world_third_cycle_clock_adapter_v2_2.py"
      - "runtime/kuuos_qi_world_third_cycle_binding_adapter_v2_2.py"
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_public_v2_2.py"
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_scenarios_v2_2.py"
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_public_scenarios_v2_2.py"
      - "scripts/check_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py"
      - "scripts/run_kuuos_runtime_full_check_v0_52.py"
      - "tests/test_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py"
      - "formal/KUOS/Architecture/QiWorldConcreteThirdLicensedCycleMaterializationV2_2.lean"
      - "formal/KUOS.lean"
      - "docs/KUUOS_QI_WORLD_CONCRETE_THIRD_LICENSED_CYCLE_MATERIALIZATION_v2_2.md"
      - "manifests/kuuos_qi_world_concrete_third_licensed_cycle_materialization_v2_2.json"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/qi-world-concrete-third-licensed-cycle-v2-2-validation.yml"
  pull_request:
    paths:
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py"
      - "runtime/kuuos_qi_world_third_cycle_clock_adapter_v2_2.py"
      - "runtime/kuuos_qi_world_third_cycle_binding_adapter_v2_2.py"
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_public_v2_2.py"
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_scenarios_v2_2.py"
      - "runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_public_scenarios_v2_2.py"
      - "scripts/check_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py"
      - "scripts/run_kuuos_runtime_full_check_v0_52.py"
      - "tests/test_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py"
      - "formal/KUOS/Architecture/QiWorldConcreteThirdLicensedCycleMaterializationV2_2.lean"
      - "formal/KUOS.lean"
      - "docs/KUUOS_QI_WORLD_CONCRETE_THIRD_LICENSED_CYCLE_MATERIALIZATION_v2_2.md"
      - "manifests/kuuos_qi_world_concrete_third_licensed_cycle_materialization_v2_2.json"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/qi-world-concrete-third-licensed-cycle-v2-2-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Preserve the strict root on a cold cache; warm builds remain incremental.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python surfaces
        run: >-
          python -m compileall -q
          runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py
          runtime/kuuos_qi_world_third_cycle_clock_adapter_v2_2.py
          runtime/kuuos_qi_world_third_cycle_binding_adapter_v2_2.py
          runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_public_v2_2.py
          runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_scenarios_v2_2.py
          runtime/kuuos_qi_world_concrete_third_licensed_cycle_materialization_public_scenarios_v2_2.py
          scripts/check_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py
          tests/test_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py
      - name: Validate manifest JSON
        run: >-
          python -m json.tool
          manifests/kuuos_qi_world_concrete_third_licensed_cycle_materialization_v2_2.json
          > /dev/null
      - name: Validate concrete third licensed cycle
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python \
            scripts/check_qi_world_concrete_third_licensed_cycle_materialization_v2_2.py \
            2>&1 | tee v2-2-runtime.log
      - name: Run v2.2 unit tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python -m unittest -v \
            tests.test_qi_world_concrete_third_licensed_cycle_materialization_v2_2 \
            2>&1 | tee -a v2-2-runtime.log
      - name: Run v2.1 induction regression
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python \
            scripts/check_qi_world_licensed_multi_cycle_chain_induction_v2_1.py \
            2>&1 | tee -a v2-2-runtime.log
      - name: Run v2.0 materialization regression
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python \
            scripts/check_qi_world_successor_licensed_cycle_materialization_v2_0.py \
            2>&1 | tee -a v2-2-runtime.log
      - name: Run current central runtime regression
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python scripts/run_kuuos_runtime_full_check_v0_52.py \
            2>&1 | tee -a v2-2-runtime.log
      # Restore the multi-GB Mathlib/package workspace from main, using
      # the exact base SHA if available and a validated prior main fallback.
      # A separate smaller F112 base build overlay is applied below.
      # All restored oleans are still checked by Lake.
      - name: Restore validated parent/main Lake workspace cache
        id: lean-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # The validated base/main workspace key can be absent when a branch was
      # published with [skip ci]. In that case restore the already available
      # leanprover/lean-action cache, whose documented key starts with lake-.
      # This is restore-only; it neither adds a new CI job nor overwrites
      # the trusted main cache. Lake checks all source dependencies as usual.
      - name: Restore shared lean-action Lake cache on main cache miss
        if: steps.lean-workspace-cache.outputs.cache-matched-key == ''
        id: lean-action-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report shared lean-action cache restore
        if: steps.lean-workspace-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.lean-action-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "lean-action Lake cache matched key: ${CACHE_MATCHED_KEY:-none}"

      - name: Report Lake workspace cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lean-workspace-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.lean-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "Lake cache exact hit: ${CACHE_HIT:-false}"
          echo "Lake cache matched key: ${CACHE_MATCHED_KEY:-none}"

      # Overlay the most recent local project build from this PR only.  This
      # cache is never restored by main and therefore cannot contaminate the
      # trusted default-branch Lake workspace.  It lets a RED Lean iteration
      # reuse the successfully compiled dependency prefix on the next head.
      - name: Restore PR-local Lean build overlay
        if: github.event_name == 'pull_request'
        id: lean-pr-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-

      - name: Report PR-local Lean build overlay restore
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lean-pr-build-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.lean-pr-build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "PR build cache exact hit: ${CACHE_HIT:-false}"
          echo "PR build cache matched key: ${CACHE_MATCHED_KEY:-none}"

      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      # Pinned, hash-traced Lake workspace reuses the strict root's
      # verified dependencies while rebuilding changed source inputs.
      - name: Resolve pinned Lake dependencies only if missing
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Strictly compile v2.2 formal module
        shell: bash
        run: |
          set -o pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.QiWorldConcreteThirdLicensedCycleMaterializationV2_2 \
            2>&1 | tee v2-2-lean-module.log
      - name: Strictly compile formal root
        shell: bash
        run: |
          set -o pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true build KuuOSFormal \
            2>&1 | tee v2-2-lean-root.log
      # Save only the local project build, never the package tree.  Even when
      # the selected target is RED, the compiled dependency prefix is valid
      # for the exact source files that produced it and remains scoped to this
      # pull request.  A changed source on the next head is still rebuilt by Lake.
      - name: Save PR-local Lean build overlay
        if: always() && !cancelled() && github.event_name == 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload v2.2 diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qi-world-v2-2-diagnostics
          path: |
            v2-2-runtime.log
            v2-2-lean-module.log
            v2-2-lean-root.log
          if-no-files-found: warn
