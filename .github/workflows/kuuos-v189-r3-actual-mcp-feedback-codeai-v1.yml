name: KuuOS v1.89 CodeAI R3 actual Lean MCP feedback regeneration and independent Lean
on:
  push:
    branches:
      - 'validation/kuuos-v189-codeai-r3-live-mcp-feedback-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  r3-real-lean-mcp-feedback-codeai:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Checkout exact research HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dynamic CodeAI scripts and pinned source before expensive Lean
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci_kuuos_v189_r3_real_mcp_feedback_v1.py scripts/ci_kuuos_v189_r3_after_mcp_native_codeai_v1.py scripts/ci_kuuos_v189_r3_independent_generated_v1.py
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
      - name: Install real Lean MCP launch dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore exact pinned mathlib and original v1.88 dependencies
        run: |
          set -euo pipefail
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationCanonicalAttachmentScalingObstructionRetractV1_88
      - name: Actual R2 failed Lean -> full import closure -> typed Lean MCP -> feedback-guided proposal -> native CodeAI
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v189_r3_real_mcp_feedback_v1.py
      - name: Preserve actual diagnostics, bounded MCP receipt and dynamic source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v189-r3-real-mcp-feedback-source
          path: /tmp/kuuos-v189-r3-feedback-real-mcp
          retention-days: 30
          if-no-files-found: warn
  r3-independent-kernel-22-axioms:
    needs: r3-real-lean-mcp-feedback-codeai
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Independent checkout of identical research HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore exact pinned dependencies on separate runner
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Transfer ONLY same-workflow dynamically generated R3 source and receipt
        uses: actions/download-artifact@v4
        with:
          name: kuuos-v189-r3-real-mcp-feedback-source
          path: /tmp/kuuos-v189-r3-upstream
      - name: Independent Strict Lean and all 22 public kernel axiom reports
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v189_r3_independent_generated_v1.py
      - name: Preserve independent original source identity and kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v189-r3-independent-lean-22
          path: /tmp/kuuos-v189-r3-independent
          retention-days: 30
          if-no-files-found: warn
