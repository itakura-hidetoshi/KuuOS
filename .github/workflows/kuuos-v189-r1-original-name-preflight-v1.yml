name: KuuOS v1.89 R1 separate original-name Strict Lean and 22 axioms pre-adoption
on:
  push:
    branches:
      - 'validation/kuuos-v189-r1-original-name-preflight-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v189-r1-original-name-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Exact namespace correspondence and original-name Strict Lean 22 axiom audit
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v189_r1_original_name_preflight_v1.py
      - name: Preserve original-name pre-adoption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v189-r1-original-name-preflight
          path: /tmp/kuuos-v189-r1-original-name-22
          retention-days: 30
          if-no-files-found: warn
