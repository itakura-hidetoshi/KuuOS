name: Independent Kuu Foundation

on:
  pull_request:
    paths:
      - 'formal/Kuu/**'
      - 'formal/Kuu.lean'
      - 'formal/KuuOSFormal.lean'
      - 'formal/KuuOSStrict.lean'
      - 'scripts/check_public_proof_roots.py'
      - 'tests/test_public_root_restoration.py'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/*kuu_foundation*'
      - 'scripts/report_kuu_migration_consumers.py'
      - 'tests/test_kuu_foundation.py'
      - 'tests/test_kuu_legacy_ci_integration.py'
      - '.github/workflows/kuuos-gauge-field-self-organization-v0-60.yml'
      - '.github/workflows/kuuos-github-mcp-live-write-verification-formal-v0-3-validation.yml'
      - '.github/workflows/kuuos-github-mcp-server-bridge-formal-v0-1-validation.yml'
      - '.github/workflows/kuuos-github-mcp-server-bridge-formal-v0-2-validation.yml'
      - '.github/workflows/kuuos-os-associated-gauge-fields-v0-61.yml'
      - '.github/workflows/qi-wuxing-addcon-first-isomorphism-v2-9-validation.yml'
      - '.github/workflows/qi-wuxing-generation-control-coherence-v2-6-validation.yml'
      - '.github/workflows/qi-wuxing-phase-observation-universal-property-v3-0-validation.yml'
      - '.github/workflows/qi-wuxing-phase-projection-quotient-kernel-v2-8-validation.yml'
      - '.github/workflows/qi-wuxing-relation-word-protected-history-v2-7-validation.yml'
      - '.github/workflows/qi-yinyang-wuxing-fibonacci-history-v2-5-validation.yml'
      - 'tests/test_kuu_multiline_registration.py'
      - '.github/workflows/world-four-great-phase-dynamics-v0-59.yml'
      - '.github/workflows/qi-process-tensor-local-real-yinyang-v2-4-validation.yml'
      - '.github/workflows/qi-world-yinyang-process-blocker-v2-3-validation.yml'
      - '.github/workflows/kuu-independent-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-kuu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect existing validation consumers without changing them
        run: python3 scripts/report_kuu_migration_consumers.py --output artifacts/independent-kuu
      - name: Independent source boundary and regressions
        run: python3 scripts/run_kuu_foundation_check.py
      # Reuse a *validated base branch* workspace first. PR caches are
      # scoped to their merge ref and cannot seed sibling child PRs.
      # This is restore-only: do not upload a second 2+ GB Lake archive.
      - name: Restore base-branch Lake workspace (read-only)
        id: lean-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # Fallback for branches published with [skip ci]: legacy lean-action
      # writes its own cache namespace. Reuse but NEVER rewrite it here.
      - name: Restore shared lean-action Lake snapshot (read-only)
        id: lean-action-workspace-cache
        if: steps.lean-workspace-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # After packages from main, overlay only the strictly validated
      # parent F112 local build. No PR-to-PR cache sharing is assumed.
      - name: Restore validated F112 parent project build (read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'formal/v5-293-f112-independent-total-change'
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-f112-base-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            kuuos-f112-base-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Set up pinned Lean without redundant cache update
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Fetch pinned Mathlib only when BOTH workspace caches miss
        if: steps.lean-workspace-cache.outputs.cache-matched-key == '' && steps.lean-action-workspace-cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Report independent foundation cache origin
        shell: bash
        env:
          BASE_LAKE_KEY: ${{ steps.lean-workspace-cache.outputs.cache-matched-key }}
          SHARED_LAKE_KEY: ${{ steps.lean-action-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "Base workspace: ${BASE_LAKE_KEY:-miss}"
          echo "Lean-action fallback: ${SHARED_LAKE_KEY:-miss}"
      # Focused incremental compilation of an internal import subgraph.
      # It is NOT an alternative canonical build or a separate theorem authority.
      # KuuOSFormal remains the single public aggregate, checked by normal Lean CI.
      - name: Focused incremental Kuu module compilation
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KuuOSStrict 2>&1 | tee artifacts/independent-kuu/lean.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-kuu-${{ github.run_id }}
          path: artifacts/independent-kuu/
          if-no-files-found: error
