name: Independent Kuu Foundation

on:
  pull_request:
    paths:
      - 'formal/Kuu/**'
      - 'formal/Kuu.lean'
      - 'formal/KuuOSFormal.lean'
      - 'formal/KuuOSStrict.lean'
      - 'scripts/check_public_proof_roots.py'
      - 'tests/test_public_root_restoration.py'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/*kuu_foundation*'
      - 'scripts/report_kuu_migration_consumers.py'
      - 'tests/test_kuu_foundation.py'
      - 'tests/test_kuu_legacy_ci_integration.py'
      - '.github/workflows/kuuos-gauge-field-self-organization-v0-60.yml'
      - '.github/workflows/kuuos-github-mcp-live-write-verification-formal-v0-3-validation.yml'
      - '.github/workflows/kuuos-github-mcp-server-bridge-formal-v0-1-validation.yml'
      - '.github/workflows/kuuos-github-mcp-server-bridge-formal-v0-2-validation.yml'
      - '.github/workflows/kuuos-os-associated-gauge-fields-v0-61.yml'
      - '.github/workflows/qi-wuxing-addcon-first-isomorphism-v2-9-validation.yml'
      - '.github/workflows/qi-wuxing-generation-control-coherence-v2-6-validation.yml'
      - '.github/workflows/qi-wuxing-phase-observation-universal-property-v3-0-validation.yml'
      - '.github/workflows/qi-wuxing-phase-projection-quotient-kernel-v2-8-validation.yml'
      - '.github/workflows/qi-wuxing-relation-word-protected-history-v2-7-validation.yml'
      - '.github/workflows/qi-yinyang-wuxing-fibonacci-history-v2-5-validation.yml'
      - 'tests/test_kuu_multiline_registration.py'
      - '.github/workflows/world-four-great-phase-dynamics-v0-59.yml'
      - '.github/workflows/qi-process-tensor-local-real-yinyang-v2-4-validation.yml'
      - '.github/workflows/qi-world-yinyang-process-blocker-v2-3-validation.yml'
      - '.github/workflows/kuu-independent-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-kuu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect existing validation consumers without changing them
        run: python3 scripts/report_kuu_migration_consumers.py --output artifacts/independent-kuu
      - name: Independent source boundary and regressions
        run: python3 scripts/run_kuu_foundation_check.py
      - name: Set up pinned Lean and cached dependencies
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      # Focused incremental compilation of an internal import subgraph.
      # It is NOT an alternative canonical build or a separate theorem authority.
      # KuuOSFormal remains the single public aggregate, checked by normal Lean CI.
      - name: Focused incremental Kuu module compilation
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KuuOSStrict 2>&1 | tee artifacts/independent-kuu/lean.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-kuu-${{ github.run_id }}
          path: artifacts/independent-kuu/
          if-no-files-found: error
