name: GK4AT one-shot documentation tree preparation
on:
  push:
    branches: [docs/f112-p94d3gk4at-exact-source-sync]
    paths: [.github/workflows/gk4at-doc-tree-once.yml]
permissions:
  contents: write
jobs:
  prepare-tree:
    if: github.repository == 'itakura-hidetoshi/KuuOS' && github.ref == 'refs/heads/docs/f112-p94d3gk4at-exact-source-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare additions-only docs tree without changing any branch or commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          REPO = 'itakura-hidetoshi/KuuOS'
          MAIN = '895f6520a4ea2afc06d75f626ff0b721c73d89de'
          BASE = '5d601d5b5456ada4d5b76a3fa2d8a5566175ed0c'
          BRANCH = 'docs/f112-p94d3gk4at-exact-source-sync'
          def api(method, path, data=None):
              if method != 'GET':
                  assert method == 'POST' and path in ('/git/blobs', '/git/trees')
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + REPO + path,
                  data=None if data is None else json.dumps(data, ensure_ascii=False).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'}, method=method)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)
          assert api('GET', '/git/ref/heads/main')['object']['sha'] == MAIN
          assert api('GET', '/git/ref/heads/' + BRANCH)['object']['sha'] == os.environ['RUN_SHA']
          base = api('GET', '/git/commits/' + BASE)
          assert base['parents'][0]['sha'] == MAIN
          common = '''**真正F54の第一行列AFと第二行列AHが全成分で法3に一致することをLean4証明 — [定理PR #2825](https://github.com/itakura-hidetoshi/KuuOS/pull/2825) MERGED。** C・Fは同一、後退生成子の左下だけが1と4で異なることから、固定mathlibのInt.ModEqを用いて真正RotationEdge・RotationChain・DepthRotationRoute全5構成子上の整合性を証明。元P92B Qと独立構造Sへ別々に降下し、真正K_AIと任意固定旧K_AG類qに適用した。旧qが既に保持するAF行列P(q)により **M_AH≡P(q)(mod3)** が全成分で強制される。

          **今回は非冗長な新obstruction：AttainedMatrix(q) ⊆ Γ_AT(q) ⊊ Γ_AS(q)=Γ_AR(q) ⊊ Γ_AQ(q)。** Γ_ATは従前ASの全条件と第一行列mod3の連言。既存忘却全射から取った実到達Mを算術的にM·U(16)へ移すとAS条件は保つが、mod3一致を保てば第一列がmod3で零となりdet=1に矛盾する。従って任意旧qで真の包含。**移動後の行列を元F54経路として実現するとは主張しない。** 真正Fiberから新sliceへの埋込みも証明した。

          **同一旧q内の合同精度：左上・左下・右下は法48、右上は法12で一致。** 既存の法16（右上のみ法4）と新しい法3を、固定mathlibの互いに素な法の合同定理で結合した。全成分が法48になるという主張ではない。

          **GK4AT exact-source：** source `7b79d067a9b8aa8174df7357860de839d3ba6b29`、実CI checkout `91aabe754c4660cbddf9fd77c33f69459dc4bbcb`、定理squash `895f6520a4ea2afc06d75f626ff0b721c73d89de`、三者共通tree `8847ec9b69cbeb5e416919c2cb5daabcb18494e2`。[CI #41201974238](https://github.com/itakura-hidetoshi/KuuOS/actions/runs/41201974238) **Strict Lean3779/3779・Governance5/5 SUCCESS、新規2Lean・28宣言標準3公理以内、sorryAx0、変更Lean warning/error0/0**。[詳細証明と修正・CI記録](docs/formal/GK4AT-cross-matrix-mod3-strict-slices-mod48.md)。Lean v4.30.0-rc2／mathlib `5450b53e5ddc75d46418fabb605edbf36bd0beb6`、公開root107維持、strict空中心・独立Kuu一presentation・Gray非再導入、保護PR #1558 Draft／OPEN／未マージ。

          **次はGK4AU（未形式化候補）。** 第一・第二行列の共通整数パラメータ付き観測を、真正比較証拠の保存から調べる。単一固定旧qの無限ファイバー、算術slice全域到達、元Q圏公理、歴史的完全型付き同値、14D無条件Countable、19D filler、global strict、hyperdescentは未証明。

          > 以下のGK4AS以前の「最新・次候補」は歴史スナップショット。現行frontierはGK4AT。

          ---

          '''
          entries, checks = [], []
          for path, anchor, heading in (
              ('README.md', '## 最新の研究状態 — 2026-10-31 JST / F112-P94D3GK4AS',
               '## 最新の研究状態 — 2026-10-31 JST / F112-P94D3GK4AT\n\n'),
              ('ROADMAP.md', '**最新のLean定理統合 — F112-P94D3GK4AS',
               '## 最新のLean定理統合 — F112-P94D3GK4AT / 2026-10-31 JST\n\n')):
              record = api('GET', '/contents/' + path + '?ref=' + BASE)
              old_bytes = base64.b64decode(record['content'])
              assert len(old_bytes) == record['size']
              old = old_bytes.decode('utf-8')
              assert old.count(anchor) == 1 and heading not in old
              addition = heading + common
              new = old.replace(anchor, addition + anchor, 1)
              assert new.replace(addition, '', 1) == old
              encoded = new.encode('utf-8')
              expected = hashlib.sha1(b'blob ' + str(len(encoded)).encode() + b'\0' + encoded).hexdigest()
              blob = api('POST', '/git/blobs', {'content': new, 'encoding': 'utf-8'})
              assert blob['sha'] == expected
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
              checks.append({'path': path, 'old_blob': record['sha'], 'new_blob': expected,
                             'historical_bytes_preserved': True, 'added_lines': addition.count('\n')})
          tree = api('POST', '/git/trees', {'base_tree': base['tree']['sha'], 'tree': entries})
          print('GK4AT_DOC_TREE_RECEIPT=' + json.dumps({'tree': tree['sha'],
              'parent_for_mcp': os.environ['RUN_SHA'], 'expected_main': MAIN,
              'source_docs_commit': BASE, 'files': checks,
              'branch_or_commit_writes': 0, 'helper_in_final_tree': False}, ensure_ascii=False))
          PY
