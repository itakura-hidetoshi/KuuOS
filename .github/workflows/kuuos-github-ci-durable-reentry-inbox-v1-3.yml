name: KuuOS GitHub CI Durable Reentry Inbox v1.3

on:
  repository_dispatch:
    types: [kuuos_ci_completion_v1_1]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kuuos-ci-durable-reentry-inbox-v13-${{ github.event.client_payload.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  persist:
    name: Persist bounded CI completion signal
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Self-check durable inbox compiler
        run: |
          set -euo pipefail
          python3 runtime/kuuos_github_ci_durable_reentry_inbox_v1_3.py --self-check

      - name: Compile durable inbox record
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          mkdir -p .kuuos/github-ci-durable-reentry-inbox-v1-3
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          # The workflow selector already binds the repository_dispatch event type.
          # Normalize the transport-level action into the completion semantic expected
          # by the durable inbox compiler; the bounded client_payload remains unchanged.
          raw["action"] = "completed"
          Path(".kuuos/github-ci-durable-reentry-inbox-v1-3/normalized_event.json").write_text(
              json.dumps(raw, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python3 runtime/kuuos_github_ci_durable_reentry_inbox_v1_3.py \
            --event .kuuos/github-ci-durable-reentry-inbox-v1-3/normalized_event.json \
            --output-dir .kuuos/github-ci-durable-reentry-inbox-v1-3

      - name: Persist pending signal as deduplicated GitHub Issue
        if: github.event_name == 'repository_dispatch'
        env:
          KUUOS_INBOX_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KUUOS_INBOX_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          spec = json.loads(
              Path(".kuuos/github-ci-durable-reentry-inbox-v1-3/ci_reentry_issue_spec.json")
              .read_text(encoding="utf-8")
          )
          token = os.environ["KUUOS_INBOX_TOKEN"]
          repository = os.environ["KUUOS_INBOX_REPOSITORY"]
          owner, repo = repository.split("/", 1)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "KuuOS-CI-Durable-Reentry-Inbox-v1.3",
          }

          query = urllib.parse.urlencode({"q": spec["dedupe_query"], "per_page": 100})
          search_request = urllib.request.Request(
              f"https://api.github.com/search/issues?{query}", headers=headers
          )
          with urllib.request.urlopen(search_request, timeout=30) as response:
              search = json.load(response)
          exact = [item for item in search.get("items", []) if item.get("title") == spec["title"]]

          receipt = {
              "version": "kuuos_github_ci_durable_reentry_issue_receipt_v1_3",
              "issue_key": spec["issue_key"],
              "title": spec["title"],
              "created": False,
              "deduplicated": bool(exact),
          }
          if exact:
              issue = exact[0]
          else:
              payload = json.dumps(
                  {"title": spec["title"], "body": spec["body"]},
                  ensure_ascii=False,
              ).encode("utf-8")
              create_request = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/issues",
                  data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(create_request, timeout=30) as response:
                  issue = json.load(response)
              receipt["created"] = True

          receipt.update(
              {
                  "issue_number": issue.get("number"),
                  "issue_url": issue.get("html_url"),
                  "issue_state": issue.get("state"),
                  "signal_is_success_evidence": False,
                  "fresh_mcp_reobservation_required_before_ack": True,
                  "merge_authority_granted": False,
                  "write_authority_granted": False,
              }
          )
          Path(".kuuos/github-ci-durable-reentry-inbox-v1-3/ci_reentry_issue_receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              "KUUOS_CI_DURABLE_INBOX_ISSUE="
              f"{receipt['issue_number']} created={receipt['created']} deduplicated={receipt['deduplicated']}"
          )
          PY

      - name: Publish durable inbox handoff artifact
        if: github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: kuuos-github-ci-durable-reentry-inbox-${{ github.run_id }}
          path: .kuuos/github-ci-durable-reentry-inbox-v1-3/
          if-no-files-found: error
          retention-days: 7

      - name: Publish non-authority summary
        if: github.event_name == 'repository_dispatch'
        run: |
          set -euo pipefail
          {
            echo '## KuuOS GitHub CI Durable Reentry Inbox v1.3'
            echo
            echo '- The CI completion signal was persisted as a deduplicated pending GitHub Issue.'
            echo '- The Issue remains a wake-up signal, not CI success evidence.'
            echo '- A later MCP consumer must freshly re-observe the exact workflow, job, step, and head SHA.'
            echo '- The Issue may be acknowledged/closed only after that fresh verification.'
            echo '- Persistence and acknowledgement grant neither merge nor write authority.'
          } >> "$GITHUB_STEP_SUMMARY"
