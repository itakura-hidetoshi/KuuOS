name: KuuOS v1.87 CodeAI R2 source-bound strict Lean and 27 axioms
on:
  push:
    branches:
      - 'validation/kuuos-v187-codeai-presentation-gap-r2-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v187-codeai-r2-independent-27-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact independent CodeAI repair HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Verify exact original, source-bound typed repair and 27 public Lean axioms
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v187_codeai_r2_exact_source_v1.py --out /tmp/kuuos-v187-r2-27
      - name: Upload original-unchanged independent candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v187-r2-27
          path: /tmp/kuuos-v187-r2-27
          retention-days: 30
          if-no-files-found: warn
