name: KuuOS GitHub MCP Sub-Issue Chain Canary v1.0
run-name: GitHub MCP sub-issue chain canary v1.0 · issue-${{ github.event.issue.number }}

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: kuuos-github-mcp-sub-issue-chain-canary-v1-0-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sub-issue-chain-canary:
    if: >-
      github.event.issue.title == '[KuuOS MCP Sub-Issue Chain Canary v1.0]' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact default-branch revision bound to the request event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate owner request and materialize exact chain authority
        id: request
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_MAIN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/github-mcp-sub-issue-chain-canary-v1-0
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = "kuuos_github_mcp_sub_issue_chain_canary_request_v1_0"
          confirmation = "RUN_KUUOS_GITHUB_MCP_SUB_ISSUE_CHAIN_CANARY"
          image = "ghcr.io/github/github-mcp-server@sha256:2b0c48b070f61e9d3969269ead600f62d00fb237b60ac849ef3d166ee7de9ad3"
          title = "[KuuOS MCP Sub-Issue Chain Canary v1.0]"
          if os.environ["ISSUE_AUTHOR"] != os.environ["REPOSITORY_OWNER"]:
              raise SystemExit("request_author_not_repository_owner")
          if os.environ["AUTHOR_ASSOCIATION"] != "OWNER":
              raise SystemExit("request_author_association_not_owner")
          try:
              request = json.loads(os.environ.get("ISSUE_BODY", ""))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"request_body_not_strict_json:{exc}") from exc
          if not isinstance(request, dict):
              raise SystemExit("request_body_not_object")
          if set(request) != {"version", "confirmation", "expected_main_sha", "transaction_nonce", "server_image"}:
              raise SystemExit("request_top_level_fields_invalid")
          if request.get("version") != version:
              raise SystemExit("request_version_invalid")
          if request.get("confirmation") != confirmation:
              raise SystemExit("request_confirmation_invalid")
          if request.get("expected_main_sha") != os.environ["EVENT_MAIN_SHA"]:
              raise SystemExit("request_expected_main_sha_mismatch")
          nonce = str(request.get("transaction_nonce", ""))
          if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]{7,31}", nonce) is None:
              raise SystemExit("request_transaction_nonce_invalid")
          if request.get("server_image") != image:
              raise SystemExit("request_server_image_not_immutable_digest_pin")
          root_issue = int(os.environ["ISSUE_NUMBER"])
          if root_issue <= 0:
              raise SystemExit("request_issue_number_invalid")
          root = Path("artifacts/github-mcp-sub-issue-chain-canary-v1-0")
          plan = {
              "version": "kuuos_github_mcp_sub_issue_chain_canary_plan_v1_0",
              "mode": "stdio",
              "repository_full_name": os.environ["REPOSITORY"],
              "base_branch": "main",
              "base_sha": os.environ["EVENT_MAIN_SHA"],
              "write_capable": True,
              "read_only": False,
              "lockdown_mode": True,
              "execute_external_actions": True,
              "confirmation": confirmation,
              "transaction_nonce": nonce,
              "root_issue_number": root_issue,
              "request_issue_title": title,
              "request_version_marker": version,
              "server": {
                  "kind": "official_github_mcp_server",
                  "launcher": "docker",
                  "image": image,
                  "token_env": "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "toolsets": ["issues"],
                  "tools": ["issue_write", "issue_read", "sub_issue_write"],
              },
          }
          authority = {
              "authority_status": "KUUOS_GITHUB_MCP_SUB_ISSUE_CHAIN_CANARY_AUTHORITY_READY",
              "plan_read_allowed": True,
              "tool_discovery_allowed": True,
              "external_action_allowed": True,
              "mcp_write_tool_call_allowed": True,
              "post_write_reobservation_allowed": True,
              "upward_parent_reobservation_allowed": True,
              "compensating_chain_remove_allowed": True,
              "compensating_issue_close_allowed": True,
              "receipt_write_allowed": True,
              "audit_append_allowed": True,
          }
          (root / "sub_issue_chain_request_v1_0.json").write_text(json.dumps(request, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "github_mcp_sub_issue_chain_canary_plan_v1_0.json").write_text(json.dumps(plan, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "github_mcp_sub_issue_chain_canary_authority_v1_0.json").write_text(json.dumps(authority, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"transaction_nonce={nonce}\n")
              output.write(f"root_issue_number={root_issue}\n")
          PY

      - name: Pull immutable official GitHub MCP Server and record digest
        id: image
        shell: bash
        env:
          SERVER_IMAGE: ghcr.io/github/github-mcp-server@sha256:2b0c48b070f61e9d3969269ead600f62d00fb237b60ac849ef3d166ee7de9ad3
        run: |
          set -euo pipefail
          docker pull "${SERVER_IMAGE}"
          RESOLVED_REF="$(docker image inspect "${SERVER_IMAGE}" --format '{{index .RepoDigests 0}}')"
          RESOLVED_DIGEST="${RESOLVED_REF##*@}"
          case "${RESOLVED_DIGEST}" in sha256:*) ;; *) exit 1 ;; esac
          echo "resolved_digest=${RESOLVED_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Execute reversible three-level hierarchy canary through official GitHub MCP Server
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          TRANSACTION_NONCE: ${{ steps.request.outputs.transaction_nonce }}
          ROOT_ISSUE_NUMBER: ${{ steps.request.outputs.root_issue_number }}
          RESOLVED_DIGEST: ${{ steps.image.outputs.resolved_digest }}
        run: |
          set -euo pipefail
          python3 scripts/run_kuuos_github_mcp_sub_issue_chain_canary_v1_0.py \
            artifacts/github-mcp-sub-issue-chain-canary-v1-0 \
            --confirmation RUN_KUUOS_GITHUB_MCP_SUB_ISSUE_CHAIN_CANARY \
            --repository "${REPOSITORY}" \
            --base-sha "${BASE_SHA}" \
            --transaction-nonce "${TRANSACTION_NONCE}" \
            --root-issue-number "${ROOT_ISSUE_NUMBER}" \
            --resolved-image-digest "${RESOLVED_DIGEST}" \
            --execute-external-actions \
            2>&1 | tee artifacts/github-mcp-sub-issue-chain-canary-v1-0/run-output.json

      - name: Write chain evidence summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path
          path = Path("artifacts/github-mcp-sub-issue-chain-canary-v1-0/github_mcp_sub_issue_chain_canary_receipt_v1_0.json")
          print("## KuuOS GitHub MCP Sub-Issue Chain Canary v1.0")
          if not path.is_file():
              print("Receipt was not produced.")
              raise SystemExit(0)
          receipt = json.loads(path.read_text(encoding="utf-8"))
          for key in ("status", "base_sha", "root_issue_number", "child_issue_number", "grandchild_issue_number", "root_child_added_verified", "child_root_parent_verified", "child_grandchild_added_verified", "grandchild_child_parent_verified", "child_grandchild_removed_verified", "grandchild_parent_removed_verified", "root_child_removed_verified", "child_parent_removed_verified", "grandchild_closed_verified", "child_closed_verified", "compensation_attempted"):
              print(f"- {key}: `{receipt.get(key, '')}`")
          PY

      - name: Upload chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-github-mcp-sub-issue-chain-canary-v1-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-mcp-sub-issue-chain-canary-v1-0/
          if-no-files-found: error
          retention-days: 30

      - name: Comment result and close completed request
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request
          path = Path("artifacts/github-mcp-sub-issue-chain-canary-v1-0/github_mcp_sub_issue_chain_canary_receipt_v1_0.json")
          receipt = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {"status": "RECEIPT_NOT_PRODUCED"}
          status = str(receipt.get("status", ""))
          keys = ("base_sha", "root_issue_number", "child_issue_number", "child_issue_id", "grandchild_issue_number", "grandchild_issue_id", "root_identity_verified", "root_preflight_empty", "child_created_verified", "grandchild_created_verified", "child_parent_preflight_absent", "grandchild_parent_preflight_absent", "root_child_added_verified", "child_root_parent_verified", "child_grandchild_added_verified", "grandchild_child_parent_verified", "child_grandchild_removed_verified", "grandchild_parent_removed_verified", "root_child_removed_verified", "child_parent_removed_verified", "grandchild_closed_verified", "child_closed_verified", "compensation_attempted", "compensation_cleanup_verified")
          lines = ["## KuuOS GitHub MCP Sub-Issue Chain Canary v1.0", "", f"- status: `{status}`", f"- workflow run: {os.environ['RUN_URL']}"]
          lines += [f"- {key}: `{receipt.get(key, '')}`" for key in keys]
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}"
          headers = {"Accept": "application/vnd.github+json", "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          req = request.Request(base + "/comments", data=json.dumps({"body": "\n".join(lines)}).encode(), headers=headers, method="POST")
          with request.urlopen(req, timeout=30) as response:
              if response.status != 201: raise SystemExit(f"request_comment_failed:{response.status}")
          if status in {"KUUOS_GITHUB_MCP_SUB_ISSUE_CHAIN_CANARY_VERIFIED", "KUUOS_GITHUB_MCP_SUB_ISSUE_CHAIN_CANARY_COMPENSATED"}:
              reason = "completed" if status.endswith("_VERIFIED") else "not_planned"
              req = request.Request(base, data=json.dumps({"state": "closed", "state_reason": reason}).encode(), headers=headers, method="PATCH")
              with request.urlopen(req, timeout=30) as response:
                  if response.status != 200: raise SystemExit(f"request_close_failed:{response.status}")
          PY
