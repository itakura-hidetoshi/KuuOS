name: KuuOS GitHub MCP Workflow Dispatch Write Action v0.5
run-name: GitHub MCP workflow dispatch v0.5 · issue-${{ github.event.issue.number }}

on:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: kuuos-github-mcp-workflow-dispatch-v0-5-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.issue.title == '[KuuOS MCP Workflow Dispatch v0.5]' &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out exact default-branch revision bound to the request event
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate owner request and materialize exact dispatch authority
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_MAIN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/github-mcp-workflow-dispatch-v0-5
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected_version = "kuuos_github_mcp_workflow_dispatch_request_v0_5"
          expected_confirmation = "RUN_KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH"
          expected_workflow = "kuuos-github-mcp-live-canary-v0-4.yml"
          expected_image = "ghcr.io/github/github-mcp-server:v1.0.5"
          expected_live_confirmation = "RUN_KUUOS_GITHUB_MCP_LIVE_CANARY"

          if os.environ["ISSUE_AUTHOR"] != os.environ["REPOSITORY_OWNER"]:
              raise SystemExit("request_author_not_repository_owner")
          if os.environ["AUTHOR_ASSOCIATION"] != "OWNER":
              raise SystemExit("request_author_association_not_owner")

          body = os.environ.get("ISSUE_BODY", "")
          try:
              request = json.loads(body)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"request_body_not_strict_json:{exc}") from exc
          if not isinstance(request, dict):
              raise SystemExit("request_body_not_object")

          allowed_top = {
              "version",
              "confirmation",
              "expected_main_sha",
              "workflow_id",
              "ref",
              "dispatch_nonce",
              "inputs",
          }
          if set(request) != allowed_top:
              raise SystemExit("request_top_level_fields_invalid")
          if request.get("version") != expected_version:
              raise SystemExit("request_version_invalid")
          if request.get("confirmation") != expected_confirmation:
              raise SystemExit("request_confirmation_invalid")
          if request.get("expected_main_sha") != os.environ["EVENT_MAIN_SHA"]:
              raise SystemExit("request_expected_main_sha_mismatch")
          if request.get("workflow_id") != expected_workflow:
              raise SystemExit("request_workflow_not_allowlisted")
          if request.get("ref") != "main":
              raise SystemExit("request_ref_not_main")

          nonce = str(request.get("dispatch_nonce", ""))
          if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{7,63}", nonce) is None:
              raise SystemExit("request_dispatch_nonce_invalid")
          inputs = request.get("inputs")
          if not isinstance(inputs, dict):
              raise SystemExit("request_inputs_invalid")
          if set(inputs) != {"confirmation", "server_image", "dispatch_nonce"}:
              raise SystemExit("request_input_fields_invalid")
          if inputs.get("confirmation") != expected_live_confirmation:
              raise SystemExit("request_live_confirmation_invalid")
          if inputs.get("server_image") != expected_image:
              raise SystemExit("request_server_image_not_compatibility_pin")
          if inputs.get("dispatch_nonce") != nonce:
              raise SystemExit("request_input_nonce_mismatch")

          root = Path("artifacts/github-mcp-workflow-dispatch-v0-5")
          normalized = dict(request)
          plan = {
              "version": "kuuos_github_mcp_workflow_dispatch_plan_v0_5",
              "mode": "stdio",
              "repository_full_name": os.environ["REPOSITORY"],
              "base_branch": "main",
              "base_sha": os.environ["EVENT_MAIN_SHA"],
              "write_capable": True,
              "read_only": False,
              "lockdown_mode": True,
              "execute_external_actions": True,
              "confirmation": expected_confirmation,
              "server": {
                  "kind": "official_github_mcp_server",
                  "launcher": "docker",
                  "image": expected_image,
                  "token_env": "GITHUB_PERSONAL_ACCESS_TOKEN",
                  "toolsets": ["actions"],
                  "tools": ["actions_run_trigger", "actions_list"],
              },
              "target": {
                  "workflow_id": expected_workflow,
                  "ref": "main",
                  "expected_head_sha": os.environ["EVENT_MAIN_SHA"],
                  "dispatch_nonce": nonce,
                  "inputs": dict(inputs),
              },
          }
          authority = {
              "authority_status": "KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH_AUTHORITY_READY",
              "plan_read_allowed": True,
              "tool_discovery_allowed": True,
              "external_action_allowed": True,
              "workflow_dispatch_allowed": True,
              "run_reobservation_allowed": True,
              "mismatched_run_cancel_allowed": True,
              "receipt_write_allowed": True,
              "audit_append_allowed": True,
          }
          (root / "workflow_dispatch_request_v0_5.json").write_text(
              json.dumps(normalized, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (root / "github_mcp_workflow_dispatch_plan_v0_5.json").write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (root / "github_mcp_workflow_dispatch_authority_v0_5.json").write_text(
              json.dumps(authority, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Pull pinned official GitHub MCP Server
        shell: bash
        run: docker pull ghcr.io/github/github-mcp-server:v1.0.5

      - name: Dispatch workflow and reobserve exact run through official GitHub MCP Server
        id: dispatch
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/run_kuuos_github_mcp_workflow_dispatch_v0_5.py \
            artifacts/github-mcp-workflow-dispatch-v0-5 \
            --confirmation RUN_KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH \
            --repository "${REPOSITORY}" \
            --base-sha "${BASE_SHA}" \
            --poll-attempts 15 \
            --poll-interval-seconds 2 \
            --execute-external-actions \
            2>&1 | tee artifacts/github-mcp-workflow-dispatch-v0-5/run-output.json

      - name: Write dispatch evidence summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path

          path = Path("artifacts/github-mcp-workflow-dispatch-v0-5/github_mcp_workflow_dispatch_receipt_v0_5.json")
          print("## KuuOS GitHub MCP Workflow Dispatch v0.5")
          if not path.is_file():
              print("Receipt was not produced.")
              raise SystemExit(0)
          receipt = json.loads(path.read_text(encoding="utf-8"))
          print(f"- status: `{receipt.get('status', '')}`")
          print(f"- base SHA: `{receipt.get('base_sha', '')}`")
          print(f"- workflow: `{receipt.get('workflow_id', '')}`")
          print(f"- nonce: `{receipt.get('dispatch_nonce', '')}`")
          print(f"- dispatch accepted: `{receipt.get('dispatch_accepted', False)}`")
          print(f"- run observed: `{receipt.get('run_observed', False)}`")
          print(f"- run ID: `{receipt.get('run_id', 0)}`")
          print(f"- run head SHA: `{receipt.get('run_head_sha', '')}`")
          print(f"- run: {receipt.get('run_url', '') or '(not observed)' }")
          print(f"- mismatch cancellation attempted: `{receipt.get('mismatch_cancel_attempted', False)}`")
          print(f"- mismatch cancelled: `{receipt.get('mismatch_cancelled', False)}`")
          PY

      - name: Upload workflow dispatch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-github-mcp-workflow-dispatch-v0-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-mcp-workflow-dispatch-v0-5/
          if-no-files-found: error
          retention-days: 30

      - name: Comment request result and close verified request
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib import request

          receipt_path = Path("artifacts/github-mcp-workflow-dispatch-v0-5/github_mcp_workflow_dispatch_receipt_v0_5.json")
          if receipt_path.is_file():
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          else:
              receipt = {"status": "RECEIPT_NOT_PRODUCED"}
          status = str(receipt.get("status", ""))
          lines = [
              "## KuuOS GitHub MCP Workflow Dispatch v0.5",
              "",
              f"- status: `{status}`",
              f"- dispatcher run: {os.environ['RUN_URL']}",
              f"- target workflow: `{receipt.get('workflow_id', '')}`",
              f"- dispatch nonce: `{receipt.get('dispatch_nonce', '')}`",
              f"- observed run: {receipt.get('run_url', '') or '(not observed)' }",
              f"- observed head SHA: `{receipt.get('run_head_sha', '')}`",
              f"- mismatch cancelled: `{receipt.get('mismatch_cancelled', False)}`",
          ]
          body = json.dumps({"body": "\n".join(lines)}).encode()
          base = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }
          req = request.Request(base + "/comments", data=body, headers=headers, method="POST")
          with request.urlopen(req, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"request_comment_failed:{response.status}")
          if status == "KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH_VERIFIED":
              close_body = json.dumps({"state": "closed", "state_reason": "completed"}).encode()
              req = request.Request(base, data=close_body, headers=headers, method="PATCH")
              with request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"request_close_failed:{response.status}")
          PY
