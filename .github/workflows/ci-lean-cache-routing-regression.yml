name: Lean CI Cache Routing Regression

on:
  workflow_dispatch:
  push:
    branches: [research/verified-lean-production-routing-v1-20261126]
    paths:
      - '.github/workflows/ci-lean-cache-routing-regression.yml'
      - 'tests/test_ci_verified_lean_project_cache_v1.py'
  pull_request:
    paths:
      - '.github/workflows/codeai-*.yml'
      - '.github/workflows/lean-formal-validation.yml'
      - '.github/workflows/pr-governance-gate.yml'
      - '.github/workflows/ci-lean-cache-routing-regression.yml'
      - 'tests/test_ci_lean_cache_topology.py'
      - 'scripts/ci_codeai_lean_scope.py'
      - 'scripts/ci_subsystem_lean_scope.py'
      - 'scripts/select_lean_import_only_route.py'
      - 'tests/test_ci_f112_additive_root_route.py'
      - 'docs/CI_LEAN_CACHE_TOPOLOGY.md'
      - '.github/workflows/lean-certified-project-cache-v1.yml'
      - 'scripts/ci_verified_lean_project_cache_v1.py'
      - 'tests/test_ci_verified_lean_project_cache_v1.py'
      - 'docs/CI_VERIFIED_LEAN_CROSS_PR_CACHE_V1.md'

permissions:
  contents: read

jobs:
  routing:
    name: Check trusted Lake cache and strict target routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check cache key compatibility and canonical Lean authority
        run: >-
          python3 -m unittest -v
          tests.test_ci_lean_cache_topology
          tests.test_ci_f112_additive_root_route
          tests.test_ci_verified_lean_project_cache_v1
