name: KuuOS v1.88 R6 native CodeAI source-bound candidate/rejection
on:
  push:
    branches:
      - 'validation/kuuos-v188-r6-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-codeai-r6-proposal-governance:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real KuuOS CodeAI R6 source-bound CANDIDATE and authority REJECT
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r6_native_governance_v1.py
      - name: Save actual CodeAI R6 source-bound receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r6-native-codeai-receipt
          path: artifacts/codeai-v188-r6-native-governance
          retention-days: 30
          if-no-files-found: warn
