name: KuuOS v1.87 concrete B2N presentation gap obstruction
on:
  push:
    branches:
      - 'validation/kuuos-v187-concrete-gap-obstruction-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  concrete-universe-zero-gap-obstruction:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Verify v1.87 concrete witness exact source and 3 kernel axiom reports
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v187_concrete_gap_obstruction_v1.py --out /tmp/kuuos-v187-concrete-gap
      - name: Upload source-bound universe-zero obstruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v187-concrete-gap-universe-zero
          path: /tmp/kuuos-v187-concrete-gap
          retention-days: 30
          if-no-files-found: warn
