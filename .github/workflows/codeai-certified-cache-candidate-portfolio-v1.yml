name: CodeAI certified cache candidate portfolio v1
on:
  push:
    branches: [research/codeai-certified-cache-recall-v1-20261126]
    paths:
      - ".github/workflows/codeai-certified-cache-candidate-portfolio-v1.yml"
      - "scripts/codeai_certified_cache_candidate_portfolio_v1.py"
permissions:
  contents: read
  actions: read
env:
  CANONICAL_HEAD: e1d754e8e0fc9382001a2e698751aa11d4272b84
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
concurrency:
  group: codeai-certified-cache-candidate-portfolio-v1
  cancel-in-progress: false
jobs:
  sandbox:
    name: Actual CodeAI portfolio, candidate direct Lean and real MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.CANONICAL_HEAD }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore verified canonical project cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$CANONICAL_HEAD" python3 scripts/ci_verified_lean_project_cache_v1.py restore --base "$CANONICAL_HEAD"
      - name: Require actual cache hit, build selected module
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          SCOPE: ${{ steps.cache.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build +Kuu.LivingEngi.SourceAwareOverlapDescentCriterion
      - name: Generate two actual structured candidate patches and compare direct Lean
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/codeai_certified_cache_candidate_portfolio_v1.py --head "$CANONICAL_HEAD" --phase direct --out artifacts/codeai-portfolio
      - name: Install actual Lean MCP launcher
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Actual Lean MCP diagnostics and verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/codeai_certified_cache_candidate_portfolio_v1.py --head "$CANONICAL_HEAD" --phase mcp --out artifacts/codeai-portfolio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-portfolio-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codeai-portfolio/
          if-no-files-found: warn
  independent:
    name: Independent CodeAI candidate replay and Lean validation
    needs: sandbox
    if: needs.sandbox.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: codeai-portfolio-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: first-recall
      - name: Install pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.CANONICAL_HEAD }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore verified canonical project cache
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$CANONICAL_HEAD" python3 scripts/ci_verified_lean_project_cache_v1.py restore --base "$CANONICAL_HEAD"
      - name: Require actual cache hit, build selected module
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          SCOPE: ${{ steps.cache.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build +Kuu.LivingEngi.SourceAwareOverlapDescentCriterion
      - name: Independently regenerate admitted patches and compare Lean evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/codeai_certified_cache_candidate_portfolio_v1.py --head "$CANONICAL_HEAD" --phase independent --out artifacts/codeai-portfolio --first first-recall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-portfolio-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codeai-portfolio/
          if-no-files-found: warn
