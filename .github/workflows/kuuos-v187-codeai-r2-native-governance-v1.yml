name: KuuOS v1.87 R2 native CodeAI source-bound governed synthesis
on:
  push:
    branches:
      - 'validation/kuuos-v187-codeai-r2-native-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-codeai-r2-candidate-governance:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source-bound CodeAI replay HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real native CodeAI observation, synthesis, patch governance and authority rejection
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v187_codeai_r2_native_governance_v1.py
      - name: Upload append-only CodeAI advisory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v187-r2-native-codeai-receipt
          path: artifacts/codeai-v187-r2-native-governance
          retention-days: 30
          if-no-files-found: warn
