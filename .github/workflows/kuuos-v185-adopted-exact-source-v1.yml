name: KuuOS v1.85 adopted fixed point order iso pinned Lean and 20 axioms
on:
  push:
    branches:
      - 'fix/kuuos-v127-v129-ulift-20261115'
    paths:
      - 'formal/KUOS/DependentOriginationGeneratedPresentationFixedPointOrderIsoV1_85.lean'
      - 'formal/KUOS/DependentOriginationGeneratedPresentationFixedPointOrderIsoCodeAICandidateV1_85.lean'
      - 'scripts/ci_kuuos_v185_adopted_exact_source_v1.py'
      - '.github/workflows/kuuos-v185-adopted-exact-source-v1.yml'
      - 'tests/test_public_root_restoration.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v185-adopted-original-name-20-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Compile original v1.85 and independently audit 20 public declarations
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v185_adopted_exact_source_v1.py --out /tmp/kuuos-v185-pr-adopted-20
      - name: Preserve original-name strict Lean and axiom receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v185-pr-adopted-20
          path: /tmp/kuuos-v185-pr-adopted-20
          retention-days: 30
          if-no-files-found: warn
