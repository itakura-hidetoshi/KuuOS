name: CodeAI certified no-go recall pre-provider gate v1
on:
  push:
    branches: [research/codeai-nogo-memory-v1-20261126]
    paths:
      - ".github/workflows/codeai-certified-no-go-recall-v1.yml"
      - "scripts/check_codeai_certified_no_go_recall_v1.py"
      - "runtime/kuuos_codeai_certified_no_go_recall_v1.py"
      - "memoryos/codeai_selected_no_go_certified_lineage_v1.json"
permissions:
  contents: read
  actions: read
env:
  CANONICAL_HEAD: e1d754e8e0fc9382001a2e698751aa11d4272b84
concurrency:
  group: codeai-certified-no-go-recall-v1
  cancel-in-progress: false
jobs:
  sandbox:
    name: Actual historical no-go projection and pre-provider boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable historical artifacts and six selected routes before provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_certified_no_go_recall_v1.py --head "$CANONICAL_HEAD" --out artifacts/certified-no-go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-certified-no-go-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/certified-no-go/*.json
          if-no-files-found: warn
  independent:
    name: Independent reconstruction of exact no-go pre-provider boundary
    needs: sandbox
    if: needs.sandbox.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: codeai-certified-no-go-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: first-recall
      - name: Independently replay actual historical evidence and compare receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_certified_no_go_recall_v1.py --head "$CANONICAL_HEAD" --out artifacts/certified-no-go --first first-recall/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-certified-no-go-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/certified-no-go/*.json
          if-no-files-found: warn
