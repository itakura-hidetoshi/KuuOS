name: KuuOS PR Governance Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kuuos-pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select impacted audit checks
    runs-on: ubuntu-24.04
    outputs:
      python_matrix: ${{ steps.selection.outputs.python_matrix }}
      python_count: ${{ steps.selection.outputs.python_count }}
      lean_required: ${{ steps.selection.outputs.lean_required }}
      full_audit_required: ${{ steps.selection.outputs.full_audit_required }}
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison refs
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "base=${PR_BASE_SHA}" >> "${GITHUB_OUTPUT}"
            echo "head=${PR_HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          else
            git fetch origin main --depth=2
            echo "base=origin/main" >> "${GITHUB_OUTPUT}"
            echo "head=${CURRENT_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Select checks with fail-closed fallback
        id: selection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/selection
          python3 scripts/select_impacted_checks.py \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}' \
            --output artifacts/selection/selection.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Upload selection receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection/selection.json
          if-no-files-found: error
          retention-days: 14

  python-checks:
    name: ${{ matrix.check.name }}
    needs: select
    if: needs.select.outputs.python_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        check: ${{ fromJSON(needs.select.outputs.python_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download selection receipt
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Run selected check
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 scripts/run_ci_check.py \
            --check-id '${{ matrix.check.id }}' \
            --command '${{ matrix.check.command }}' \
            --selection artifacts/selection/selection.json

      - name: Upload check receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-${{ matrix.check.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: warn
          retention-days: 14

  lean-formal:
    name: Strict Lean formal validation
    needs: select
    if: needs.select.outputs.lean_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download selection receipt
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Set up pinned Lean, Mathlib, and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Run selected Lean check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_ci_check.py \
            --check-id lean-formal \
            --command 'lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KuuOSFormal' \
            --selection artifacts/selection/selection.json

      - name: Verify committed dependency manifest remains canonical
        shell: bash
        run: git diff --exit-code -- lake-manifest.json

      - name: Upload Lean receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-lean-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: warn
          retention-days: 14

  governance-gate:
    name: Governance gate and audit summary
    needs:
      - select
      - python-checks
      - lean-formal
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download selection receipt
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Download check receipts
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: audit-check-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/receipts
          merge-multiple: true

      - name: Build audit summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_audit_summary.py \
            --selection artifacts/selection/selection.json \
            --receipts-root artifacts/receipts \
            --output-dir artifacts/summary \
            --python-result '${{ needs.python-checks.result }}' \
            --lean-result '${{ needs.lean-formal.result }}'

      - name: Publish report in job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/summary/audit-report.md ]]; then
            cat artifacts/summary/audit-report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/summary/
          if-no-files-found: warn
          retention-days: 30

  chatgpt-completion-dispatch:
    name: Emit secondary CI completion dispatch
    needs: governance-gate
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Dispatch exact source-run identity
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_WORKFLOW: KuuOS PR Governance Gate
          SOURCE_CONCLUSION: ${{ needs.governance-gate.result }}
        run: |
          set -uo pipefail
          request_body="${RUNNER_TEMP}/chatgpt-ci-completion-dispatch.json"
          response_body="${RUNNER_TEMP}/chatgpt-ci-completion-dispatch-response.txt"
          python3 - "${request_body}" <<'PY'
          import json
          import os
          import pathlib
          import sys

          body = {
              "event_type": "kuuos_ci_completion_v1_1",
              "client_payload": {
                  "repository": os.environ["REPOSITORY"],
                  "pull_request": int(os.environ["PR_NUMBER"]),
                  "run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
                  "head_sha": os.environ["SOURCE_HEAD_SHA"],
                  "head_branch": os.environ["SOURCE_HEAD_BRANCH"],
                  "workflow": os.environ["SOURCE_WORKFLOW"],
                  "workflow_name": os.environ["SOURCE_WORKFLOW"],
                  "status": "completed",
                  "conclusion": os.environ["SOURCE_CONCLUSION"],
                  "run_event": "pull_request",
                  "required_job_names": ["Governance gate and audit summary"],
                  "required_step_names": ["Build audit summary"],
              },
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(body, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

          http_code="$(curl \
            --silent \
            --show-error \
            --output "${response_body}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@${request_body}" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/dispatches" || true)"
          if [ -z "${http_code}" ]; then
            http_code="000"
          fi
          echo "http_code=${http_code}" >> "${GITHUB_OUTPUT}"
          if [ "${http_code}" != "204" ]; then
            echo "::warning::secondary ChatGPT CI completion dispatch failed with HTTP ${http_code}"
            cat "${response_body}" || true
          fi
          exit 0

      - name: Publish dispatch summary
        if: always()
        run: |
          {
            echo '## Secondary ChatGPT CI completion dispatch'
            echo
            echo '- Event type: `kuuos_ci_completion_v1_1`'
            echo '- Source workflow: `KuuOS PR Governance Gate`'
            echo '- Source run: `${{ github.run_id }}` attempt `${{ github.run_attempt }}`'
            echo '- Exact PR head: `${{ github.event.pull_request.head.sha }}`'
            echo '- Dispatch HTTP status: `${{ steps.dispatch.outputs.http_code || 'unknown' }}`'
            echo '- Dispatch is a wake-up request only and grants no CI truth or merge/write authority.'
          } >> "${GITHUB_STEP_SUMMARY}"

