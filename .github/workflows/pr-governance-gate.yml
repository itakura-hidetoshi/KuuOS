name: KuuOS PR Governance Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kuuos-pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select impacted audit checks
    runs-on: ubuntu-24.04
    outputs:
      python_matrix: ${{ steps.selection.outputs.python_matrix }}
      python_count: ${{ steps.selection.outputs.python_count }}
      lean_required: ${{ steps.selection.outputs.lean_required }}
      full_audit_required: ${{ steps.selection.outputs.full_audit_required }}
      comparison_mode: ${{ steps.refs.outputs.mode }}
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve comparison refs
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            git fetch origin main --depth=2
            echo "base=origin/main" >> "${GITHUB_OUTPUT}"
            echo "head=${CURRENT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "mode=full-dispatch" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base="${PR_BASE_SHA}"
          head="${PR_HEAD_SHA}"
          mode="full-pr"

          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then
            while IFS='|' read -r run_id candidate_sha run_status; do
              [[ -n "${run_id}" && -n "${candidate_sha}" ]] || continue
              [[ "${run_id}" != "${CURRENT_RUN_ID}" ]] || continue
              [[ "${run_status}" == "completed" ]] || continue
              git cat-file -e "${candidate_sha}^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "${candidate_sha}" "${head}" || continue

              nonlean_count="$(
                gh api -X GET "repos/${REPOSITORY}/actions/runs/${run_id}/jobs" \
                  -f per_page=100 \
                  --jq '[.jobs[]
                    | select(.name != "Select impacted audit checks")
                    | select(.name != "Strict Lean formal validation")
                    | select(.name != "Governance gate and audit summary")
                    | select(.name != "Persist CI completion signal")] | length'
              )"
              nonlean_bad_count="$(
                gh api -X GET "repos/${REPOSITORY}/actions/runs/${run_id}/jobs" \
                  -f per_page=100 \
                  --jq '[.jobs[]
                    | select(.name != "Select impacted audit checks")
                    | select(.name != "Strict Lean formal validation")
                    | select(.name != "Governance gate and audit summary")
                    | select(.name != "Persist CI completion signal")
                    | select(.conclusion != "success" and .conclusion != "skipped")] | length'
              )"
              [[ "${nonlean_count}" -gt 0 && "${nonlean_bad_count}" == "0" ]] || continue

              mapfile -t delta_paths < <(
                git diff --name-only --diff-filter=ACMR "${candidate_sha}...${head}"
              )
              [[ "${#delta_paths[@]}" -gt 0 ]] || continue

              lean_only=true
              for changed_path in "${delta_paths[@]}"; do
                if [[ ! "${changed_path}" =~ ^formal/.+\.lean$ ]]; then
                  lean_only=false
                  break
                fi
              done
              [[ "${lean_only}" == "true" ]] || continue

              base="${candidate_sha}"
              mode="validated-lean-incremental"
              break
            done < <(
              gh api -X GET \
                "repos/${REPOSITORY}/actions/workflows/pr-governance-gate.yml/runs" \
                -f event=pull_request \
                -f branch="${PR_HEAD_REF}" \
                -f per_page=10 \
                --jq '.workflow_runs[] | "\(.id)|\(.head_sha)|\(.status)"'
            )
          fi

          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Select checks with fail-closed fallback
        id: selection
        shell: bash
        env:
          COMPARISON_MODE: ${{ steps.refs.outputs.mode }}
          COMPARISON_BASE: ${{ steps.refs.outputs.base }}
          COMPARISON_HEAD: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/selection
          extra_args=()
          if [[ "${COMPARISON_MODE}" == "validated-lean-incremental" ]]; then
            extra_args+=(--validated-lean-incremental)
          fi
          python3 scripts/select_impacted_checks.py \
            --base "${COMPARISON_BASE}" \
            --head "${COMPARISON_HEAD}" \
            --output artifacts/selection/selection.json \
            --github-output "${GITHUB_OUTPUT}" \
            "${extra_args[@]}"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("artifacts/selection/selection.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["comparison_mode"] = os.environ["COMPARISON_MODE"]
          data["comparison_base"] = os.environ["COMPARISON_BASE"]
          data["comparison_head"] = os.environ["COMPARISON_HEAD"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload selection receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection/selection.json
          if-no-files-found: error
          retention-days: 14

  python-checks:
    name: ${{ matrix.check.name }}
    needs: select
    if: needs.select.outputs.python_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        check: ${{ fromJSON(needs.select.outputs.python_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download selection receipt
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Run selected check
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 scripts/run_ci_check.py \
            --check-id '${{ matrix.check.id }}' \
            --command '${{ matrix.check.command }}' \
            --selection artifacts/selection/selection.json

      - name: Upload check receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-${{ matrix.check.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: warn
          retention-days: 14

  lean-formal:
    name: Strict Lean formal validation
    needs: select
    if: needs.select.outputs.lean_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download selection receipt
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Run selected Lean check
        shell: bash
        run: |
          set -euo pipefail
          LEAN_COMMAND="$(
            python3 - <<'PY'
          import json
          import pathlib
          import shlex

          selection = json.loads(
              pathlib.Path("artifacts/selection/selection.json").read_text(encoding="utf-8")
          )
          targets = selection.get("lean_targets")
          if not isinstance(targets, list) or not targets or not all(isinstance(t, str) for t in targets):
              raise SystemExit("missing or invalid lean_targets in selection receipt")
          argv = [
              "lake",
              "-KleanArgs=-DwarningAsError=true",
              "-KleanArgs=-DsorryAsError=true",
              "build",
              *targets,
          ]
          print(shlex.join(argv))
          PY
          )"
          echo "Lean command: ${LEAN_COMMAND}"
          python3 scripts/run_ci_check.py \
            --check-id lean-formal \
            --command "${LEAN_COMMAND}" \
            --selection artifacts/selection/selection.json

      - name: Verify committed dependency manifest remains canonical
        shell: bash
        run: git diff --exit-code -- lake-manifest.json

      - name: Upload Lean receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-lean-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: warn
          retention-days: 14

  governance-gate:
    name: Governance gate and audit summary
    needs:
      - select
      - python-checks
      - lean-formal
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download selection receipt
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Download check receipts
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: audit-check-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/receipts
          merge-multiple: true

      - name: Build audit summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_audit_summary.py \
            --selection artifacts/selection/selection.json \
            --receipts-root artifacts/receipts \
            --output-dir artifacts/summary \
            --python-result '${{ needs.python-checks.result }}' \
            --lean-result '${{ needs.lean-formal.result }}'

      - name: Publish report in job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/summary/audit-report.md ]]; then
            cat artifacts/summary/audit-report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/summary/
          if-no-files-found: warn
          retention-days: 30


  completion-signal:
    name: Persist CI completion signal
    needs:
      - governance-gate
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile durable terminal signal
        continue-on-error: true
        env:
          GATE_RESULT: ${{ needs.governance-gate.result }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p .kuuos/github-ci-durable-reentry-inbox-v1-3
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          terminal = {
              "success", "failure", "cancelled", "timed_out", "neutral",
              "skipped", "stale", "action_required", "startup_failure",
          }
          conclusion = os.environ.get("GATE_RESULT", "failure")
          if conclusion not in terminal:
              conclusion = "failure"
          payload = {
              "version": "kuuos_pr_governance_gate_completion_sender_v0_1",
              "repository": os.environ["REPOSITORY"],
              "run_id": int(os.environ["RUN_ID"]),
              "workflow_name": "KuuOS PR Governance Gate",
              "head_sha": os.environ["PR_HEAD_SHA"].lower(),
              "head_branch": os.environ["PR_HEAD_REF"],
              "status": "completed",
              "conclusion": conclusion,
              "run_event": "pull_request",
              "pr_number": int(os.environ["PR_NUMBER"]),
              "pr_base_branch": os.environ["PR_BASE_REF"],
              "required_job_names": ["Governance gate and audit summary"],
              "required_step_names": [],
              "source_job_conclusion": conclusion,
              "destination_repository": os.environ["REPOSITORY"],
              "source_event_digest": "",
              "source_jobs_digest": "",
              "event_is_wakeup_signal_only": True,
              "fresh_mcp_reobservation_required": True,
          }
          raw = {"action": "completed", "client_payload": payload}
          Path(".kuuos/github-ci-durable-reentry-inbox-v1-3/normalized_event.json").write_text(
              json.dumps(raw, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python3 runtime/kuuos_github_ci_durable_reentry_inbox_v1_3.py             --event .kuuos/github-ci-durable-reentry-inbox-v1-3/normalized_event.json             --output-dir .kuuos/github-ci-durable-reentry-inbox-v1-3

      - name: Persist pending signal as deduplicated GitHub Issue
        if: always()
        continue-on-error: true
        env:
          KUUOS_INBOX_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KUUOS_INBOX_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          spec_path=".kuuos/github-ci-durable-reentry-inbox-v1-3/ci_reentry_issue_spec.json"
          [[ -f "${spec_path}" ]] || exit 0
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          spec = json.loads(
              Path(".kuuos/github-ci-durable-reentry-inbox-v1-3/ci_reentry_issue_spec.json")
              .read_text(encoding="utf-8")
          )
          token = os.environ["KUUOS_INBOX_TOKEN"]
          repository = os.environ["KUUOS_INBOX_REPOSITORY"]
          owner, repo = repository.split("/", 1)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "KuuOS-PR-Governance-Terminal-Signal-v0.1",
          }
          query = urllib.parse.urlencode({"q": spec["dedupe_query"], "per_page": 100})
          req = urllib.request.Request(
              f"https://api.github.com/search/issues?{query}", headers=headers
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              search = json.load(response)
          exact = [item for item in search.get("items", []) if item.get("title") == spec["title"]]
          if exact:
              issue = exact[0]
              created = False
          else:
              body = json.dumps(
                  {"title": spec["title"], "body": spec["body"]},
                  ensure_ascii=False,
              ).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{owner}/{repo}/issues",
                  data=body,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  issue = json.load(response)
              created = True
          print(
              "KUUOS_CI_TERMINAL_SIGNAL "
              f"issue={issue.get('number')} created={created} run_id=${{ github.run_id }}"
          )
          PY
