name: KuuOS PR Governance Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: kuuos-pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select impacted audit checks
    runs-on: ubuntu-24.04
    outputs:
      python_matrix: ${{ steps.selection.outputs.python_matrix }}
      python_count: ${{ steps.selection.outputs.python_count }}
      lean_required: ${{ steps.selection.outputs.lean_required }}
      full_audit_required: ${{ steps.selection.outputs.full_audit_required }}
      lean_fastpath: ${{ steps.fastpath.outputs.enabled }}
      lean_f47_heavy: ${{ steps.fastpath.outputs.lean_f47_heavy }}
      comparison_mode: ${{ steps.refs.outputs.mode }}
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test exact comparison commit resolution
        run: python3 -m unittest -v tests.test_kuu_ci_comparison_refs tests.test_ci_comparison_history

      - name: Resolve comparison refs
        id: refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            git fetch --no-tags origin refs/heads/main
            base="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
            python3 scripts/ensure_ci_comparison.py --base "${base}" --head "${CURRENT_SHA}"
            echo "base=${base}" >> "${GITHUB_OUTPUT}"
            echo "head=${CURRENT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "mode=full-dispatch" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base="${PR_BASE_SHA}"
          head="${PR_HEAD_SHA}"
          mode="full-pr"
          python3 scripts/ensure_ci_comparison.py --base "${base}" --head "${head}"

          if [[ "${EVENT_ACTION}" == "synchronize" ]]; then
            candidate="$(python3 scripts/select_ci_incremental_base.py \
              --base "${base}" --head "${head}" --branch "${PR_HEAD_REF}" \
              --repository "${REPOSITORY}" --current-run-id "${CURRENT_RUN_ID}")"
            if [[ -n "${candidate}" ]]; then
              base="${candidate}"
              mode="validated-lean-incremental"
            fi
          fi

          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "head=${head}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Select checks with fail-closed fallback
        id: selection
        shell: bash
        env:
          COMPARISON_MODE: ${{ steps.refs.outputs.mode }}
          COMPARISON_BASE: ${{ steps.refs.outputs.base }}
          COMPARISON_HEAD: ${{ steps.refs.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/selection
          extra_args=()
          if [[ "${COMPARISON_MODE}" == "validated-lean-incremental" ]]; then
            extra_args+=(--validated-lean-incremental)
          fi
          python3 scripts/select_impacted_checks.py \
            --base "${COMPARISON_BASE}" \
            --head "${COMPARISON_HEAD}" \
            --output artifacts/selection/selection.json \
            --github-output "${GITHUB_OUTPUT}" \
            "${extra_args[@]}"

          python3 - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path("artifacts/selection/selection.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["comparison_mode"] = os.environ["COMPARISON_MODE"]
          data["comparison_base"] = os.environ["COMPARISON_BASE"]
          data["comparison_head"] = os.environ["COMPARISON_HEAD"]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Classify certified one-file historical Lean fast path
        id: fastpath
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          s = json.loads(Path("artifacts/selection/selection.json").read_text())
          py, selected = s.get("python_matrix", []), s.get("selected_checks", [])
          known = {"workflow-integrity", "kuu-independent-foundation"}
          fast = (
              s.get("changed_paths") == ["formal/KuuOSFormal/HistoricalF36F40BridgeP4.lean"]
              and s.get("lean_targets") == ["KuuOSFormal.HistoricalF36F40BridgeP4"]
              and s.get("lean_required") is True
              and s.get("full_audit_required") is False
              and isinstance(py, list) and isinstance(selected, list)
              and len(py) <= 2
              and all(isinstance(x, dict) and x.get("id") in known
                      and isinstance(x.get("command"), str) and x["command"] for x in py)
              and len(selected) == len(py) + 1
              and {x.get("id") for x in selected if isinstance(x, dict)}
                  == {"lean-formal"} | {x["id"] for x in py}
          )
          # Any F112 historical bridge that transitively imports actual
          # F47 needs the heavy dependency budget, including P16, P17, etc.
          # This affects only the deadline: ALL selected Lean targets,
          # kernel validation, warning severity, and axioms remain unchanged.
          changed = s.get("changed_paths", [])
          if not isinstance(changed, list) or not all(isinstance(x, str) for x in changed):
              raise SystemExit("invalid changed_paths for F47 workload classification")
          f47_import = "import KUOS.DependentOriginationGrayC60MixedBoundaryThreeHomV5_195"
          bridge_prefix = "import KuuOSFormal.HistoricalF36F40BridgeP"

          def reaches_original_f47(path: Path, visited: set[Path]) -> bool:
              if path in visited:
                  return False
              visited.add(path)
              if not path.is_file():
                  return False
              lines = path.read_text(encoding="utf-8").splitlines()
              if f47_import in lines:
                  return True
              for line in lines:
                  if line.startswith(bridge_prefix):
                      module = line.removeprefix("import ").strip()
                      imported = Path("formal") / Path(*module.split(".")).with_suffix(".lean")
                      if reaches_original_f47(imported, visited):
                          return True
              return False

          heavy_f47 = fast or any(
              reaches_original_f47(Path(path), set())
              for path in changed
              if path.startswith("formal/KuuOSFormal/HistoricalF36F40BridgeP")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"enabled={str(fast).lower()}\n")
              f.write(f"lean_f47_heavy={str(heavy_f47).lower()}\n")
          print(f"Focused Lean single-source path: {fast}; original F47: {heavy_f47}")
          PY

      - name: Upload selection receipt
        uses: actions/upload-artifact@v4
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection/selection.json
          if-no-files-found: error
          retention-days: 14

      # Reuse this same Actions runner for the at most two authorized
      # single-file static checks. No check is omitted, and other PRs
      # retain the fail-closed parallel matrix.
      - name: Python 3.12 for focused static checks
        if: steps.fastpath.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run selected static checks without another runner
        if: steps.fastpath.outputs.enabled == 'true'
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          path = "artifacts/selection/selection.json"
          checks = json.loads(Path(path).read_text())["python_matrix"]
          if any(c["id"] not in {"workflow-integrity", "kuu-independent-foundation"} for c in checks):
              raise SystemExit("invalid focused static check selection")
          failed = False
          for c in checks:
              print("Checking:", c["id"], flush=True)
              code = subprocess.run([sys.executable, "scripts/run_ci_check.py",
                   "--check-id", c["id"], "--command", c["command"],
                   "--selection", path], check=False).returncode
              failed |= code != 0
          if failed:
              raise SystemExit("selected static check failed")
          PY

      - name: Upload inline static check receipts
        if: always() && steps.fastpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-fastpath-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: error
          retention-days: 14

  python-checks:
    name: ${{ matrix.check.name }}
    needs: select
    if: needs.select.outputs.python_count != '0' && needs.select.outputs.lean_fastpath != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        check: ${{ fromJSON(needs.select.outputs.python_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download selection receipt
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Run selected check
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 scripts/run_ci_check.py \
            --check-id '${{ matrix.check.id }}' \
            --command '${{ matrix.check.command }}' \
            --selection artifacts/selection/selection.json

      - name: Upload check receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-${{ matrix.check.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: warn
          retention-days: 14

  lean-formal:
    name: Strict Lean formal validation
    needs: select
    if: needs.select.outputs.lean_required == 'true'
    runs-on: ubuntu-24.04
    # F112 P4/P15 with genuine historical F47 imports requires a longer
    # cold-build ceiling even when multiple preserved source files are changed.
    # The Lean targets, public roots, strict lints, and axiom audits are unchanged.
    # Cached exact-head rebuilds generally use the shorter actual wall time.
    timeout-minutes: ${{ needs.select.outputs.lean_f47_heavy == 'true' && 100 || (needs.select.outputs.lean_fastpath == 'true' && 50 || 30) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download selection receipt
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      # Restore the multi-GB Mathlib/package workspace from main, using
      # the exact base SHA if available and a validated prior main fallback.
      # A separate smaller F112 base build overlay is applied below.
      # All restored oleans are still checked by Lake.
      - name: Restore validated parent/main Lake workspace cache
        id: lean-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # The validated base/main workspace key can be absent when a branch was
      # published with [skip ci]. In that case restore the already available
      # leanprover/lean-action cache, whose documented key starts with lake-.
      # This is restore-only; it neither adds a new CI job nor overwrites
      # the trusted main cache. Lake checks all source dependencies as usual.
      - name: Restore shared lean-action Lake cache on main cache miss
        if: steps.lean-workspace-cache.outputs.cache-matched-key == ''
        id: lean-action-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report shared lean-action cache restore
        if: steps.lean-workspace-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.lean-action-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "lean-action Lake cache matched key: ${CACHE_MATCHED_KEY:-none}"

      - name: Report Lake workspace cache restore
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lean-workspace-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.lean-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "Lake cache exact hit: ${CACHE_HIT:-false}"
          echo "Lake cache matched key: ${CACHE_MATCHED_KEY:-none}"

      # Child F112 PRs reuse the strictly validated P-stage compiled
      # module spine from their actual PR BASE branch. This is a ~0.2 GB
      # project-only cache, layered over the shared main package workspace.
      - name: Restore verified F112 parent project build overlay
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'formal/v5-293-f112-independent-total-change'
        id: f112-parent-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-f112-base-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            kuuos-f112-base-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report F112 parent project build restore
        if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'formal/v5-293-f112-independent-total-change'
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.f112-parent-build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "F112 parent project cache: ${CACHE_MATCHED_KEY:-miss}"

      # Overlay the most recent local project build from this PR only.  This
      # cache is never restored by main and therefore cannot contaminate the
      # trusted default-branch Lake workspace.  It lets a RED Lean iteration
      # reuse the successfully compiled dependency prefix on the next head.
      - name: Restore PR-local Lean build overlay
        if: github.event_name == 'pull_request'
        id: lean-pr-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-

      - name: Report PR-local Lean build overlay restore
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lean-pr-build-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.lean-pr-build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "PR build cache exact hit: ${CACHE_HIT:-false}"
          echo "PR build cache matched key: ${CACHE_MATCHED_KEY:-none}"

      - name: Set up pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      # Main and lean-action caches both contain pinned Mathlib and may
      # contain prior KuuOS oleans. Avoid refreshing dependency mtimes when
      # EITHER full workspace cache was restored. The PR-local build overlay
      # is restored independently above and remains scoped to this PR.
      - name: Fetch Mathlib cache on Lake workspace cache miss
        if: steps.lean-workspace-cache.outputs.cache-matched-key == '' && steps.lean-action-workspace-cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Run selected Lean check
        shell: bash
        run: |
          set -euo pipefail
          LEAN_COMMAND="$(
            python3 - <<'PY'
          import json
          import pathlib
          import shlex

          selection = json.loads(
              pathlib.Path("artifacts/selection/selection.json").read_text(encoding="utf-8")
          )
          targets = selection.get("lean_targets")
          if not isinstance(targets, list) or not targets or not all(isinstance(t, str) for t in targets):
              raise SystemExit("missing or invalid lean_targets in selection receipt")
          argv = [
              "lake",
              "-KleanArgs=-DwarningAsError=true",
              "-KleanArgs=-DsorryAsError=true",
              "build",
              *targets,
          ]
          # P4 is a mixed old/new import closure: retained historical
          # linter warnings are diagnostic, while new P4 is checked strictly.
          # The source-only PR still runs the same one Lean check/job.
          if targets == ["KuuOSFormal.HistoricalF36F40BridgeP4"]:
              argv = ["python3", "scripts/run_p4_scoped_strict_lean.py"]
          print(shlex.join(argv))
          PY
          )"
          echo "Lean command: ${LEAN_COMMAND}"
          python3 scripts/run_ci_check.py \
            --check-id lean-formal \
            --command "${LEAN_COMMAND}" \
            --selection artifacts/selection/selection.json

      # Save only the local project build, never the package tree.  Even when
      # the selected target is RED, the compiled dependency prefix is valid
      # for the exact source files that produced it and remains scoped to this
      # pull request.  A changed source on the next head is still rebuilt by Lake.
      - name: Save PR-local Lean build overlay
        if: always() && github.event_name == 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify committed dependency manifest remains canonical
        shell: bash
        run: git diff --exit-code -- lake-manifest.json

      - name: Upload Lean receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-check-lean-formal-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/checks/
          if-no-files-found: warn
          retention-days: 14

  governance-gate:
    name: Governance gate and audit summary
    permissions:
      contents: read
      statuses: write
    needs:
      - select
      - python-checks
      - lean-formal
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download selection receipt
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: audit-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/selection

      - name: Download check receipts
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          pattern: audit-check-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/receipts
          merge-multiple: true

      - name: Build audit summary
        id: audit-summary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_audit_summary.py \
            --selection artifacts/selection/selection.json \
            --receipts-root artifacts/receipts \
            --output-dir artifacts/summary \
            --python-result '${{ needs.python-checks.result }}' \
            --lean-result '${{ needs.lean-formal.result }}'

      - name: Publish report in job summary
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/summary/audit-report.md ]]; then
            cat artifacts/summary/audit-report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/summary/
          if-no-files-found: warn
          retention-days: 30

      # Keep both exact-head status contexts, but publish from this
      # already-running job (success or failure), eliminating TWO runners.
      - name: Publish Lean and CI completion receipts
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SELECT_RESULT: ${{ needs.select.result }}
          PYTHON_RESULT: ${{ needs.python-checks.result }}
          LEAN_REQUIRED: ${{ needs.select.outputs.lean_required }}
          LEAN_RESULT: ${{ needs.lean-formal.result }}
          AUDIT_RESULT: ${{ steps.audit-summary.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          e = os.environ
          lean_required = e["LEAN_REQUIRED"] == "true"
          lean_ok = e["LEAN_RESULT"] == "success"
          passed = (e["SELECT_RESULT"] == "success"
                    and e["AUDIT_RESULT"] == "success"
                    and e["PYTHON_RESULT"] in {"success", "skipped"}
                    and (not lean_required or lean_ok))
          payloads = []
          if lean_required:
              payloads.append((
                  "chatgpt-ci-receipt/KuuOS Strict Lean formal validation",
                  "success" if lean_ok else "failure",
                  f"exact-head Lean; run {e['RUN_ID']} attempt {e['RUN_ATTEMPT']}: {e['LEAN_RESULT']}"))
          payloads.append((
              "chatgpt-ci-receipt/KuuOS exact-head terminal",
              "success" if passed else "failure",
              f"exact-head terminal; {e['HEAD_SHA'][:12]} run {e['RUN_ID']} "
              f"attempt {e['RUN_ATTEMPT']}: {'success' if passed else 'failure'}"))
          url = f"{e['GITHUB_API_URL']}/repos/{e['REPOSITORY']}/statuses/{e['HEAD_SHA']}"
          for context, state, desc in payloads:
              body = json.dumps({"state": state, "context": context,
                  "target_url": e["RUN_URL"], "description": desc[:140]},
                  separators=(",", ":"))
              proc = subprocess.run(["curl", "--fail-with-body", "--silent", "--show-error",
                  "--request", "POST", "--header", "Accept: application/vnd.github+json",
                  "--header", f"Authorization: Bearer {e['GH_TOKEN']}",
                  "--header", "X-GitHub-Api-Version: 2022-11-28",
                  "--header", "Content-Type: application/json",
                  "--data-binary", "@-", url],
                  input=body, text=True, stdout=subprocess.DEVNULL)
              if proc.returncode:
                  raise SystemExit(f"cannot publish {context}")
              print(f"Published {context}: {state}")
          if not passed:
              sys.exit("exact-head CI audit unsuccessful")
          PY
