name: KuuOS v1.106 exact-source independent Strict Lean and axioms v2

on:
  pull_request:
    paths:
      - "formal/KUOS/DependentOriginationDoubleDeloopingTypeAFourHornLabelTableV1_106.lean"
      - "scripts/kuuos_v1106_four_stage_admission_v1.py"
      - ".github/workflows/kuuos-v1106-four-stage-gated-independent-v2.yml"

permissions:
  contents: read
  actions: read

jobs:
  independent-typed-label-source-and-kernel:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout exact PR source, separate from CodeAI runner
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download exact CodeAI direct Lean plus real MCP evidence
        uses: actions/download-artifact@v4
        with:
          name: kuuos-v1106-codeai-label-table-round4b-43691061761
          run-id: 43691061761
          github-token: ${{ github.token }}
          path: /tmp/kuuos-v1106-evidence
      - name: Enforce source-blob identical to prior direct Lean and real MCP
        env:
          EVIDENCE_DIR: /tmp/kuuos-v1106-evidence
          PROMOTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1106_four_stage_admission_v1.py
          PYTHONPATH=. python3 scripts/kuuos_v1106_four_stage_admission_v1.py
      - name: Setup pinned Lean v4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned parent build cache read-only
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve exact pinned mathlib
        run: lake exe cache get
      - name: Independent full imported dependency Strict Lean
        run: |
          set -euo pipefail
          timeout 3000 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAFourHornLabelTableV1_106 2>&1 | tee /tmp/kuuos-v1106-independent/build.log
      - name: Independent kernel axiom audit for two new declarations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root='KUOS.DependentOriginationDoubleDeloopingTypeAFourHornLabelTableV1_106.'
          names=['natFourHornLabels','natFourHornLabels_strict']
          lines=['import KUOS.DependentOriginationDoubleDeloopingTypeAFourHornLabelTableV1_106','']
          for name in names:
              lines.extend(['#check '+root+name, '#print axioms '+root+name])
          Path('/tmp/kuuos-v1106-independent/AxiomAudit.lean').write_text('\n'.join(lines)+'\n')
          PY
          lake env lean -DwarningAsError=true -Dweak.sorryAsError=true /tmp/kuuos-v1106-independent/AxiomAudit.lean 2>&1 | tee /tmp/kuuos-v1106-independent/axioms.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          log=Path('/tmp/kuuos-v1106-independent/axioms.log').read_text()
          assert not re.search(r'(?m)(warning:|error:|sorryAx)', log), 'Lean warnings, errors or sorryAx'
          names=['natFourHornLabels','natFourHornLabels_strict']
          for name in names:
              assert 'KUOS.DependentOriginationDoubleDeloopingTypeAFourHornLabelTableV1_106.'+name in log, 'missing kernel declaration '+name
          axioms=set()
          for body in re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log,re.S):
              axioms.update(x.strip() for x in body.split(',') if x.strip())
          assert axioms.issubset({'propext','Classical.choice','Quot.sound'}), sorted(axioms)
          receipt={'declarations_audited':2,'axioms':sorted(axioms),'sorryAx':False,
                   'strict_lean':True,'mcp_source_blob':'99ca499c470ba7b190623ed9e90e3f8d2dfb8058',
                   'independent_exact_source':True}
          Path('/tmp/kuuos-v1106-independent/axiom_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('KUUOS_V1106_INDEPENDENT_KERNEL_AUDIT_GREEN',receipt)
          PY
      - name: Archive independent Strict Lean and axiom evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1106-independent-${{ github.run_id }}
          path: /tmp/kuuos-v1106-independent/
          if-no-files-found: warn
          retention-days: 30
