name: KuuOS GitHub MCP Server Write Bridge v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/kuuos_github_mcp_server_bridge_v0_2.py'
      - 'scripts/run_kuuos_github_mcp_server_bridge_v0_2.py'
      - 'scripts/check_kuuos_github_mcp_server_bridge_v0_2.py'
      - 'tests/test_kuuos_github_mcp_server_bridge_v0_2.py'
      - 'examples/kuuos_github_mcp_server_bridge_v0_2.json'
      - 'manifests/kuuos_github_mcp_server_bridge_v0_2.json'
      - 'docs/KUUOS_GITHUB_MCP_SERVER_BRIDGE_v0_2.md'
      - '.github/workflows/kuuos-github-mcp-server-bridge-v0-2-validation.yml'
  pull_request:
    paths:
      - 'runtime/kuuos_github_mcp_server_bridge_v0_2.py'
      - 'scripts/run_kuuos_github_mcp_server_bridge_v0_2.py'
      - 'scripts/check_kuuos_github_mcp_server_bridge_v0_2.py'
      - 'tests/test_kuuos_github_mcp_server_bridge_v0_2.py'
      - 'examples/kuuos_github_mcp_server_bridge_v0_2.json'
      - 'manifests/kuuos_github_mcp_server_bridge_v0_2.json'
      - 'docs/KUUOS_GITHUB_MCP_SERVER_BRIDGE_v0_2.md'
      - '.github/workflows/kuuos-github-mcp-server-bridge-v0-2-validation.yml'

permissions:
  contents: read

concurrency:
  group: kuuos-github-mcp-write-v02-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate write-capable runtime surfaces
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          python3 -m compileall -q \
            runtime/kuuos_github_mcp_server_bridge_v0_2.py \
            scripts/run_kuuos_github_mcp_server_bridge_v0_2.py \
            scripts/check_kuuos_github_mcp_server_bridge_v0_2.py \
            tests/test_kuuos_github_mcp_server_bridge_v0_2.py \
            2>&1 | tee artifacts/diagnostics/python-compile.log
          python3 -m json.tool \
            examples/kuuos_github_mcp_server_bridge_v0_2.json > /dev/null
          python3 -m json.tool \
            manifests/kuuos_github_mcp_server_bridge_v0_2.json > /dev/null
          python3 scripts/check_kuuos_github_mcp_server_bridge_v0_2.py \
            2>&1 | tee artifacts/diagnostics/runtime-check.log
          python3 -m unittest -v \
            tests.test_kuuos_github_mcp_server_bridge_v0_2 \
            2>&1 | tee -a artifacts/diagnostics/runtime-check.log
          grep -Fq 'KUUOS_GITHUB_MCP_WRITE_AUTHORITY_READY' \
            runtime/kuuos_github_mcp_server_bridge_v0_2.py
          grep -Fq 'exact_sha_rest_delegate' \
            runtime/kuuos_github_mcp_server_bridge_v0_2.py
          grep -Fq 'write_capable_plan_requires_read_only_false' \
            runtime/kuuos_github_mcp_server_bridge_v0_2.py
          grep -Fq 'ghcr.io/github/github-mcp-server' \
            runtime/kuuos_github_mcp_server_bridge_v0_2.py

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-github-mcp-write-v0-2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/
          if-no-files-found: error
