name: KuuOS v1.98 R7 adopted exact-head 22-axiom Lean

on:
  push:
    branches:
      - 'fix/kuuos-v127-v129-ulift-20261115'
    paths:
      - '.github/workflows/kuuos-v198-r7-adopted-exact-22-axioms.yml'
      - 'formal/KUOS/DependentOriginationDoubleDeloopingThinComparisonZeroV1_96.lean'
      - 'formal/KUOS/DependentOriginationDoubleDeloopingTypeBTetrahedralZeroV1_97.lean'
      - 'formal/KUOS/DependentOriginationDoubleDeloopingTypeBTerminalRLPV1_98.lean'
      - 'tests/test_public_root_restoration.py'

permissions:
  contents: read

env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  adopted-v198-r7-22-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact push HEAD
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Verify exact source, Lean, mathlib, dependency provenance, and declarations
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          def blob(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          root=pathlib.Path('formal/KUOS')
          p=root/'DependentOriginationDoubleDeloopingTypeBTerminalRLPV1_98.lean'
          raw=p.read_bytes()
          assert blob(raw)=='b0a04000b3f074cfb8346d5f9e2c83cf7c6d4e6d',blob(raw)
          assert pathlib.Path('lean-toolchain').read_text().strip()=='leanprover/lean4:v4.30.0-rc2'
          manifest=json.loads(pathlib.Path('lake-manifest.json').read_text())
          assert [x['rev'] for x in manifest['packages'] if x['name']=='mathlib']==['5450b53e5ddc75d46418fabb605edbf36bd0beb6']
          deps={
              'DependentOriginationSingleTriangleScalingFiltrationV1_90.lean':'2b7be9f91504f33a25013858ccb917ac983e54fa',
              'DependentOriginationCanonicalFibrancyAtomicTwoSimplexAuditV1_91.lean':'f95fbb08959e5357efadd467e653cb2e3e3ff48e',
              'DependentOriginationCanonicalFibrationThinReflectionV1_92.lean':'2c1fcdab3579415d9f9591558db23c6b4a52e7e1',
              'DependentOriginationStandardTypeATwoSimplexThinReplacementV1_93.lean':'0e26a3d0e9f07c8cf61d0f6590833321e0cbd429',
              'DependentOriginationAtomicTwoSimplexUniversalScalingObstructionV1_94.lean':'abf21d554de77771723f044f9fb98e2b7396a20e',
              'DependentOriginationDoubleDeloopingNatNonthinDuskinWitnessV1_95.lean':'490286e6415136425d295436e62d3abccdeffbaf',
              'DependentOriginationDoubleDeloopingThinComparisonZeroV1_96.lean':'402778b2fd5c73d94318cdd10a656c94c32cb3f8',
              'DependentOriginationDoubleDeloopingTypeBTetrahedralZeroV1_97.lean':'a7e616e85be1f13948599e0a95f6bc35c572af38',
          }
          for path,expected in deps.items():
              observed=blob((root/path).read_bytes())
              assert observed==expected,(path,observed)
          rx=re.compile(r'^\s*(?:(?:@\[[^\n]*\])\s*)?(?:(?:noncomputable|private|protected|partial|unsafe)\s+)*(?:theorem|def|lemma|structure|class|abbrev|inductive)\s+([^\s(:]+)')
          def names(s):
              ns=[];results=[]
              for line in s.splitlines():
                  t=line.strip()
                  if t.startswith('namespace '):
                      ns.append(t.split()[1]);continue
                  if t.startswith('end '):
                      end=t.split()[1]
                      if ns and ns[-1]==end:ns.pop()
                      continue
                  m=rx.match(line)
                  if m:results.append('.'.join(ns+[m.group(1)]))
              return results
          curr=names(raw.decode())
          orig=names((root/'DependentOriginationDoubleDeloopingTypeBTerminalRLPV1_98.lean').read_text())
          assert len(curr)==len(orig)==22,(len(curr),len(orig))
          assert [x.rsplit('.',1)[-1] for x in curr]==[x.rsplit('.',1)[-1] for x in orig]
          pathlib.Path('/tmp/v198-r7-names.json').write_text(json.dumps(curr))
          pathlib.Path('/tmp/v198-r7-axioms.lean').write_text(
              'import KUOS.DependentOriginationDoubleDeloopingTypeBTerminalRLPV1_98\n'
              + ''.join('#print axioms '+x+'\n' for x in curr))
          print('EXACT_V198_SOURCE',blob(raw),'DECLARATIONS',len(curr),'DEPENDENCIES',len(deps))
          PY
      - name: Independently build fixed v1.96 and R3 Strict Lean
        run: |
          set -euo pipefail
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeBTetrahedralZeroV1_97
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeBTerminalRLPV1_98
      - name: Independently audit all 14 named declarations and kernel axioms
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true -Dweak.sorryAsError=true /tmp/v198-r7-axioms.lean >/tmp/v198-r7-axioms.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('/tmp/v198-r7-axioms.log').read_text()
          names=json.loads(Path('/tmp/v198-r7-names.json').read_text())
          allowed={'propext','Classical.choice','Quot.sound'}
          seen=set()
          for n in names:
              m=re.search("'"+re.escape(n)+r"'\s+depends on axioms:\s*\[([^\]]*)\]",s,re.S)
              no=re.search("'"+re.escape(n)+r"'\s+does not depend on any axioms",s)
              assert m or no,('MISSING_AXIOM_EVIDENCE',n)
              axes={v.strip() for v in m.group(1).split(',') if v.strip()} if m else set()
              assert axes<=allowed,(n,axes-allowed)
              seen|=axes
          assert 'sorryAx' not in s
          assert not re.search(r'(?:error|warning):',s),s[-1200:]
          print('INDEPENDENT_V198_R7_22_NAMED_GREEN',len(names),sorted(seen),'sorryAx=0 warning=0 error=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v198-r7-independent-22-named-axioms
          path: |
            /tmp/v198-r7-names.json
            /tmp/v198-r7-axioms.log
          if-no-files-found: warn
          retention-days: 30
