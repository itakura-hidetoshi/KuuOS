name: KuuOS GitHub MCP Repository Label Canary v0.6 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/kuuos_github_mcp_label_canary_v0_6.py'
      - 'scripts/run_kuuos_github_mcp_label_canary_v0_6.py'
      - 'scripts/check_kuuos_github_mcp_label_canary_v0_6.py'
      - 'tests/test_kuuos_github_mcp_label_canary_v0_6.py'
      - 'examples/kuuos_github_mcp_label_canary_v0_6.json'
      - 'manifests/kuuos_github_mcp_label_canary_v0_6.json'
      - 'docs/KUUOS_GITHUB_MCP_LABEL_CANARY_v0_6.md'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1/V0_6.lean'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1.lean'
      - '.github/workflows/kuuos-github-mcp-label-canary-v0-6-validation.yml'
      - '.github/workflows/kuuos-github-mcp-label-canary-v0-6.yml'
  pull_request:
    paths:
      - 'runtime/kuuos_github_mcp_label_canary_v0_6.py'
      - 'scripts/run_kuuos_github_mcp_label_canary_v0_6.py'
      - 'scripts/check_kuuos_github_mcp_label_canary_v0_6.py'
      - 'tests/test_kuuos_github_mcp_label_canary_v0_6.py'
      - 'examples/kuuos_github_mcp_label_canary_v0_6.json'
      - 'manifests/kuuos_github_mcp_label_canary_v0_6.json'
      - 'docs/KUUOS_GITHUB_MCP_LABEL_CANARY_v0_6.md'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1/V0_6.lean'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1.lean'
      - '.github/workflows/kuuos-github-mcp-label-canary-v0-6-validation.yml'
      - '.github/workflows/kuuos-github-mcp-label-canary-v0-6.yml'

permissions:
  contents: read

concurrency:
  group: kuuos-github-mcp-label-canary-v06-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository-label canary without external writes
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          python3 -m compileall -q \
            runtime/kuuos_github_mcp_label_canary_v0_6.py \
            scripts/run_kuuos_github_mcp_label_canary_v0_6.py \
            scripts/check_kuuos_github_mcp_label_canary_v0_6.py \
            tests/test_kuuos_github_mcp_label_canary_v0_6.py \
            2>&1 | tee artifacts/diagnostics/python-compile.log
          python3 -m json.tool examples/kuuos_github_mcp_label_canary_v0_6.json > /dev/null
          python3 -m json.tool manifests/kuuos_github_mcp_label_canary_v0_6.json > /dev/null
          python3 scripts/check_kuuos_github_mcp_label_canary_v0_6.py \
            2>&1 | tee artifacts/diagnostics/runtime-check.log
          python3 -m unittest -v tests.test_kuuos_github_mcp_label_canary_v0_6 \
            2>&1 | tee -a artifacts/diagnostics/runtime-check.log

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-github-mcp-label-canary-v0-6-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/
          if-no-files-found: error
