name: KuuOS LeanPython Plan Result Obstruction Scoped v0.49

# Additive limited proof check. This does not replace full KuuOSFormal.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/kuuos-leanpython-plan-result-obstruction-scoped-v0-49.yml"
      - "formal/KUOS/Architecture/LeanPythonPlanResultObservationObstructionV0_49.lean"
      - "scripts/check_kuuos_lean_python_plan_result_obstruction_sources_v0_49.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kuuos-leanpython-plan-result-obstruction-scoped-v0-49.yml"
      - "formal/KUOS/Architecture/LeanPythonPlanResultObservationObstructionV0_49.lean"

permissions:
  contents: read

concurrency:
  group: kuuos-leanpython-v049-scoped-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  EXACT_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  original-plan-obstruction:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out exact main source version
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.EXACT_SOURCE_SHA }}
      - name: Check fixed Lean and Mathlib pins
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path("lean-toolchain").read_text().strip() == (
              "leanprover/lean4:v4.30.0-rc2"
          )
          manifest = json.loads(Path("lake-manifest.json").read_text())
          mathlib = [p for p in manifest["packages"] if p["name"] == "mathlib"]
          assert len(mathlib) == 1 and mathlib[0]["rev"] == (
              "5450b53e5ddc75d46418fabb605edbf36bd0beb6"
          )
          print("Pinned canonical source inputs accepted (not proof)")
          PY
      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore shared Lake workspace
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v049-scoped-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.EXACT_SOURCE_SHA }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore pinned dependencies if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
      - name: Independently build original v0.48 main typed seam
        shell: bash
        run: |
          set -euo pipefail
          printf 'EXACT_SOURCE_SHA=%s\nEVENT=%s\n' "$EXACT_SOURCE_SHA" "$GITHUB_EVENT_NAME" | tee kuuos-v049-scoped.log
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.LeanPythonOriginalVerifyPlanCertificateSeamV0_48 \
            2>&1 | tee -a kuuos-v049-scoped.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Independently build integrated v0.49 after main push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.LeanPythonPlanResultObservationObstructionV0_49 \
            2>&1 | tee -a kuuos-v049-scoped.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Upload exact-HEAD limited proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v049-scoped-${{ github.run_id }}-${{ github.run_attempt }}
          path: kuuos-v049-scoped.log
          if-no-files-found: warn
          retention-days: 14
