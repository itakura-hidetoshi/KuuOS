name: KuuOS v1.39 genuine endpoint cylinder exact source Lean and MCP

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v139-research-candidate-real-mcp-v1.yml'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  isolated-v139-pinned-lean-real-mcp:
    if: github.event.pull_request.number == 3555
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache@v5
        with:
          path: .lake
          key: kuuos-v139-research-pinned-mathlib-5450-v1
      - name: Restore pinned Mathlib cache
        run: lake exe cache get
      - name: Isolated exact v1.39 source and SSet cylinder endpoint witnesses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,urllib.request
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          root=pathlib.Path('.').resolve()
          pins=require_pins(root)
          assert pins['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          dep=root/'formal/KUOS/DependentOriginationHomotopyClassStrictificationV1_38.lean'
          assert blob(dep.read_bytes())=='08399f0feca20eb8664b2673797a4c785d2588b0'
          target=root/'formal/KUOS/DependentOriginationScaledHornCylinderExtensionV1_39.lean'
          old=target.read_bytes()
          assert blob(old)=='4b20384a708d60a3c50edb4fd20de7ab84137558'
          sha='5cf4f8f6c986ae948ee96bbcfb66ab2540390e1e'
          url='https://api.github.com/repos/itakura-hidetoshi/KuuOS/git/blobs/'+sha
          req=urllib.request.Request(url,headers={'Accept':'application/vnd.github+json','User-Agent':'KuuOS-v139-real-MCP'})
          with urllib.request.urlopen(req,timeout=90) as resp:
              src=json.load(resp)
          assert src.get('encoding')=='base64'
          new=base64.b64decode(src['content'])
          assert blob(new)==sha
          t=new.decode()
          for phrase in ['endpoint_zero : SSet.ι₀ ≫ extension = Q.simplexMap',
              'endpoint_one_scaled : IsScaledMap sΔ sX (SSet.ι₁ ≫ extension)',
              'endpoint_one : SSet.ι₁ ≫ extension = Q.simplexMap',
              'endpoint_zero_scaled : IsScaledMap sΔ sX (SSet.ι₀ ≫ extension)',
              'structure ScaledHornProblemCylinderExtension',
              '@[reducible] noncomputable def strictify',
              'sourceCylinderExtension','targetCylinderExtension',
              'theorem globalDuskinStrictFibrancy_iff :',
              'HasScaledHornFillers (duskinNerve B) (duskinScaling B) HB ↔',
              'HasScaledHornFillers (duskinNerve C) (duskinScaling C) HC :=']:
              assert phrase in t,'missing exact typed cylinder boundary '+phrase
          assert not any(x in new for x in (b'\nsorry\n',b'\nadmit\n',b'\naxiom '))
          out=pathlib.Path('/tmp/kuuos-v139-research-mcp')
          out.mkdir(parents=True,exist_ok=True)
          (out/'source.lean').write_bytes(new)
          (out/'original.lean').write_bytes(old)
          (out/'manifest.json').write_text(json.dumps({
              'research_head':'ef215a76b638acadacbe628309f158ce8d7cbdb0',
              'candidate_blob':sha,'old_blob':blob(old),
              'candidate_sha256':hashlib.sha256(new).hexdigest(),
              'direct_lean_certified':False,'mcp_certified':False,
              'independent_ci_success':False,'github_proof_source_mutation':False},indent=2))
          target.write_bytes(new)
          print('KUUOS_V139_EXACT_ENDPOINT_CYLINDER_CANDIDATE_ISOLATED')
          PY
      - name: Direct pinned Lean v1.39 actual cylinder proof
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 70m lake \
            -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.DependentOriginationScaledHornCylinderExtensionV1_39 \
            2>&1 | tee /tmp/kuuos-v139-research-mcp/direct-lean.log
      - name: Install real Lean MCP prerequisites
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Actual Lean MCP diagnostics and separate direct Lean check
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          SHA="$(python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('formal/KUOS/DependentOriginationScaledHornCylinderExtensionV1_39.lean')
          print(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          )"
          python3 scripts/kuuos_lean_mcp_repair_loop_v1.py \
            --project-root . \
            --file formal/KUOS/DependentOriginationScaledHornCylinderExtensionV1_39.lean \
            --source-sha256 "$SHA" \
            --output-dir /tmp/kuuos-v139-real-mcp \
            --provider mcp-tactic --max-iterations 1
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil
          a=pathlib.Path('/tmp/kuuos-v139-real-mcp/receipt.json')
          j=json.loads(a.read_text())
          data=pathlib.Path('formal/KUOS/DependentOriginationScaledHornCylinderExtensionV1_39.lean').read_bytes()
          assert j['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY'
          assert j['source_restored'] and not j['independent_ci_success'] and not j['git_write_performed']
          assert j['rounds'][0]['semantic_success'] and not j['rounds'][0]['errors']
          assert j['rounds'][0]['direct_lean']['exit_code']==0
          assert j['candidate_sha256']==hashlib.sha256(data).hexdigest()
          shutil.copy2(a,'/tmp/kuuos-v139-research-mcp/mcp.json')
          print('KUUOS_V139_PINNED_DIRECT_LEAN_AND_REAL_MCP_SUCCESS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v139-exact-research-mcp
          path: /tmp/kuuos-v139-research-mcp
          if-no-files-found: warn
          retention-days: 30

  independent-v139-kernel-six-axioms:
    if: github.event.pull_request.number == 3555
    needs: isolated-v139-pinned-lean-real-mcp
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache@v5
        with:
          path: .lake
          key: kuuos-v139-research-pinned-mathlib-5450-v1
      - name: Fetch pinned Mathlib cache
        run: lake exe cache get
      - uses: actions/download-artifact@v4
        with:
          name: kuuos-v139-exact-research-mcp
          path: /tmp/kuuos-v139-independent
      - name: Check exact independent candidate, source and real MCP receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          root=pathlib.Path('.').resolve()
          assert require_pins(root)['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          p=pathlib.Path('/tmp/kuuos-v139-independent')
          m=json.loads((p/'manifest.json').read_text())
          r=json.loads((p/'mcp.json').read_text())
          source=(p/'source.lean').read_bytes()
          dest=root/'formal/KUOS/DependentOriginationScaledHornCylinderExtensionV1_39.lean'
          old=dest.read_bytes()
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(old)==m['old_blob']=='4b20384a708d60a3c50edb4fd20de7ab84137558'
          assert blob(source)==m['candidate_blob']=='5cf4f8f6c986ae948ee96bbcfb66ab2540390e1e'
          assert hashlib.sha256(source).hexdigest()==m['candidate_sha256']==r['candidate_sha256']
          assert r['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY' and r['source_restored'] and not r['independent_ci_success']
          assert r['rounds'][0]['direct_lean']['exit_code']==0 and not r['rounds'][0]['errors']
          dest.write_bytes(source)
          print('KUUOS_V139_INDEPENDENT_PROOF_SOURCE_AND_MCP_RECEIPT_MATCH')
          PY
      - name: Independent pinned Lean complete v1.39 import closure
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 65m lake \
            -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.DependentOriginationScaledHornCylinderExtensionV1_39
      - name: Six genuine cylinder declaration axiom audit
        run: |
          set -euo pipefail
          cat > formal/KUOS/DependentOriginationV139CandidateAxiomAudit.lean <<'LEAN'
          import KUOS.DependentOriginationScaledHornCylinderExtensionV1_39
          open KUOS.DependentOriginationScaledHornCylinderExtensionV1_39
          #print axioms ForwardScaledHornCylinderExtension.toTarget
          #print axioms BackwardScaledHornCylinderExtension.toSource
          #print axioms ScaledHornProblemCylinderExtension.eqvGen_boundary_realization_bidir
          #print axioms ScaledHornProblemCylinderExtension.strictify
          #print axioms ScaledHornFamilyCylinderExtension.toStrictification
          #print axioms CoherentNormalizedScaledCylinderExtendableModelEquivalence.globalDuskinStrictFibrancy_iff
          LEAN
          lake env lean formal/KUOS/DependentOriginationV139CandidateAxiomAudit.lean \
            | tee /tmp/kuuos-v139-research-six-axioms.log
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('/tmp/kuuos-v139-research-six-axioms.log').read_text()
          names=['ForwardScaledHornCylinderExtension.toTarget',
            'BackwardScaledHornCylinderExtension.toSource',
            'ScaledHornProblemCylinderExtension.eqvGen_boundary_realization_bidir',
            'ScaledHornProblemCylinderExtension.strictify',
            'ScaledHornFamilyCylinderExtension.toStrictification',
            'CoherentNormalizedScaledCylinderExtendableModelEquivalence.globalDuskinStrictFibrancy_iff']
          prefix='KUOS.DependentOriginationScaledHornCylinderExtensionV1_39.'
          for n in names:
              assert ("'"+prefix+n+"'") in s,'missing exact axiom result '+n
          groups=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',s,re.S)
          assert len(groups)==6,len(groups)
          standard={'propext','Classical.choice','Quot.sound'}
          for g in groups:
              assert {x.strip() for x in g.split(',') if x.strip()}<=standard
          assert 'sorryAx' not in s and 'error:' not in s
          print('KUUOS_V139_SIX_INDEPENDENT_CYLINDER_AXIOMS_STANDARD_ONLY')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v139-independent-axiom-receipt
          path: /tmp/kuuos-v139-research-six-axioms.log
          if-no-files-found: warn
          retention-days: 30
