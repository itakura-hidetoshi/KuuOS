name: KuuOS v1.73 CodeAI exact-source candidate probe pinned Lean ONLY (not proof)

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v173-codeai-probe-v1.yml'
      - 'scripts/ci_kuuos_v173_codeai_probe.py'
      - 'scripts/kuuos_v173_codeai_cause_separated_hunks_v1.json'
      - 'scripts/kuuos_v173_codeai_cause_separated_hunks_v2.json'
      - 'scripts/kuuos_v173_codeai_cause_separated_hunks_v3.json'
      - 'scripts/kuuos_v173_codeai_cause_separated_hunks_v4.json'
      - 'scripts/kuuos_v173_codeai_cause_separated_hunks_v5.json'
      - 'formal/KUOS/DependentOriginationStandardTypeABoundaryPrismRankwiseScaledPushoutV1_73.lean'
      - 'formal/KUOS/DependentOriginationStandardTypeABoundaryPrismRankwiseABCellularityV1_72.lean'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CHECKOUT_BLOB: '29c6caed55abb5ed3ae35d5ed5f457d1ce1731aa'

jobs:
  codeai-v173-probe-not-proof:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore pinned dependencies and certified v1.72
        run: |
          set -euo pipefail
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeABoundaryPrismRankwiseABCellularityV1_72
      - name: Run v1.73 exact-source baseline and universe-locked CodeAI hypotheses
        run: python3 scripts/ci_kuuos_v173_codeai_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v173-codeai-probe-not-proof
          path: /tmp/kuuos-v173-codeai-probe
          retention-days: 30
          if-no-files-found: error
