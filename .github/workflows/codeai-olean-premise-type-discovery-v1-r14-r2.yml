name: CodeAI closed premise type discovery v1 R14 R2
on:
  push:
    branches: [research/codeai-nogo-memory-v1-20261126]
    paths:
      - ".github/workflows/codeai-olean-premise-type-discovery-v1-r14-r2.yml"
      - "scripts/check_codeai_olean_premise_type_discovery_v1_r14_r2.py"
      - "runtime/kuuos_codeai_olean_premise_type_discovery_v1_r2.py"
permissions:
  contents: read
  actions: read
env:
  CANONICAL_HEAD: e1d754e8e0fc9382001a2e698751aa11d4272b84
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
concurrency:
  group: codeai-olean-premise-type-discovery-v1-r14-r2
  cancel-in-progress: false
jobs:
  sandbox:
    name: R14 sandbox actual premise domains and new Lean application
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.CANONICAL_HEAD }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore verified canonical project olean archive
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$CANONICAL_HEAD" python3 scripts/ci_verified_lean_project_cache_v1.py restore --base "$CANONICAL_HEAD"
      - name: Require verified archive and fixed proof scope
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          SCOPE: ${{ steps.cache.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          test -f .lake/build/lib/lean/KuuOSFormal.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - name: Require pinned mathlib for selected typed application
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          test -f .lake/build/lib/lean/KUOS/WORLD/KuuOSRepositoryAlignmentNormalFormV0_80.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r7-aggregate-45774874136-1
          path: r7-index
          run-id: 45774874136
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r13-local-45786634957-1
          path: r13-local
          run-id: 45786634957
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r13-independent-45786634957-1
          path: r13-independent
          run-id: 45786634957
          github-token: ${{ github.token }}
      - name: Verify R14 actual premise domains and exact Lean application
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_olean_premise_type_discovery_v1_r14_r2.py --out artifacts/olean-r14 --phase direct --index r7-index --r13-local r13-local --r13-independent r13-independent
      - name: Install actual Lean MCP launcher
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Actual Lean MCP R14 new application audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_olean_premise_type_discovery_v1_r14_r2.py --out artifacts/olean-r14 --phase mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-olean-r14-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/olean-r14/
          if-no-files-found: warn
  independent:
    name: R14 independent premise type discovery and new application
    needs: sandbox
    if: needs.sandbox.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.CANONICAL_HEAD }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore verified canonical project olean archive
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$CANONICAL_HEAD" python3 scripts/ci_verified_lean_project_cache_v1.py restore --base "$CANONICAL_HEAD"
      - name: Require verified archive and fixed proof scope
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          SCOPE: ${{ steps.cache.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          test -f .lake/build/lib/lean/KuuOSFormal.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - name: Require pinned mathlib for selected typed application
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          test -f .lake/build/lib/lean/KUOS/WORLD/KuuOSRepositoryAlignmentNormalFormV0_80.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r7-aggregate-45774874136-1
          path: r7-index
          run-id: 45774874136
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r13-local-45786634957-1
          path: r13-local
          run-id: 45786634957
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r13-independent-45786634957-1
          path: r13-independent
          run-id: 45786634957
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r14-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: first-recall
      - name: Independently reconstruct R14 premise type discovery and application
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_olean_premise_type_discovery_v1_r14_r2.py --out artifacts/olean-r14 --phase independent --index r7-index --r13-local r13-local --r13-independent r13-independent --first first-recall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-olean-r14-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/olean-r14/
          if-no-files-found: warn
