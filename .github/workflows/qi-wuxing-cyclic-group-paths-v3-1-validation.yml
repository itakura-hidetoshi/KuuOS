name: Qi Wuxing Cyclic Group and Typed Paths v3.1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci_subsystem_lean_scope.py'
      - 'scripts/ci_codeai_lean_scope.py'
      - 'scripts/check_kuu_internal_foundation_lean.sh'
      - 'formal/KuuOSFormal.lean'
      - 'formal/KUOS/Architecture/QiWuxingCyclicGroupPathsV3_1.lean'
      - 'formal/KuuOSQiWuxingCyclicGroupPathsV3_1.lean'
      - 'docs/KUUOS_QI_WUXING_CYCLIC_GROUP_PATHS_v3_1.md'
      - '.github/workflows/qi-wuxing-cyclic-group-paths-v3-1-validation.yml'

permissions:
  contents: read

concurrency:
  group: qi-wuxing-group-paths-v31-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  focused-lean:
    name: Targeted strict Lean and root wiring
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Central Governance validates aggregate-only changes on the exact HEAD.
      # Static root and import assertions below still run for every triggered PR.
      - name: Select Qi Lean scope (fail closed)
        id: lean-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            PYTHONPATH=. python3 scripts/ci_subsystem_lean_scope.py \
              --workflow .github/workflows/qi-wuxing-cyclic-group-paths-v3-1-validation.yml \
              --base "${BASE_SHA}" --head HEAD \
              --github-output "${GITHUB_OUTPUT}" \
              --delegated-path formal/KuuOSFormal.lean \
              --delegated-path docs/KUUOS_QI_WUXING_CYCLIC_GROUP_PATHS_v3_1.md
          fi

      - name: Check canonical aggregate and original proof roots
        run: |
          set -euo pipefail
          grep -Fq 'import KuuOSQiWuxingCyclicGroupPathsV3_1' formal/KuuOSFormal.lean
          grep -Fq 'import KUOS.Architecture.QiWuxingPhaseObservationUniversalPropertyV3_0' formal/KUOS/Architecture/QiWuxingCyclicGroupPathsV3_1.lean
          grep -Fq 'import Kuu.Presentation' formal/KUOS/Architecture/QiWuxingCyclicGroupPathsV3_1.lean
          python3 scripts/check_public_proof_roots.py
      # Restore-only from the exact pinned default-branch workspace namespace.
      # A cache hit is not a proof; Lake still checks all modified source inputs.
      - name: Restore trusted main Lake workspace (read-only)
        id: trusted-lake-cache
        if: steps.lean-scope.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report trusted Lake cache origin
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.trusted-lake-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "Trusted main Lake cache: ${CACHE_MATCHED_KEY:-miss}"

      - name: Install pinned Lean
        if: steps.lean-scope.outputs.needed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Resolve pinned Lake dependencies only when missing
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
          git diff --exit-code -- lake-manifest.json lean-toolchain

      - name: Strict targeted compilation of both v3.1 modules
        if: steps.lean-scope.outputs.needed == 'true'
        run: |
          set -euo pipefail
          # Build only the two theorem-bearing .olean targets under pinned strict options.
          # Registered buildable modules are selected via Lake facets, while public roots stay unchanged.
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build +KUOS.Architecture.QiWuxingCyclicGroupPathsV3_1:olean +KuuOSQiWuxingCyclicGroupPathsV3_1:olean
          git diff --exit-code -- lake-manifest.json lean-toolchain
