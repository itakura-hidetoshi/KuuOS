name: Qi Wuxing Relation-Word Protected History v2.7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/KUUOS_QI_WUXING_RELATION_WORD_PROTECTED_HISTORY_v2_7.md'
      - 'formal/KUOS/Architecture/QiWuxingRelationWordProtectedHistoryV2_7.lean'
      - 'formal/KuuOSQiWuxingRelationWordProtectedHistoryV2_7.lean'
      - '.github/workflows/qi-wuxing-relation-word-protected-history-v2-7-validation.yml'
  pull_request:
    paths:
      - 'docs/KUUOS_QI_WUXING_RELATION_WORD_PROTECTED_HISTORY_v2_7.md'
      - 'formal/KUOS/Architecture/QiWuxingRelationWordProtectedHistoryV2_7.lean'
      - 'formal/KuuOSQiWuxingRelationWordProtectedHistoryV2_7.lean'
      - '.github/workflows/qi-wuxing-relation-word-protected-history-v2-7-validation.yml'

permissions:
  contents: read

concurrency:
  group: qi-wuxing-relation-word-protected-history-v27-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  lean:
    name: Focused strict Lean
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Verify package-local formal boundary
        run: |
          set -euo pipefail
          grep -Fq \
            'import KUOS.Architecture.QiWuxingGenerationControlCoherenceV2_6' \
            formal/KUOS/Architecture/QiWuxingRelationWordProtectedHistoryV2_7.lean
          grep -Fq \
            'import KUOS.Architecture.QiWuxingRelationWordProtectedHistoryV2_7' \
            formal/KuuOSQiWuxingRelationWordProtectedHistoryV2_7.lean
      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore Lean dependency and build cache
        id: lean-cache
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages
            .lake/build
          key: kuuos-lean-v2-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Resolve dependencies on cache miss
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if lake update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          git diff --exit-code -- lake-manifest.json
          lake exe cache get
      - name: Strictly compile only the v2.7 module
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.QiWuxingRelationWordProtectedHistoryV2_7
