name: KuuOS live parent HEAD full-source + exact CI logs v2

on:
  pull_request:
    paths:
      - 'scripts/check_kuuos_lean_mcp_live_pr_v2.py'
      - 'tests/test_kuuos_lean_mcp_live_pr_v2.py'
      - '.github/workflows/lean-mcp-live-parent-head-v2.yml'
      - 'runtime/kuuos_codeai_lean_mcp_precommit_gate_v0_1.py'
      - 'tests/test_kuuos_codeai_lean_mcp_precommit_gate_v0_1.py'
      - 'scripts/check_codeai_lean_mcp_precommit_gate_v0_1.py'
      - 'scripts/kuuos_lean_mcp_repair_loop_v1.py'
      - 'tests/test_kuuos_lean_mcp_repair_loop_v1.py'
      - 'docs/KUUOS_CODEAI_LEAN_MCP_PRECOMMIT_GATE_v0_1.md'
      - 'docs/KUUOS_LEAN_MCP_LIVE_PARENT_HEAD_v2.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  head-snapshot-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and test exact-HEAD API contracts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_kuuos_lean_mcp_live_pr_v2.py
          python3 -m py_compile runtime/kuuos_codeai_lean_mcp_precommit_gate_v0_1.py
          python3 -m py_compile scripts/check_codeai_lean_mcp_precommit_gate_v0_1.py
          PYTHONPATH=. python3 -m unittest -v tests.test_kuuos_codeai_lean_mcp_precommit_gate_v0_1
          PYTHONPATH=. python3 -m unittest -v tests.test_kuuos_lean_mcp_repair_loop_v1
          PYTHONPATH=. python3 -m unittest discover -s tests \
            -p 'test_kuuos_lean_mcp_live_pr_v2.py' -v

  read-current-parent-head:
    needs: head-snapshot-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out pinned full-source inspection tool only
        uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot latest actual parent PR HEAD, every changed Lean blob, exact CI
        id: snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check_kuuos_lean_mcp_live_pr_v2.py \
            --pr 3522 --output-dir /tmp/kuuos-current-parent-v2 \
            --include-ci-log --github-output "$GITHUB_OUTPUT"
      - name: Fetch *exact* observed parent HEAD in read-only checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.snapshot.outputs.source_head }}
          path: target
          persist-credentials: false
      - name: Verify actual full modified Lean source and transitive local import closure
        run: |
          set -euo pipefail
          args=(--project-root target \
            --plan /tmp/kuuos-current-parent-v2/plan.json \
            --output-dir /tmp/kuuos-current-parent-v2/full_source \
            --max-local-deps 2200)
          if test -f /tmp/kuuos-current-parent-v2/source_bound_ci.log; then
            args+=(--ci-log /tmp/kuuos-current-parent-v2/source_bound_ci.log)
          fi
          PYTHONPATH=. python3 scripts/check_kuuos_lean_mcp_fullsource_v1.py "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/kuuos-current-parent-v2/plan.json').read_text())
          r=json.loads(Path('/tmp/kuuos-current-parent-v2/full_source/full_source_evidence.json').read_text())
          meta=json.loads(Path('/tmp/kuuos-current-parent-v2/live_head_receipt.json').read_text())
          assert p['source_head']==meta['source_head']==r['source_head_claimed_by_plan']
          assert r['source_file_git_blobs_verified'] is True
          assert r['changed_lean_coverage_all_claimed'] is True
          assert r['changed_targets_count']==meta['changed_lean_count']
          assert r['full_source_snapshot_count']>=r['changed_targets_count']
          assert r['full_import_closure_captured'] is True
          assert r['status']=='SOURCE_OBSERVATION_READY',r['obstructions']
          assert r['ci_certified'] is False and r['theorem_proof_certified'] is False
          assert meta['proof_certified'] is False
          if meta['ci_log_status'].startswith('EXACT_HEAD'):
              assert r['ci_log_status']!='NO_DATA'
          else:
              assert r['ci_log_status']=='NO_DATA'
          print('KUUOS_LIVE_PARENT_FULL_SOURCE_CLOSURE_AND_DIAGNOSTICS_VERIFIED',
                meta['source_head'], r['changed_targets_count'],
                r['full_source_snapshot_count'],len(r['ci_errors']),
                meta['ci_log_status'])
          PY
      - name: Refuse stale certification if parent HEAD moved during analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/check_kuuos_lean_mcp_live_pr_v2.py --pr 3522 \
            --output-dir /tmp/kuuos-current-parent-v2 \
            --verify-head '${{ steps.snapshot.outputs.source_head }}' \
            --verify-base '${{ steps.snapshot.outputs.source_base }}'
      - name: Preserve evidence and NO_DATA/obstructions even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-current-parent-head-fullsource-v2
          path: /tmp/kuuos-current-parent-v2/
          if-no-files-found: warn
          retention-days: 14

  candidate-v195-lean-mcp:
    name: CodeAI round8 direct-Lean-green candidate, full-source Lean MCP and independent precommit gate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    needs: head-snapshot-contract
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout immutable PR HEAD without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Lean MCP uvx and source inspection tools
        run: |
          python3 -m pip install uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Set up exact pinned Lean v4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore read-only pinned mathlib cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v195-mcp-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-v195-mcp-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore PR-local Lean build overlay (strict verification still required)
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve pinned olean dependencies, without unpinned upgrade
        run: lake exe cache get
      - name: Compile pinned imported closure through prior v1.94
        run: |
          timeout 1800 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationAtomicTwoSimplexUniversalScalingObstructionV1_94
      - name: Fetch actual parent HEAD and all changed Lean Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/check_kuuos_lean_mcp_live_pr_v2.py \
            --pr 3522 --output-dir /tmp/kuuos-v195-current-parent
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/kuuos-v195-current-parent/plan.json').read_text())
          assert data['source_head']==os.environ['EXPECTED_HEAD'], 'PR moved: fail closed'
          assert data['scope']=='all-changed'
          assert any(x['path'].endswith('WitnessV1_95.lean') for x in data['targets'])
          print('KUUOS_MCP_EXACT_HEAD_AND_CHANGED_LEAN_FILES',data['source_head'],len(data['targets']))
          PY
      - name: Generate exact CodeAI candidate and sealed isolated-application receipts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          import json,os
          from pathlib import Path
          from scripts.codeai_pr3522_live_v195_candidate_v0_1 import run_if_parent_pr
          run_if_parent_pr()
          path=Path('artifacts/codeai-v195/pr3522-codeai-v195-candidate.json')
          record=json.loads(path.read_text(encoding='utf-8'))
          assert record['source_head']==os.environ['EXPECTED_HEAD']
          assert record['source_blob']=='f7dcf6d9cddf3820b78c91375f0ec460874a7734'
          assert record['candidate_blob']=='bbbbf480721aa6d0a834c7fd5ad7690d0daff04e'
          assert record['isolated_application_receipt']['isolated_patch_applied'] is True
          assert record['git_effect'] is False
          print('KUUOS_CODEAI_REAL_V195_ISOLATION_RECEIPT',
                record['isolated_application_receipt']['codeai_autonomous_isolated_candidate_application_receipt_digest'])
          PY
      - name: Lean MCP fullsource, real goals and multi-attempt, CodeAI candidate isolated direct compilation
        run: |
          set -o pipefail
          PYTHONPATH=. python3 - <<'PY' 2>&1 | tee /tmp/kuuos-v195-mcp-precommit.log
          import hashlib, json, pathlib, subprocess, sys, tempfile
          from scripts.codeai_pr3522_live_v195_candidate_v0_1 import ASSOC_BEFORE, ASSOC_AFTER_V8
          from scripts.check_kuuos_lean_mcp_fullsource_v1 import (
              imports_of, declarations_of, git_blob, sha256,
          )
          from scripts.check_kuuos_lean_mcp_fullsource_repair_v1 import gate_repair
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest
          target='formal/KUOS/DependentOriginationDoubleDeloopingNatNonthinDuskinWitnessV1_95.lean'
          module='KUOS.DependentOriginationDoubleDeloopingNatNonthinDuskinWitnessV1_95'
          before_blob='f7dcf6d9cddf3820b78c91375f0ec460874a7734'
          after_blob='bbbbf480721aa6d0a834c7fd5ad7690d0daff04e'
          codeai_record=json.loads(pathlib.Path(
              'artifacts/codeai-v195/pr3522-codeai-v195-candidate.json').read_text())
          codeai_receipt=codeai_record['isolated_application_receipt'][
              'codeai_autonomous_isolated_candidate_application_receipt_digest']
          root=pathlib.Path('.').resolve()
          out=pathlib.Path('/tmp/kuuos-v195-mcp-precommit')
          plan=json.loads(pathlib.Path('/tmp/kuuos-v195-current-parent/plan.json').read_text())
          assert codeai_record['source_head']==plan['source_head'], 'CodeAI/LeanMCP exact HEAD mismatch'
          targets=[x for x in plan['targets'] if x['path']==target]
          assert len(targets)==1 and targets[0]['git_blob_sha']==before_blob
          src=root/target
          original=src.read_bytes()
          assert git_blob(original)==before_blob and original.decode().count(ASSOC_BEFORE)==1
          original_text=original.decode()
          changed_text=original_text.replace(ASSOC_BEFORE,ASSOC_AFTER_V8)
          candidate=changed_text.encode()
          assert git_blob(candidate)==after_blob
          assert codeai_record['candidate_blob']==after_blob
          assert codeai_record['source_blob']==before_blob
          assert imports_of(original_text)==imports_of(changed_text)
          signature=lambda x:[(d['kind'],d['name_lexical'],d['signature_sha256'])
              for d in declarations_of(x,module)]
          assert signature(original_text)==signature(changed_text)
          assert all(x not in changed_text or x in original_text
              for x in ('sorry','admit','axiom','unsafe','native_decide'))
          plan['api_probes']=[
              {'name':'CategoryTheory.StrictlyUnitaryLaxFunctorCore',
               'import_module':'Mathlib.CategoryTheory.Bicategory.Functor.StrictlyUnitary'},
              {'name':'Nat.add_comm','import_module':'Mathlib'},
          ]
          if out.exists(): raise RuntimeError('append-only evidence already exists')
          out.mkdir()
          def provider(current,observations):
              if current!=original_text or not observations or not observations[-1].get('errors'):
                  raise RuntimeError('CodeAI candidate lacks actual Lean MCP error context')
              return {'expected_sha256':digest(current),'old_text':ASSOC_BEFORE,
                      'new_text':ASSOC_AFTER_V8,'reason':'CodeAI round8 direct-green source-bound receipt: '+codeai_receipt}
          record={'source_head':plan['source_head'],'changed_lean_count':len(plan['targets']),
                  'source_git_blob':before_blob,'codeai_candidate_git_blob':after_blob,
                  'codeai_receipt':codeai_receipt,'git_write_performed':False,
                  'strict_lean_status':'NOT_RUN','lean_mcp_status':'NOT_RUN'}
          try:
              x=gate_repair(root=root,plan=plan,output_dir=out/'mcp_fullsource',
                  target=target,acknowledged_isolated=True,max_iterations=1,
                  provider=provider)
              record['full_source_status']=x.get('evidence_status')
              record['lean_mcp_status']=x.get('repair_status')
              record['mcp_local_receipt']=x.get('local_repair_receipt')
              record['source_restored_by_mcp']=x.get('source_restored')
              record['imports_unchanged']=x.get('imports_unchanged')
              record['source_signature_unchanged']=x.get('source_signature_unchanged')
              record['new_forbidden_constructs']=x.get('new_forbidden_constructs')
          except Exception as e:
              record['lean_mcp_status']='MCP_EXECUTION_OBSTRUCTION'
              record['mcp_exception']=type(e).__name__+': '+str(e)[:700]
          if src.read_bytes()!=original:
              raise RuntimeError('MCP failed unconditional source restoration')
          try:
              src.write_bytes(candidate)
              with tempfile.TemporaryDirectory(prefix='kuuos-v195-candidate-') as td:
                  try:
                      run=subprocess.run(['lake','env','lean','-DwarningAsError=true',
                            '-Dweak.sorryAsError=true','-o',td+'/candidate.olean',target],
                            capture_output=True,text=True,timeout=900,check=False)
                      log=run.stdout+'\n'+run.stderr
                      record['strict_lean_status']='SUCCESS' if run.returncode==0 else 'FAILURE'
                      record['strict_lean_returncode']=run.returncode
                  except subprocess.TimeoutExpired as e:
                      log=str(e.stdout or '')+'\n'+str(e.stderr or '')
                      record['strict_lean_status']='TIMEOUT'
                  (out/'strict_candidate.log').write_text(log)
                  record['strict_candidate_log_sha256']=sha256(log.encode())
          finally:
              src.write_bytes(original)
              if src.read_bytes()!=original:
                  raise RuntimeError('candidate direct Lean test did not restore source')
              record['source_restored_final']=True
          (out/'candidate.lean').write_bytes(candidate)
          (out/'precommit_receipt.json').write_text(
              json.dumps(record,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('KUUOS_REAL_V195_CODEAI_LEAN_MCP_PRECOMMIT '+json.dumps({
              k:v for k,v in record.items() if k!='mcp_local_receipt'},ensure_ascii=False,sort_keys=True))
          # Evidence is produced even when the proof is red. Only the next
          # source-bound gate may mark a candidate eligible for PR review.
          sys.exit(0)
          PY
      - name: Require CodeAI + Lean MCP + pinned direct Lean before candidate adoption
        run: |
          set -euo pipefail
          CODEAI_TREE=$(python3 -c "import json;print(json.load(open('artifacts/codeai-v195/pr3522-codeai-v195-candidate.json'))['source_git_tree'])")
          PYTHONPATH=. python3 scripts/check_codeai_lean_mcp_precommit_gate_v0_1.py \
            --codeai-record artifacts/codeai-v195/pr3522-codeai-v195-candidate.json \
            --mcp-precommit-record /tmp/kuuos-v195-mcp-precommit/precommit_receipt.json \
            --source formal/KUOS/DependentOriginationDoubleDeloopingNatNonthinDuskinWitnessV1_95.lean \
            --candidate /tmp/kuuos-v195-mcp-precommit/candidate.lean \
            --direct-lean-log /tmp/kuuos-v195-mcp-precommit/strict_candidate.log \
            --target formal/KUOS/DependentOriginationDoubleDeloopingNatNonthinDuskinWitnessV1_95.lean \
            --source-head "${{ github.event.pull_request.head.sha }}" \
            --source-git-tree "$CODEAI_TREE" \
            --out /tmp/kuuos-v195-mcp-precommit/codeai_lean_mcp_gate_receipt.json
      - name: Preserve candidate full-source snapshots, MCP goals, strict Lean logs and obstructions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuu-v195-fullsource-lean-mcp-codeai-${{ github.run_id }}
          path: |
            /tmp/kuuos-v195-current-parent/
            /tmp/kuuos-v195-mcp-precommit/
            /tmp/kuuos-v195-mcp-precommit.log
            artifacts/codeai-v195/pr3522-codeai-v195-candidate.json
            artifacts/codeai-v195/pr3522-v195-candidate.diff
          if-no-files-found: warn
          retention-days: 21
