name: VerifyOS execution answer binding v0.1
on:
  pull_request:
    paths:
      - 'runtime/kuuos_verifyos_execution_answer_binding_v0_1.py'
      - 'tests/test_kuuos_verifyos_execution_answer_binding_v0_1.py'
      - '.github/workflows/verifyos-execution-answer-binding-v0-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -B -m unittest discover -s tests -p test_kuuos_verifyos_execution_answer_binding_v0_1.py -v
  independent-regression:
    needs: isolated-regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -B -m unittest discover -s tests -p test_kuuos_verifyos_execution_answer_binding_v0_1.py -v
