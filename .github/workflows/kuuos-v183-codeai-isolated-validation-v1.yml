name: KuuOS v1.83 isolated CodeAI posetal 18-declaration strict Lean and axioms
on:
  push:
    branches:
      - 'validation/kuuos-v183-codeai-candidate-20261121'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v183-codeai-pinned-18-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact validation HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Build v1.83 CodeAI exact candidate and audit 18 public constants
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v183_codeai_exact_source_v1.py --out /tmp/kuuos-v183-codeai-pinned-18
      - name: Save candidate and independent proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v183-codeai-pinned-18
          path: /tmp/kuuos-v183-codeai-pinned-18
          retention-days: 30
          if-no-files-found: warn
