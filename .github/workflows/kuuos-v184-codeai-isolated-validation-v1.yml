name: KuuOS v1.84 CodeAI generated order reflection pinned Lean and 13 axioms
on:
  push:
    branches:
      - 'validation/kuuos-v184-codeai-order-reflection-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v184-codeai-pinned-13-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact v1.84 validation HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Verify exact CodeAI diffs, compile and audit 13 named public constants
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v184_codeai_exact_source_v1.py --out /tmp/kuuos-v184-codeai-13
      - name: Save strict build and public axiom audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v184-codeai-13
          path: /tmp/kuuos-v184-codeai-13
          retention-days: 30
          if-no-files-found: warn
