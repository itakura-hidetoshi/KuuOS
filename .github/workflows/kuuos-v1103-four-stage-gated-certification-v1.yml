name: KuuOS v1.103 strict ordered four-stage CodeAI Lean proof certification

on:
  pull_request:
    paths:
      - "scripts/kuuos_v1103_four_stage_gate_v1.py"
      - ".github/workflows/kuuos-v1103-four-stage-gated-certification-v1.yml"
      - "formal/KUOS/DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103.lean"

permissions:
  contents: read
  actions: read

jobs:
  precommit-codeai-direct-lean-mcp-admission:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact promoted parent HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch immutable producer CodeAI candidate/MCP archive
        uses: actions/download-artifact@v4
        with:
          name: kuuos-v1103-codeai-round2-43683314843
          run-id: 43683314843
          github-token: ${{ github.token }}
          path: evidence
      - name: Verify producer run, six CodeAI candidates, only-direct-green MCP, precise promoted blob
        env:
          EVIDENCE_ROOT: ${{ github.workspace }}/evidence
          PROMOTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          ADMISSION_RECEIPT_PATH: /tmp/kuuos-v1103-four-stage/admission.json
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1103_four_stage_gate_v1.py
          python3 scripts/kuuos_v1103_four_stage_gate_v1.py
      - name: Archive stage 1-3 admission receipt (not stage 4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1103-four-stage-precommit-${{ github.run_id }}
          path: /tmp/kuuos-v1103-four-stage/
          if-no-files-found: warn
          retention-days: 30

  independent-pinned-lean-proof-and-axiom-audit:
    needs: precommit-codeai-direct-lean-mcp-admission
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      EXPECTED_BLOB: 'ff2e6a09e2c064a23207ee1323bc14182c86d7cd'
    steps:
      - name: Checkout same exact promoted parent HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup exact fixed Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned mathlib PR build cache (not authority)
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Verify selected original CodeAI candidate Git blob
        run: |
          set -euo pipefail
          mkdir -p /tmp/kuuos-v1103-independent
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          raw=Path("formal/KUOS/DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103.lean").read_bytes()
          blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
          assert blob==os.environ["EXPECTED_BLOB"], (blob,os.environ["EXPECTED_BLOB"])
          print("KUUOS_V1103_INDEPENDENT_CERTIFY_SAME_CODEAI_BLOB",blob)
          PY
      - name: Resolve pinned dependencies
        run: lake exe cache get
      - name: Strictly rebuild v1.103 imported Lean closure on exact promoted HEAD
        run: |
          set -euo pipefail
          timeout 3000 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103 2>&1 | tee /tmp/kuuos-v1103-independent/build.log
      - name: Independently check all v1.103 declarations and theorem kernel axioms
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          names=["natTypeAHornTriangle","natTypeAHornLabel","natTypeAHornLabel_left_zero","natTypeAHornLabel_right_zero","natTypeAHornLabel_distinguished_zero","natTypeAHornMap_mapComp_eq_label","natOrderedTetrahedron","natTypeAHornTetrahedron","natTypeAHornLabel_tetrahedron_of_five_le","natTypeAHighCocycle","NatNormalizedDuskinCocycle.toSimplexMap_mapComp","natTypeAHighCocycle_restrict","natTypeAHighCocycle_distinguished_zero","natTypeAHigh_cocycle_completion","natDoubleDelooping_hasLiftingProperty_standardTypeA_of_five_le"]
          prefix="KUOS.DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103."
          lines=["import KUOS.DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103",""]
          for name in names:
              lines.extend(["#check "+prefix+name,"#print axioms "+prefix+name])
          Path("/tmp/kuuos-v1103-independent/Axioms.lean").write_text("\n".join(lines)+"\n")
          PY
          lake env lean -DwarningAsError=true -Dweak.sorryAsError=true /tmp/kuuos-v1103-independent/Axioms.lean 2>&1 | tee /tmp/kuuos-v1103-independent/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path("/tmp/kuuos-v1103-independent/axioms.log").read_text()
          assert "sorryAx" not in s and "error:" not in s
          groups=re.findall(r"depends on axioms:\s*\[([^\]]*)\]",s,re.S)
          assert groups
          axioms={a.strip() for x in groups for a in x.split(",") if a.strip()}
          assert axioms.issubset({"propext","Classical.choice","Quot.sound"}),sorted(axioms)
          record={"audited_declarations":15,"standard_axioms":sorted(axioms),
                  "sorryAx":False,"exact_source_independent_ci":True}
          Path("/tmp/kuuos-v1103-independent/axiom_receipt.json").write_text(json.dumps(record,indent=2)+"\n")
          print("KUUOS_V1103_STAGE_4_INDEPENDENT_STRICT_AX_CI_SUCCESS",record)
          PY
      - name: Preserve independent proof and axiom receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1103-gated-independent-${{ github.run_id }}
          path: /tmp/kuuos-v1103-independent/
          if-no-files-found: warn
          retention-days: 30
