name: KuuOS v1.43 CodeAI reducibility direct Lean real MCP and independent audit

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v143-codeai-reducibility-real-mcp-v1.yml'
      - 'formal/KUOS/DependentOriginationScaledAnodyneWFSUniversalityV1_43.lean'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  V143_CHECKOUT_BLOB: '833c8e772b7f35a3b5bd36995703ed257bac20c7'
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  codeai-v143-direct-and-real-mcp:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore fixed mathlib and compile exact v1.42 dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          assert require_pins(pathlib.Path('.').resolve())['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          b=pathlib.Path('formal/KUOS/DependentOriginationScaledAnodyneGeneratorClosureV1_42.lean').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='86e95f82493748b0c7706071196a378d779fa7af'
          PY
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationScaledAnodyneGeneratorClosureV1_42
      - name: CodeAI bounded source candidates and original negative control through direct pinned Lean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tempfile
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,FORBIDDEN_NEW
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationScaledAnodyneWFSUniversalityV1_43.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v143-codeai')
          out.mkdir(parents=True,exist_ok=True)
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(original)==os.environ['V143_CHECKOUT_BLOB']
          names=['canonicalGeneratedScaledWeakFactorizationSystem','toWeakFactorizationSystem']
          baseline=original.decode()
          for name in names:
              baseline=baseline.replace('@[reducible] def '+name,'def '+name)
          assert blob(baseline.encode())=='00c7f8143af9dbefc8253b2aedcd86b64613b120'
          variants={}
          for attr in ('reducible','implicit_reducible'):
              s=baseline
              for name in names:
                  anchor='\ndef '+name+'\n'
                  assert s.count(anchor)==1
                  s=s.replace(anchor,'\n@['+attr+'] def '+name+'\n',1)
              assert not FORBIDDEN_NEW.search(s)
              normalized=s.replace('@['+attr+'] def ','def ')
              assert normalized==baseline
              variants[attr]=s
          assert blob(variants['reducible'].encode())=='833c8e772b7f35a3b5bd36995703ed257bac20c7'
          rows=[]
          try:
              for name,s in [('baseline',baseline),*variants.items()]:
                  target.write_text(s)
                  with tempfile.TemporaryDirectory(prefix='kuuos-v143-direct-') as tmp:
                      olean=pathlib.Path(tmp)/'candidate.olean'
                      p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true','-o',str(olean),rel],cwd=root,capture_output=True,text=True,timeout=600)
                      log=p.stdout+'\n'+p.stderr
                      errors=[x for x in log.splitlines() if re.search(r'\berror(?:\([^)]*\))?:',x)]
                      row={'candidate':name,'candidate_blob':blob(s.encode()),'candidate_sha256':digest(s),'exit_code':p.returncode,'olean_exists':olean.is_file(),'errors':errors,'success':p.returncode==0 and olean.is_file() and not errors and 'sorryAx' not in log}
                      rows.append(row)
                      (out/(name+'.log')).write_text(log)
                      (out/(name+'.lean')).write_text(s)
                      print('KUUOS_V143_CODEAI_DIRECT '+json.dumps(row))
              assert not rows[0]['success'] and rows[0]['exit_code']!=0
              assert (out/'baseline.log').read_text().count('of class type must be marked')==2
              selected=next(x for x in rows if x['candidate']=='reducible')
              assert selected['success']
              (out/'source.lean').write_text(variants['reducible'])
              (out/'manifest.json').write_text(json.dumps({'source_head':os.environ['SOURCE_HEAD'],'checkout_blob':blob(original),'candidate_blob':selected['candidate_blob'],'candidate_sha256':selected['candidate_sha256'],'candidates':rows,'factorization_condition_preserved':True,'source_restored':True,'git_write_performed':False,'independent_ci_success':False},indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V143_CODEAI_TWO_CANDIDATES_DIRECT_LEAN_COMPLETE')
          PY
      - name: Install real Lean MCP prerequisites
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Successful candidate only through actual KuuOS Lean MCP loop and second direct check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,run_loop,mcp_tactic_provider
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationScaledAnodyneWFSUniversalityV1_43.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v143-codeai')
          source=(out/'source.lean').read_bytes()
          try:
              target.write_bytes(source)
              p=subprocess.run(['lake','-KleanArgs=-DwarningAsError=true','-KleanArgs=-DsorryAsError=true','build','KUOS.DependentOriginationScaledAnodyneWFSUniversalityV1_43'],cwd=root,capture_output=True,text=True,timeout=3600)
              (out/'complete-build.log').write_text(p.stdout+'\n'+p.stderr)
              print(p.stdout,p.stderr)
              assert p.returncode==0
              receipt=run_loop(root=root,rel_file=rel,output_dir=pathlib.Path('/tmp/kuuos-v143-live-mcp'),expected_sha256=digest(source),provider=mcp_tactic_provider,max_iterations=1)
              assert receipt['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY'
              assert receipt['source_restored'] and not receipt['independent_ci_success'] and not receipt['git_write_performed']
              assert receipt['candidate_sha256']==digest(source)
              assert receipt['rounds'][0]['semantic_success'] and not receipt['rounds'][0]['errors']
              assert receipt['rounds'][0]['direct_lean']['exit_code']==0
              (out/'mcp.json').write_text(json.dumps(receipt,indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V143_CODEAI_DIRECT_THEN_REAL_MCP_SUCCESS_NOT_INDEPENDENT_CI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v143-codeai-candidate
          path: /tmp/kuuos-v143-codeai
          retention-days: 30
          if-no-files-found: error

  independent-v143-kernel-and-ten-axioms:
    needs: codeai-v143-direct-and-real-mcp
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - uses: actions/download-artifact@v4
        with:
          name: kuuos-v143-codeai-candidate
          path: /tmp/kuuos-v143-independent
      - name: Independently bind source HEAD pins candidate bytes and real MCP receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          root=pathlib.Path('.').resolve()
          assert require_pins(root)['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          p=pathlib.Path('/tmp/kuuos-v143-independent')
          m=json.loads((p/'manifest.json').read_text())
          r=json.loads((p/'mcp.json').read_text())
          source=(p/'source.lean').read_bytes()
          dest=root/'formal/KUOS/DependentOriginationScaledAnodyneWFSUniversalityV1_43.lean'
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert m['source_head']==os.environ['SOURCE_HEAD']
          assert blob(dest.read_bytes())==m['checkout_blob']==os.environ['V143_CHECKOUT_BLOB']
          assert blob(source)==m['candidate_blob']=='833c8e772b7f35a3b5bd36995703ed257bac20c7'
          assert hashlib.sha256(source).hexdigest()==m['candidate_sha256']==r['candidate_sha256']
          assert m['factorization_condition_preserved'] and m['source_restored'] and not m['git_write_performed'] and not m['independent_ci_success']
          assert r['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY' and r['source_restored'] and not r['independent_ci_success'] and not r['git_write_performed']
          assert r['rounds'][0]['direct_lean']['exit_code']==0 and r['rounds'][0]['semantic_success'] and not r['rounds'][0]['errors']
          dep=root/'formal/KUOS/DependentOriginationScaledAnodyneGeneratorClosureV1_42.lean'
          assert blob(dep.read_bytes())=='86e95f82493748b0c7706071196a378d779fa7af'
          dest.write_bytes(source)
          print('KUUOS_V143_INDEPENDENT_EXACT_SOURCE_PIN_AND_MCP_RECEIPT_MATCH')
          PY
          lake exe cache get
      - name: Independent full strict Lean v1.43 dependency closure
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationScaledAnodyneWFSUniversalityV1_43 2>&1 | tee /tmp/kuuos-v143-independent/build.log
      - name: Ten named declarations standard-axiom audit with factorization premise retained
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          ns='KUOS.DependentOriginationScaledAnodyneWFSUniversalityV1_43'
          names=['canonicalGeneratedScaledAnodyne_isOrthogonallySaturated','canonicalGeneratedScaledAnodyne_le_of_saturated','canonicalGeneratedScaledAnodyne_closure_idempotent','ScaledAnodynePresentation.eq_canonical_of_saturated','canonicalGeneratedScaledFibration_llp','canonicalGeneratedScaledAnodyne_rlp_eq_fibration','canonicalGenerated_hasLiftingProperty','canonicalGeneratedScaledWeakFactorizationSystem','CanonicalGeneratedScaledWFSCertificate.toWeakFactorizationSystem','CanonicalGeneratedScaledWFSCertificate.hasLiftingProperty']
          audit=pathlib.Path('formal/KUOS/DependentOriginationV143IndependentAxiomAudit.lean')
          audit.write_text('import '+ns+'\n'+'\n'.join('#print axioms '+ns+'.'+n for n in names)+'\n')
          p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true',str(audit)],capture_output=True,text=True,timeout=600)
          log=p.stdout+'\n'+p.stderr
          print(log)
          pathlib.Path('/tmp/kuuos-v143-independent/axioms.log').write_text(log)
          assert p.returncode==0 and 'sorryAx' not in log and 'error:' not in log
          rows=re.findall(r"'([^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",log,re.S)
          assert len(rows)==10 and {x[0] for x in rows}=={ns+'.'+n for n in names}
          allowed={'propext','Classical.choice','Quot.sound'}
          for _,ax in rows:
              assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed
          print('KUUOS_V143_TEN_DECLARATIONS_STANDARD_AXIOMS_NO_UNCONDITIONAL_FACTORIZATION')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v143-independent-proof-audit
          path: /tmp/kuuos-v143-independent
          retention-days: 30
          if-no-files-found: error
