name: KuuOS GitHub MCP Workflow Dispatch v0.5 Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'scripts/run_kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'scripts/check_kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'tests/test_kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'examples/kuuos_github_mcp_workflow_dispatch_v0_5.json'
      - 'manifests/kuuos_github_mcp_workflow_dispatch_v0_5.json'
      - 'docs/KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH_v0_5.md'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1/V0_5.lean'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1.lean'
      - '.github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5-validation.yml'
      - '.github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5.yml'
      - '.github/workflows/kuuos-github-mcp-live-canary-v0-4.yml'
  pull_request:
    paths:
      - 'runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'scripts/run_kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'scripts/check_kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'tests/test_kuuos_github_mcp_workflow_dispatch_v0_5.py'
      - 'examples/kuuos_github_mcp_workflow_dispatch_v0_5.json'
      - 'manifests/kuuos_github_mcp_workflow_dispatch_v0_5.json'
      - 'docs/KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH_v0_5.md'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1/V0_5.lean'
      - 'formal/KuuOSGitHubMCPServerBridgeV0_1.lean'
      - '.github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5-validation.yml'
      - '.github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5.yml'
      - '.github/workflows/kuuos-github-mcp-live-canary-v0-4.yml'

permissions:
  contents: read

concurrency:
  group: kuuos-github-mcp-workflow-dispatch-v05-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate workflow dispatch write-action surfaces without external writes
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          python3 -m compileall -q \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py \
            scripts/run_kuuos_github_mcp_workflow_dispatch_v0_5.py \
            scripts/check_kuuos_github_mcp_workflow_dispatch_v0_5.py \
            tests/test_kuuos_github_mcp_workflow_dispatch_v0_5.py \
            2>&1 | tee artifacts/diagnostics/python-compile.log
          python3 -m json.tool \
            examples/kuuos_github_mcp_workflow_dispatch_v0_5.json > /dev/null
          python3 -m json.tool \
            manifests/kuuos_github_mcp_workflow_dispatch_v0_5.json > /dev/null
          python3 scripts/check_kuuos_github_mcp_workflow_dispatch_v0_5.py \
            2>&1 | tee artifacts/diagnostics/runtime-check.log
          python3 -m unittest -v \
            tests.test_kuuos_github_mcp_workflow_dispatch_v0_5 \
            2>&1 | tee -a artifacts/diagnostics/runtime-check.log
          grep -Fq 'KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH_VERIFIED' \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py
          grep -Fq 'KUUOS_GITHUB_MCP_WORKFLOW_DISPATCH_MISMATCH_CANCELLED' \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py
          grep -Fq 'actions_run_trigger' \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py
          grep -Fq 'actions_list' \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py
          grep -Fq 'run_workflow' \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py
          grep -Fq 'cancel_workflow_run' \
            runtime/kuuos_github_mcp_workflow_dispatch_v0_5.py
          grep -Fq '"read_only": false' \
            examples/kuuos_github_mcp_workflow_dispatch_v0_5.json
          grep -Fq 'dispatch_nonce' \
            .github/workflows/kuuos-github-mcp-live-canary-v0-4.yml
          grep -Fq 'types:' \
            .github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5.yml
          grep -Fq 'github.event.issue.author_association == '\''OWNER'\''' \
            .github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5.yml
          grep -Fq 'request_expected_main_sha_mismatch' \
            .github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5.yml
          grep -Fq 'kuuos-github-mcp-live-canary-v0-4.yml' \
            .github/workflows/kuuos-github-mcp-workflow-dispatch-v0-5.yml

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-github-mcp-workflow-dispatch-v0-5-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/
          if-no-files-found: error
