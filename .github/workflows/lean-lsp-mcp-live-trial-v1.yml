name: Lean-LSP MCP live goal and multi-attempt v1

on:
  pull_request:
    paths:
      - 'scripts/check_kuuos_lean_lsp_mcp_multi_attempt_v1.py'
      - '.github/workflows/lean-lsp-mcp-live-trial-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  live-goal-and-trial:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Restore Lake cache
        uses: actions/cache@v5
        with:
          path: .lake
          key: kuuos-current-lean-lsp-mcp-ubuntu-x64-trial-v1

      - name: Fetch pinned Mathlib cache
        run: lake exe cache get

      - name: Validate fixed pins and build representative module only
        run: |
          bash scripts/run_kuuos_lean_mcp_stdio_v1.sh --check-pins "$PWD"
          lake env lean --version
          lake env lean -o /tmp/kuuos-lean-mcp-trial.olean formal/KUOS/DependentOriginationFunctorialTransportV0_1.lean

      - name: Run real MCP goal / multi-attempt calls
        run: |
          PYTHONPATH=. python3 scripts/check_kuuos_lean_lsp_mcp_multi_attempt_v1.py

      - name: Upload exact-run MCP capability receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-lean-mcp-goal-trial-v1
          path: kuuos_lean_mcp_goal_trial_receipt_v1.json
          if-no-files-found: warn
          retention-days: 14
