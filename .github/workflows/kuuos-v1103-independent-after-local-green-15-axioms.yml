name: "KuuOS v1.103 separately gated independent Lean 15-axiom certification"

on:
  push:
    branches:
      - 'research/v1103-codeai-second-local-five-20261123'
    paths:
      - '.github/workflows/kuuos-v1103-independent-after-local-green-15-axioms.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-lean-only-after-verified-local-green:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact independent CI HEAD (no credentials persisted)
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python to verify real GitHub GREEN receipts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source snapshot and independent audit script pin
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci_kuuos_v1103_independent_selected_15_audit.py
          python3 -m py_compile scripts/ci_kuuos_v1103_second_five_trial_sandbox.py
          python3 - <<'PY'
          from pathlib import Path
          from scripts import kuuos_sandbox_lean_cycle_v1 as c
          assert c.git_blob(Path('scripts/kuuos_sandbox_lean_cycle_v1.py').read_bytes())=='5383253dbe9cda9cab90a410c2fd66ee6b9d6f41'
          assert c.git_blob(Path('scripts/ci_kuuos_v1103_independent_selected_15_audit.py').read_bytes())=='3251991e8e78d6aa790ac935cda28f94e4a275b9'
          assert c.git_blob(Path('scripts/ci_kuuos_v1103_second_five_trial_sandbox.py').read_bytes())=='da0c43ffd3eb4bc8815d87b80fd8b76e0299f90f'
          assert c.git_blob(Path('formal/KUOS/DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103.lean').read_bytes())=='04de7e72813e0e28c9d4e499b68876f081b3bdba'
          assert c.git_blob(Path('formal/KUOS/DependentOriginationDoubleDeloopingTypeALowDimensionalFillersV1_102.lean').read_bytes())=='f8b492b210e5525990aa587fa2eb5c8648a5ff19'
          print('KUUOS_V1103_INDEPENDENT_GITHUB_PRECHECK_EXACT_SOURCE_PASS')
          PY
      - name: Download the actual sandbox selected GREEN candidate (not a new code proposal)
        uses: actions/download-artifact@v4
        with:
          run-id: 45165964775
          github-token: ${{ github.token }}
          name: kuuos-v1103-second-sandbox-green-selected-source
          path: /tmp/kuuos-v1103-independent-selected
      - name: Download original sandbox's append-only direct Lean and real MCP receipts
        uses: actions/download-artifact@v4
        with:
          run-id: 45165964775
          github-token: ${{ github.token }}
          name: kuuos-v1103-second-five-local-lean-mcp-append-only-receipts
          path: /tmp/kuuos-v1103-independent-local
      - name: Verify exact GitHub sandbox success, artifacts, all 15 declarations and pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci_kuuos_v1103_independent_selected_15_audit.py prepare
      - name: Set up independently pinned Lean without full-PR build
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned mathlib build cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Build exactly the certified v1.102 predecessor in fresh runner
        run: |
          set -euo pipefail
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeALowDimensionalFillersV1_102
      - name: Independently compile source SHA with 0 Lean warnings/errors/sorry
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true -Dweak.sorryAsError=true \
            -o /tmp/kuuos-v1103-independent-selected.olean \
            formal/KUOS/.v1103-independent-kernel/Selected.lean
      - name: Independent kernel 15 declared axiom inspection
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true -Dweak.sorryAsError=true \
            formal/KUOS/.v1103-independent-kernel/AxiomAudit.lean | tee /tmp/kuuos-v1103-independent-axioms.log
          PYTHONPATH=. python3 scripts/ci_kuuos_v1103_independent_selected_15_audit.py complete
      - name: Preserve independent kernel certificate with same source Git blob
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1103-independent-15-axioms-exact-green-receipt
          path: |
            /tmp/kuuos-v1103-independent-proof/
            /tmp/kuuos-v1103-independent-axioms.log
          if-no-files-found: warn
          retention-days: 30
