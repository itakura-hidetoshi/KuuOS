name: Qi Wuxing Phase Observation Universal Property v3.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/KUUOS_QI_WUXING_PHASE_OBSERVATION_UNIVERSAL_PROPERTY_v3_0.md'
      - 'formal/KUOS/Architecture/QiWuxingPhaseObservationUniversalPropertyV3_0.lean'
      - 'formal/KuuOSQiWuxingPhaseObservationUniversalPropertyV3_0.lean'
      - '.github/workflows/qi-wuxing-phase-observation-universal-property-v3-0-validation.yml'
  pull_request:
    paths:
      - 'docs/KUUOS_QI_WUXING_PHASE_OBSERVATION_UNIVERSAL_PROPERTY_v3_0.md'
      - 'formal/KUOS/Architecture/QiWuxingPhaseObservationUniversalPropertyV3_0.lean'
      - 'formal/KuuOSQiWuxingPhaseObservationUniversalPropertyV3_0.lean'
      - '.github/workflows/qi-wuxing-phase-observation-universal-property-v3-0-validation.yml'

permissions:
  contents: read

concurrency:
  group: qi-wuxing-phase-observation-universal-property-v30-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  lean:
    name: Focused strict Lean
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify package-local formal boundary
        run: |
          set -euo pipefail
          grep -Fq \
            'import KUOS.Architecture.QiWuxingAddConFirstIsomorphismV2_9' \
            legacy/v5.291/formal/KUOS/Architecture/QiWuxingPhaseObservationUniversalPropertyV3_0.lean
          grep -Fq \
            'import KUOS.Architecture.QiWuxingPhaseObservationUniversalPropertyV3_0' \
            legacy/v5.291/formal/KuuOSQiWuxingPhaseObservationUniversalPropertyV3_0.lean
      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: legacy/v5.291
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore Lean dependency and build cache
        id: lean-cache
        uses: actions/cache@v5
        with:
          path: |
            legacy/v5.291/.lake/packages
            legacy/v5.291/.lake/build
          key: kuuos-legacy-v5291-lean-v2-${{ runner.os }}-${{ hashFiles('legacy/v5.291/lean-toolchain', 'legacy/v5.291/lake-manifest.json') }}
      - name: Resolve dependencies on cache miss
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 scripts/run_formal_package.py --legacy -- update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          git diff --exit-code -- lake-manifest.json legacy/v5.291/lake-manifest.json
          python3 scripts/run_formal_package.py --legacy -- exe cache get
      - name: Strictly compile only the v3.0 module
        run: |
          set -euo pipefail
          python3 scripts/run_formal_package.py --legacy -- -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.QiWuxingPhaseObservationUniversalPropertyV3_0
