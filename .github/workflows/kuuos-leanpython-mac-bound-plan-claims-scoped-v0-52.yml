name: KuuOS LeanPython MAC Bound Plan Claims Scoped v0.52

# Additive target-local proof. Does not replace aggregate KuuOSFormal or
# cryptographically certify an issuer or historical native PlanOS output.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/kuuos-leanpython-mac-bound-plan-claims-scoped-v0-52.yml"
      - "formal/KUOS/Architecture/LeanPythonLocallyMacBoundPlanClaimsV0_52.lean"
      - "scripts/check_kuuos_lean_python_mac_bound_claims_sources_v0_52.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kuuos-leanpython-mac-bound-plan-claims-scoped-v0-52.yml"
      - "formal/KUOS/Architecture/LeanPythonLocallyMacBoundPlanClaimsV0_52.lean"

permissions:
  contents: read

concurrency:
  group: kuuos-leanpython-mac-claims-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  EXACT_CANONICAL_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  original-plan-mac-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - name: Check out exact canonical source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXACT_CANONICAL_SHA }}
          persist-credentials: false
      - name: Verify Lean and Mathlib pins without rewriting dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert Path("lean-toolchain").read_text().strip() == "leanprover/lean4:v4.30.0-rc2"
          manifest = json.loads(Path("lake-manifest.json").read_text())
          mathlib = [x for x in manifest["packages"] if x["name"] == "mathlib"]
          assert len(mathlib) == 1 and mathlib[0]["rev"] == (
              "5450b53e5ddc75d46418fabb605edbf36bd0beb6"
          )
          print("Exact Lean / mathlib pins checked, not original-issuer authority")
          PY
      - name: Set up pinned Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore shared exact-source Lake cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v052-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.EXACT_CANONICAL_SHA }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore pinned dependencies only if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
      - name: Independently compile exact canonical original v0.51 module
        shell: bash
        run: |
          set -euo pipefail
          printf 'EXACT_CANONICAL_SHA=%s\nEVENT=%s\n' "$EXACT_CANONICAL_SHA" "$GITHUB_EVENT_NAME" | tee kuuos-v052-scoped.log
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.LeanPythonTwoDeclaredPlanResultClaimsV0_51 \
            2>&1 | tee -a kuuos-v052-scoped.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Independently compile integrated v0.52 module after main push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.LeanPythonLocallyMacBoundPlanClaimsV0_52 \
            2>&1 | tee -a kuuos-v052-scoped.log
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Upload exact-head scope-limited Lean receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v052-scoped-${{ github.run_id }}-${{ github.run_attempt }}
          path: kuuos-v052-scoped.log
          if-no-files-found: warn
          retention-days: 14
