name: KuuOS v1.49 CodeAI standard type-A scaled horn direct Lean real MCP and independent audit

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v149-codeai-standard-type-a-real-mcp-v1.yml'
      - 'formal/KUOS/DependentOriginationStandardTypeAScaledHornFamilyV1_49.lean'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  V149_CHECKOUT_BLOB: 'c3824bb243367beb7df55491e47b5d91b4ac9be9'
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  codeai-v149-direct-and-real-mcp:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore fixed mathlib and compile exact v1.48 dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          assert require_pins(pathlib.Path('.').resolve())['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          b=pathlib.Path('formal/KUOS/DependentOriginationScaledAnodyneAttachmentFactorizationV1_48.lean').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='90f67bf0aefb6ecfe2dec7adfc8876ec2b39a31a'
          PY
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationScaledAnodyneAttachmentFactorizationV1_48
      - name: CodeAI conditional external comparison candidates and pinned direct Lean
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tempfile
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,FORBIDDEN_NEW
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationStandardTypeAScaledHornFamilyV1_49.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v149-codeai')
          out.mkdir(parents=True,exist_ok=True)
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(original)==os.environ['V149_CHECKOUT_BLOB']=='c3824bb243367beb7df55491e47b5d91b4ac9be9'
          baseline=(root/'legacy/v5.291/formal/KUOS/DependentOriginationStandardTypeAScaledHornFamilyV1_49.lean').read_text()
          assert blob(baseline.encode())=='a357b0ef3c2a4b43c49f6fb5bfe2892ff7a95064'
          patches=json.loads(r'''[{"old":"def standardTypeASimplexScaling\n","new":"@[reducible] def standardTypeASimplexScaling\n"},{"old":"def standardTypeAHornScaling\n","new":"@[reducible] def standardTypeAHornScaling\n"}]''')
          def patched(text,indexes):
              s=text
              for i in indexes:
                  item=patches[i]
                  assert s.count(item['old'])==1,('ambiguous CodeAI patch',i)
                  s=s.replace(item['old'],item['new'],1)
              return s
          variants={'simplex-only':patched(baseline,[0]),
                    'horn-only':patched(baseline,[1]),
                    'research-exact':patched(baseline,[0,1])}
          chosen=variants['research-exact']
          assert blob(chosen.encode())=='c3824bb243367beb7df55491e47b5d91b4ac9be9'
          def decls(s):
              return re.findall(r'^(?:@\[[^\]]+\] )?(?:noncomputable )?(?:def|instance|theorem|lemma|structure|abbrev)\s+([A-Za-z_][A-Za-z0-9_]*)',s,re.M)
          for name,s in variants.items():
              assert not FORBIDDEN_NEW.search(s),('new axioms/sorry',name)
              assert decls(s)==decls(baseline),('named theorem inventory altered',name)
              assert 'standardTypeAScaledHornFamily' in s and 'standardTypeAInducedScaledHornAttachmentGenerators' in s and 'standardTypeAScaledHornAttachmentGenerator_factorization' in s
          rows=[]
          try:
              for name,s in [('baseline',baseline),*variants.items()]:
                  target.write_text(s)
                  with tempfile.TemporaryDirectory(prefix='kuuos-v149-direct-') as tmp:
                      olean=pathlib.Path(tmp)/'candidate.olean'
                      p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true','-o',str(olean),rel],cwd=root,capture_output=True,text=True,timeout=600)
                      log=p.stdout+'\n'+p.stderr
                      errors=[x for x in log.splitlines() if re.search(r'\berror(?:\([^)]*\))?:',x)]
                      row={'candidate':name,'candidate_blob':blob(s.encode()),'candidate_sha256':digest(s),'exit_code':p.returncode,'olean_exists':olean.is_file(),'errors':errors,'success':p.returncode==0 and olean.is_file() and not errors and 'sorryAx' not in log}
                      rows.append(row)
                      (out/(name+'.log')).write_text(log)
                      print('KUUOS_V149_CODEAI_DIRECT '+json.dumps(row,sort_keys=True))
              assert not rows[0]['success'] and rows[0]['exit_code']!=0
              assert 'must be marked with' in (out/'baseline.log').read_text()
              selected=next(row for row in rows if row['candidate']=='research-exact')
              assert selected['success'],('selected research candidate failed',selected['errors'])
              (out/'source.lean').write_text(chosen)
              (out/'manifest.json').write_text(json.dumps({'source_head':os.environ['SOURCE_HEAD'],'checkout_blob':blob(original),'candidate_blob':selected['candidate_blob'],'candidate_sha256':selected['candidate_sha256'],'candidates':rows,'comparison_assumptions_preserved':True,'external_standard_family_not_instantiated':True,'source_restored':True,'git_write_performed':False,'independent_ci_success':False},indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V149_CODEAI_NEGATIVE_CONTROL_DIRECT_LEAN_COMPLETE')
          PY
      - name: Install real Lean MCP prerequisites
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Successful candidate only through actual KuuOS Lean MCP loop and second direct check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,run_loop,mcp_tactic_provider
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationStandardTypeAScaledHornFamilyV1_49.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v149-codeai')
          source=(out/'source.lean').read_bytes()
          try:
              target.write_bytes(source)
              p=subprocess.run(['lake','-KleanArgs=-DwarningAsError=true','-KleanArgs=-DsorryAsError=true','build','KUOS.DependentOriginationStandardTypeAScaledHornFamilyV1_49'],cwd=root,capture_output=True,text=True,timeout=3600)
              (out/'complete-build.log').write_text(p.stdout+'\n'+p.stderr)
              print(p.stdout,p.stderr)
              assert p.returncode==0
              receipt=run_loop(root=root,rel_file=rel,output_dir=pathlib.Path('/tmp/kuuos-v149-live-mcp'),expected_sha256=digest(source),provider=mcp_tactic_provider,max_iterations=1)
              assert receipt['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY'
              assert receipt['source_restored'] and not receipt['independent_ci_success'] and not receipt['git_write_performed']
              assert receipt['candidate_sha256']==digest(source)
              assert receipt['rounds'][0]['semantic_success'] and not receipt['rounds'][0]['errors']
              assert receipt['rounds'][0]['direct_lean']['exit_code']==0
              (out/'mcp.json').write_text(json.dumps(receipt,indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V149_CODEAI_DIRECT_THEN_REAL_MCP_SUCCESS_NOT_INDEPENDENT_CI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v149-codeai-candidate
          path: /tmp/kuuos-v149-codeai
          retention-days: 30
          if-no-files-found: error

  independent-v149-kernel-and-seventeen-axioms:
    needs: codeai-v149-direct-and-real-mcp
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - uses: actions/download-artifact@v4
        with:
          name: kuuos-v149-codeai-candidate
          path: /tmp/kuuos-v149-independent
      - name: Independently bind source HEAD pins candidate bytes and real MCP receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          root=pathlib.Path('.').resolve()
          assert require_pins(root)['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          p=pathlib.Path('/tmp/kuuos-v149-independent')
          m=json.loads((p/'manifest.json').read_text())
          r=json.loads((p/'mcp.json').read_text())
          source=(p/'source.lean').read_bytes()
          dest=root/'formal/KUOS/DependentOriginationStandardTypeAScaledHornFamilyV1_49.lean'
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert m['source_head']==os.environ['SOURCE_HEAD']
          assert blob(dest.read_bytes())==m['checkout_blob']==os.environ['V149_CHECKOUT_BLOB']
          assert blob(source)==m['candidate_blob']=='c3824bb243367beb7df55491e47b5d91b4ac9be9'
          assert hashlib.sha256(source).hexdigest()==m['candidate_sha256']==r['candidate_sha256']
          assert m['comparison_assumptions_preserved'] and m['external_standard_family_not_instantiated'] and m['source_restored'] and not m['git_write_performed'] and not m['independent_ci_success']
          assert r['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY' and r['source_restored'] and not r['independent_ci_success'] and not r['git_write_performed']
          assert r['rounds'][0]['direct_lean']['exit_code']==0 and r['rounds'][0]['semantic_success'] and not r['rounds'][0]['errors']
          dep=root/'formal/KUOS/DependentOriginationScaledAnodyneAttachmentFactorizationV1_48.lean'
          assert blob(dep.read_bytes())=='90f67bf0aefb6ecfe2dec7adfc8876ec2b39a31a'
          dest.write_bytes(source)
          print('KUUOS_V149_INDEPENDENT_EXACT_SOURCE_PIN_AND_MCP_RECEIPT_MATCH')
          PY
          lake exe cache get
      - name: Independent full strict Lean v1.49 dependency closure
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeAScaledHornFamilyV1_49 2>&1 | tee /tmp/kuuos-v149-independent/build.log
      - name: Seventeen conditional external Duskin fibrancy declarations independent standard axiom audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess
          ns='KUOS.DependentOriginationStandardTypeAScaledHornFamilyV1_49'
          names=["IsStandardTypeADistinguishedTriangle","standardTypeASimplexScaling","minimalScaling_le_standardTypeASimplexScaling","standardTypeADistinguishedTriangle_thin","standardTypeAHornScaling","standardTypeAHornInclusion_scaled","standardTypeAScaledHornProblem","standardTypeAScaledHornFamily","standardTypeAScaledHornProblem_admissible","standardTypeAHornFiller_of_family","StandardTypeAHornAttachmentGeneratorIndex","StandardTypeAHornAttachmentGeneratorIndex.toCanonical","standardTypeAInducedScaledHornAttachmentGeneratorHom","standardTypeAInducedScaledHornAttachmentGenerators","standardTypeAInducedScaledHornAttachmentGenerator_mem","standardTypeAInducedScaledHornAttachmentGenerators_le_induced","standardTypeAScaledHornAttachmentGenerator_factorization"]
          audit=pathlib.Path('formal/KUOS/DependentOriginationV149IndependentAxiomAudit.lean')
          audit.write_text('import '+ns+'\n'+'\n'.join('#print axioms '+ns+'.'+n for n in names)+'\n')
          p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true',str(audit)],capture_output=True,text=True,timeout=600)
          log=p.stdout+'\n'+p.stderr
          print(log)
          pathlib.Path('/tmp/kuuos-v149-independent/axioms.log').write_text(log)
          assert p.returncode==0 and 'sorryAx' not in log and 'error:' not in log
          rows=re.findall(r"'([^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",log,re.S)
          assert len(rows)==len(names) and {x[0] for x in rows}=={ns+'.'+n for n in names}
          allowed={'propext','Classical.choice','Quot.sound'}
          for _,ax in rows:
              assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed
          src=pathlib.Path('formal/KUOS/DependentOriginationStandardTypeAScaledHornFamilyV1_49.lean').read_text()
          assert 'standardTypeAScaledHornFamily' in src and 'standardTypeAInducedScaledHornAttachmentGenerators' in src
          assert 'StandardTypeAHornAttachmentGeneratorIndex' in src and 'standardTypeAScaledHornAttachmentGenerator_factorization' in src
          print('KUUOS_V149_SEVENTEEN_DECLARATIONS_STANDARD_AXIOMS_COMPARISON_CONDITIONAL')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v149-independent-proof-audit
          path: /tmp/kuuos-v149-independent
          retention-days: 30
          if-no-files-found: error
