name: KuuOS v1.80 isolated CodeAI pinned 30-declaration validation
on:
  push:
    branches:
      - 'validation/kuuos-v180-codeai-candidate-20261121'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v180-codeai-pinned-candidate-30-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact validation HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Build fixed v1.80 candidate and audit 30 public declarations
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v180_codeai_exact_source_v1.py --out /tmp/kuuos-v180-isolated-codeai-30-axioms
      - name: Preserve failed or successful exact-code receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v180-codeai-pinned-audit
          path: /tmp/kuuos-v180-isolated-codeai-30-axioms
          retention-days: 30
          if-no-files-found: warn
