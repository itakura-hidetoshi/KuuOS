name: KuuOS v1.88 R9 PR-adopted exact-source strict Lean 22 axioms
on:
  push:
    branches:
      - 'fix/kuuos-v127-v129-ulift-20261115'
    paths:
      - 'formal/KUOS/DependentOriginationCanonicalAttachmentScalingObstructionRetractV1_88.lean'
      - 'formal/KUOS/DependentOriginationCanonicalAttachmentScalingObstructionRetractCodeAICandidateR9V1_88.lean'
      - 'scripts/ci_kuuos_v188_r9_adopted_exact_source_v1.py'
      - '.github/workflows/kuuos-v188-r9-adopted-exact-source-v1.yml'
      - 'tests/test_public_root_restoration.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v188-r9-adopted-original-name-22-axioms:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact adopted PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Strict adopted R9 original-name source and independent 22-axiom audit
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v188_r9_adopted_exact_source_v1.py
      - name: Preserve post-adoption exact-head proof and axiom receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r9-pr-adopted-22
          path: /tmp/kuuos-v188-r9-adopted-22
          retention-days: 30
          if-no-files-found: warn
