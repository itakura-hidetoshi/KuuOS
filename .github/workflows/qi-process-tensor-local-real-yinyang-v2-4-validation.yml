name: Qi Process Tensor Local-Real Yin-Yang v2.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/KUUOS_QI_PROCESS_TENSOR_LOCAL_REAL_YINYANG_GEOMETRY_v2_4.md'
      - 'runtime/kuuos_qi_process_tensor_local_real_yinyang_geometry_v2_4.py'
      - 'scripts/check_qi_process_tensor_local_real_yinyang_geometry_v2_4.py'
      - 'tests/test_qi_process_tensor_local_real_yinyang_geometry_v2_4.py'
      - 'manifests/kuuos_qi_process_tensor_local_real_yinyang_geometry_v2_4.json'
      - 'formal/KUOS/Architecture/QiProcessTensorLocalRealYinYangGeometryV2_4.lean'
      - 'formal/KUOS.lean'
      - 'formal/KUOS/Architecture/QiWorldYinYangProcessBlockerComplementarityV2_3.lean'
      - 'formal/KUOS/WORLD/StandardFormModularFlowBridgeV0_32.lean'
      - 'formal/KUOS/WORLD/ModularStateKMSRelativeFlowBridgeV0_33.lean'
      - 'formal/KUOS/WORLD/KuuOSNonMarkovMemoryConnectionV0_72.lean'
      - 'runtime/kuuos_belief_os_types_v0_1.py'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/qi-process-tensor-local-real-yinyang-v2-4-validation.yml'
  pull_request:
    paths:
      - 'docs/KUUOS_QI_PROCESS_TENSOR_LOCAL_REAL_YINYANG_GEOMETRY_v2_4.md'
      - 'runtime/kuuos_qi_process_tensor_local_real_yinyang_geometry_v2_4.py'
      - 'scripts/check_qi_process_tensor_local_real_yinyang_geometry_v2_4.py'
      - 'tests/test_qi_process_tensor_local_real_yinyang_geometry_v2_4.py'
      - 'manifests/kuuos_qi_process_tensor_local_real_yinyang_geometry_v2_4.json'
      - 'formal/KUOS/Architecture/QiProcessTensorLocalRealYinYangGeometryV2_4.lean'
      - 'formal/KUOS.lean'
      - 'formal/KUOS/Architecture/QiWorldYinYangProcessBlockerComplementarityV2_3.lean'
      - 'formal/KUOS/WORLD/StandardFormModularFlowBridgeV0_32.lean'
      - 'formal/KUOS/WORLD/ModularStateKMSRelativeFlowBridgeV0_33.lean'
      - 'formal/KUOS/WORLD/KuuOSNonMarkovMemoryConnectionV0_72.lean'
      - 'runtime/kuuos_belief_os_types_v0_1.py'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/qi-process-tensor-local-real-yinyang-v2-4-validation.yml'

permissions:
  contents: read

concurrency:
  group: qi-process-tensor-local-real-yinyang-v24-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare diagnostics
        shell: bash
        run: mkdir -p artifacts/diagnostics

      - name: Compile v2.4 Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q \
            runtime/kuuos_belief_os_types_v0_1.py \
            runtime/kuuos_qi_process_tensor_local_real_yinyang_geometry_v2_4.py \
            scripts/check_qi_process_tensor_local_real_yinyang_geometry_v2_4.py \
            tests/test_qi_process_tensor_local_real_yinyang_geometry_v2_4.py \
            2>&1 | tee artifacts/diagnostics/python-compile.log

      - name: Validate v2.4 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool \
            manifests/kuuos_qi_process_tensor_local_real_yinyang_geometry_v2_4.json \
            > /dev/null
          echo 'PASS: v2.4 manifest JSON' | tee artifacts/diagnostics/manifest-validation.log

      - name: Validate local-real Yin-Yang runtime and tests
        shell: bash
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 scripts/check_qi_process_tensor_local_real_yinyang_geometry_v2_4.py \
            2>&1 | tee artifacts/diagnostics/v2-4-runtime.log
          python3 -m unittest -v \
            tests.test_qi_process_tensor_local_real_yinyang_geometry_v2_4 \
            2>&1 | tee -a artifacts/diagnostics/v2-4-runtime.log

      - name: Verify formal registration and dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            grep -Fq \
              'import KUOS.Architecture.QiProcessTensorLocalRealYinYangGeometryV2_4' \
              formal/KUOS.lean
            grep -Fq \
              'import KUOS.Architecture.QiWorldYinYangProcessBlockerComplementarityV2_3' \
              formal/KUOS/Architecture/QiProcessTensorLocalRealYinYangGeometryV2_4.lean
            grep -Fq \
              'import KUOS.WORLD.StandardFormModularFlowBridgeV0_32' \
              formal/KUOS/Architecture/QiProcessTensorLocalRealYinYangGeometryV2_4.lean
            grep -Fq \
              'import KUOS.WORLD.ModularStateKMSRelativeFlowBridgeV0_33' \
              formal/KUOS/Architecture/QiProcessTensorLocalRealYinYangGeometryV2_4.lean
            grep -Fq \
              'import KUOS.WORLD.KuuOSNonMarkovMemoryConnectionV0_72' \
              formal/KUOS/Architecture/QiProcessTensorLocalRealYinYangGeometryV2_4.lean
            echo 'PASS: formal root and analytic dependency imports'
          } 2>&1 | tee artifacts/diagnostics/formal-registration.log

      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update 2>&1 | tee artifacts/diagnostics/lake-update.log

      - name: Verify committed manifest is canonical
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- lake-manifest.json \
            2>&1 | tee artifacts/diagnostics/lake-manifest-diff.log

      - name: Fetch Mathlib olean cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee artifacts/diagnostics/mathlib-cache.log

      - name: Strictly compile v2.4 formal module
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KUOS.Architecture.QiProcessTensorLocalRealYinYangGeometryV2_4 \
            2>&1 | tee artifacts/diagnostics/v2-4-lean-module.log

      - name: Record run context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "ref=${GITHUB_REF}"
            echo "sha=${GITHUB_SHA}"
            python3 --version
            lake --version || true
            lean --version || true
          } > artifacts/diagnostics/context.log

      - name: Upload v2.4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi-process-tensor-local-real-yinyang-v2-4-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/
          if-no-files-found: error
