name: KuuOS v1.88 R7 actual native CodeAI source-bound CANDIDATE/REJECT
on:
  push:
    branches:
      - 'validation/kuuos-v188-r7-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  r7-native-codeai-proposal-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository CodeAI R7 observed candidate and adversarial rejection
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r7_native_governance_v1.py
      - name: Preserve candidate/rejection source-bound receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r7-native-codeai-receipt
          path: artifacts/codeai-v188-r7-native-governance
          retention-days: 30
          if-no-files-found: warn
