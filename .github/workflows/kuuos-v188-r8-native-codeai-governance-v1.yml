name: KuuOS v1.88 R8 native CodeAI exact-source CANDIDATE/REJECT
on:
  push:
    branches:
      - 'validation/kuuos-v188-r8-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-r8-codeai-proposal-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: KuuOS-native CodeAI R8 source observation and authorized candidate/reject gate
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r8_native_governance_v1.py
      - name: Archive source-bound CodeAI R8 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r8-native-codeai-receipt
          path: artifacts/codeai-v188-r8-native-governance
          retention-days: 30
          if-no-files-found: warn
