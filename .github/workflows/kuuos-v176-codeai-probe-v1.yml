name: KuuOS v1.76 CodeAI exact pinned raw transfinite candidate comparison (not proof)
on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v176-codeai-probe-v1.yml'
      - 'scripts/ci_kuuos_v176_codeai_probe.py'
      - 'scripts/ci_kuuos_v176_exact_source_audit_v1.py'
      - 'scripts/ci_kuuos_v177a_conditional_descent_v1.py'
      - 'formal/KUOS/DependentOriginationStandardTypeAEndpointConditionalDescentV1_77A.lean'
      - 'formal/KUOS/DependentOriginationStandardTypeAEndpointOppositeCellCodeAICandidateV1_77.lean'
      - 'scripts/ci_kuuos_v177_codeai_exact_source_v1.py'
      - 'scripts/ci_kuuos_v177_adopted_exact_source_v1.py'
      - 'scripts/ci_kuuos_v178_codeai_exact_source_v1.py'
      - 'formal/KUOS/DependentOriginationStandardABCPostEndpointCodeAICandidateV1_78.lean'
      - 'formal/KUOS/DependentOriginationStandardABCPostEndpointCanonicalComparisonV1_78.lean'
      - 'scripts/ci_kuuos_v178_adopted_exact_source_v1.py'
      - 'formal/KUOS/DependentOriginationStandardABCPositiveCanonicalResidualCodeAICandidateV1_79.lean'
      - 'scripts/ci_kuuos_v179_adopted_exact_source_v1.py'
      - 'formal/KUOS/DependentOriginationStandardABCPositiveCanonicalResidualSplitV1_79.lean'
      - 'scripts/ci_kuuos_v179_codeai_exact_source_v1.py'
      - 'formal/KUOS/DependentOriginationStandardTypeAEndpointOppositeCellCertificateV1_77.lean'
      - 'scripts/kuuos_v176_codeai_namespace_probe_v1.json'
      - 'scripts/kuuos_v176_codeai_monotonicity_universe_v2.json'
      - 'scripts/kuuos_v176_codeai_bit_recursion_v3.json'
      - 'formal/KUOS/DependentOriginationStandardTypeABoundaryPrismRawTransfiniteV1_76.lean'
permissions:
  contents: read
env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  SOURCE_BLOB: 'c7fd4eb959d05a2eeb430ea39a12d04ed4030ee9'
jobs:
  v176-codeai-direct-lean-not-certification:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Strict build of exact v1.75 source, pinned toolchain
        run: |
          set -euo pipefail
          python3 -c "import pathlib; from scripts.ci_kuuos_v164_codeai import pins; pins(pathlib.Path('.').resolve())"
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeABoundaryPrismRankwiseSimultaneousBPhaseV1_75
      - name: CodeAI compare three v1.76 native bit-recursion candidates, restore original
        run: python3 scripts/ci_kuuos_v176_codeai_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v176-codeai-bit-recursion-probe-not-proof
          path: /tmp/kuuos-v176-codeai-probe
          retention-days: 30
          if-no-files-found: warn

  adopted-v176-exact-source-kernel-and-41-axioms:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up exact pinned Lean toolchain without unrequested builds
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned Mathlib/Lake dependencies
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore mathlib cache when missing
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
      - name: Strict exact adopted v1.76 Lean module and 41 declaration independent axiom audit
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v176_exact_source_audit_v1.py \
            --out /tmp/kuuos-v176-adopted-exact-source-41-axioms \
            --timeout-seconds 4800
      - name: Preserve exact-head source and axiom receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v176-adopted-exact-source-41-axioms
          path: /tmp/kuuos-v176-adopted-exact-source-41-axioms
          retention-days: 30
          if-no-files-found: warn

  v177a-conditional-descent-pinned-lean-and-two-axioms:
