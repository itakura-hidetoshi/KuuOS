name: KuuOS Lean Formal Validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registered Lake target to compile
        required: true
        default: KuuOSFormal
        type: string
  push:
    branches:
      - main
    paths:
      - "formal/**"
      - "scripts/build_lean4.sh"
      - "docs/LEAN4_BUILD.md"
      - "lean-toolchain"
      - "lakefile.toml"
      - "lake-manifest.json"
      - ".github/workflows/lean-formal-validation.yml"

permissions:
  contents: read

concurrency:
  group: kuuos-lean-formal-${{ github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  formal:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      KUUOS_LEAN_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'KuuOSFormal' }}
    steps:
      - uses: actions/checkout@v6
      - name: Check build entrypoint syntax
        run: bash -n scripts/build_lean4.sh
      - name: Set up pinned Lean and Lake
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore Lake workspace cache
        uses: actions/cache@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Compile pinned Lean 4 target
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_lean4.sh --target "$KUUOS_LEAN_TARGET" \
            2>&1 | tee lean-formal-validation.log
      # KuuOSFormal does not import every theorem-bearing DO frontier.
      # On trusted main only, compile the newest committed DO version chain
      # with exactly the same strict Lean options as PR validation. The
      # actions/cache post-step then saves these .olean artifacts for NEW
      # pull requests, not only later commits of an existing pull request.
      # No cached result is treated as proof: Lake still hashes every input
      # and rebuilds any changed modules on each PR's exact HEAD.
      - name: Warm current dependent-origination theorem spine for PR caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t frontier_targets < <(
            python3 - <<'PY'
          import pathlib
          import re

          root = pathlib.Path("formal/KUOS")
          candidates = []
          for path in root.glob("DependentOrigination*V5_*.lean"):
              match = re.search(r"V5_(\d+)\.lean$", path.name)
              if match:
                  candidates.append((int(match.group(1)), f"KUOS.{path.stem}"))

          if not candidates:
              raise SystemExit("No versioned DO theorem frontier found; refusing cold baseline")
          max_version = max(version for version, _ in candidates)
          for version, target in sorted(candidates, key=lambda item: item[1]):
              if version == max_version:
                  print(target)
          PY
          )
          if (( ${#frontier_targets[@]} == 0 )); then
            echo "ERROR: no canonical DO theorem cache targets selected" >&2
            exit 1
          fi
          printf 'Warm canonical theorem modules: %s\n' "${frontier_targets[*]}"
          LEAN_ABORT_ON_PANIC=1 lake \
            -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build "${frontier_targets[@]}" 2>&1 | tee lean-frontier-cache-warm.log

      - name: Upload formal validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-lean-formal-validation-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            lean-formal-validation.log
            lean-frontier-cache-warm.log
          if-no-files-found: warn
          retention-days: 14
