name: KuuOS v1.74 CodeAI rankwise simultaneous A phase exact candidate probe (not certification)

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v174-codeai-probe-v1.yml'
      - 'scripts/ci_kuuos_v174_codeai_probe.py'
      - 'scripts/kuuos_v174_codeai_cause_separated_hunks_v1.json'
      - 'scripts/kuuos_v174_codeai_cause_separated_hunks_v2.json'
      - 'scripts/kuuos_v174_codeai_cause_separated_hunks_v3.json'
      - 'formal/KUOS/DependentOriginationStandardTypeABoundaryPrismRankwiseSimultaneousAPhaseV1_74.lean'
      - 'formal/KUOS/DependentOriginationStandardTypeABoundaryPrismRankwiseScaledPushoutV1_73.lean'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
  CHECKOUT_BLOB: 'f03e1d3aaba3803a77c50e935854ed215c0da0aa'

jobs:
  codeai-v174-probe-not-proof:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore exact pinned Lean dependencies and certified v1.73
        run: |
          set -euo pipefail
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationStandardTypeABoundaryPrismRankwiseScaledPushoutV1_73
      - name: Probe 19 exact-source CodeAI v1.74 cases, restore original
        run: python3 scripts/ci_kuuos_v174_codeai_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v174-codeai-probe-not-proof
          path: /tmp/kuuos-v174-codeai-probe
          retention-days: 30
          if-no-files-found: error
