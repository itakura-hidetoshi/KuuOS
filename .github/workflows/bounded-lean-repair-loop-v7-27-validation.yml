name: Bounded Lean repair loop v7.27 validation

on:
  pull_request:
    paths:
      - 'runtime/kuuos_runtime_bounded_lean_repair_loop_v7_27.py'
      - 'scripts/check_kuuos_runtime_bounded_lean_repair_loop_v7_27.py'
      - 'manifests/kuuos_bounded_lean_repair_loop_v7_27.json'
      - 'docs/KUUOS_BOUNDED_LEAN_REPAIR_LOOP_v7_27.md'
      - '.github/workflows/bounded-lean-repair-loop-v7-27-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile bounded Lean repair loop
        run: |
          python -m py_compile             runtime/kuuos_runtime_bounded_lean_repair_loop_v7_27.py             scripts/check_kuuos_runtime_bounded_lean_repair_loop_v7_27.py

      - name: Run focused bounded repair checks
        run: |
          PYTHONPATH=. python scripts/check_kuuos_runtime_bounded_lean_repair_loop_v7_27.py

      - name: Verify repair-loop boundaries
        run: |
          grep -Fq '"repair_scope_is_entire_target_file": true' manifests/kuuos_bounded_lean_repair_loop_v7_27.json
          grep -Fq '"lean_errors_remaining_reject_candidate": false' manifests/kuuos_bounded_lean_repair_loop_v7_27.json
          grep -Fq '"budget_exhaustion_is_rejection": false' manifests/kuuos_bounded_lean_repair_loop_v7_27.json
          grep -Fq '"git_admission_ready_is_remote_publish_ready": false' manifests/kuuos_bounded_lean_repair_loop_v7_27.json
          grep -Fq '"source_authority_transferred": false' manifests/kuuos_bounded_lean_repair_loop_v7_27.json

      - name: Confirm Strict Lean is not invoked
        run: |
          echo "Runtime-only repair evidence loop: Strict Lean intentionally not invoked."
