name: KuuOS v1.109 CodeAI round2 MemoryOS exact namespace correction

on:
  pull_request:
    paths:
      - "scripts/kuuos_v1109_codeai_actual_four_cocycle_round2_v1.py"
      - "memoryos/external/github/2026/11/kuuos_codeai_lean_observations_v1109_round1_v1.json"
      - ".github/workflows/kuuos-v1109-codeai-actual-four-cocycle-round2-v1.yml"

permissions:
  contents: read

jobs:
  v1109-codeai-round2-direct-lean-real-mcp:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce append-only MemoryOS round1 failures without assuming a cause
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 - <<'PY'
          from pathlib import Path
          from runtime.kuuos_codeai_lean_observation_intake_v0_2 import read_observation_directory
          from runtime.kuuos_codeai_lean_observation_intake_v0_1 import read_observation_seed
          root=Path('memoryos/external/github/2026/11')
          records=read_observation_directory(root)
          added=read_observation_seed(root/'kuuos_codeai_lean_observations_v1109_round1_v1.json')
          assert len(records)>=20 and len(added)==3
          assert len({c['id'] for c in records})==len(records)
          assert all(c['outcome']=='DIRECT_LEAN_FAILURE' and
                     c['causal_status']=='UNVERIFIED_HYPOTHESIS'
                     for c in added)
          print('KUUOS_V1109_MEMORYOS_FAILURES_PRESERVED',len(records))
          PY
      - name: Setup fixed Lean 4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore exact pinned parent cache read-only
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve fixed mathlib
        run: lake exe cache get
      - name: Strict imported v1.108 exact dependency closure
        run: |
          set -euo pipefail
          timeout 2400 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAFourAllTetrahedraV1_108
      - name: Install fixed real Lean MCP transport
        run: python3 -m pip install uv
      - name: CodeAI round2 five candidates pinned direct Lean then green-only real MCP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1109_codeai_actual_four_cocycle_round2_v1.py
          PYTHONPATH=. python3 scripts/kuuos_v1109_codeai_actual_four_cocycle_round2_v1.py
      - name: Archive red-green result history, source candidate receipts and real MCP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1109-codeai-cocycle-round2-${{ github.run_id }}
          path: |
            /tmp/kuuos-v1109-codeai-round2/
            /tmp/kuuos-v1109-real-mcp-round2/
            /tmp/kuuos-v1109-memoryos-round2/
          retention-days: 30
          if-no-files-found: warn
