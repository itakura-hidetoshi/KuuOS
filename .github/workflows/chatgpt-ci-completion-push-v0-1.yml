name: ChatGPT CI Completion Push v0.1

on:
  workflow_run:
    workflows:
      - "KuuOS PR Governance Gate"
    types: [completed]

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-ci-completion-push-v01-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0].number != null
      }}
    name: Emit bounded PR completion wake-up
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish deduplicated PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          run_id = os.environ["RUN_ID"]
          run_attempt = os.environ["RUN_ATTEMPT"]
          marker = (
              "<!-- CHATGPT_CI_COMPLETION_PUSH_V0_1 "
              f"run_id={run_id} attempt={run_attempt} -->"
          )

          packet = {
              "version": "chatgpt_ci_completion_push_v0_1",
              "repository": repository,
              "pull_request": int(pr_number),
              "workflow": os.environ["WORKFLOW_NAME"],
              "run_id": int(run_id),
              "run_attempt": int(run_attempt),
              "status": os.environ["RUN_STATUS"],
              "conclusion": os.environ["RUN_CONCLUSION"],
              "head_sha": os.environ["HEAD_SHA"],
              "head_branch": os.environ["HEAD_BRANCH"],
              "run_url": os.environ["RUN_URL"],
              "updated_at": os.environ["UPDATED_AT"],
              "event_is_wakeup_signal_only": True,
              "fresh_mcp_reobservation_required": True,
              "polling_required": False,
          }
          body = (
              f"{marker}\n\n"
              "ChatGPT CI completion wake-up signal. This comment is not CI truth and grants no merge/write authority.\n\n"
              "After webhook activation, fresh-reobserve this exact workflow run once through GitHub MCP, verify the exact head SHA and terminal job/step result, then continue. Do not poll the run waiting for completion.\n\n"
              "```json\n"
              + json.dumps(packet, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n```\n"
          )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "KuuOS-ChatGPT-CI-Completion-Push-v0.1",
          }
          comments_url = (
              f"https://api.github.com/repos/{repository}/issues/{pr_number}/comments"
          )

          found = False
          page = 1
          while True:
              request = urllib.request.Request(
                  f"{comments_url}?per_page=100&page={page}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  comments = json.load(response)
              if any(marker in (item.get("body") or "") for item in comments):
                  found = True
                  break
              if len(comments) < 100:
                  break
              page += 1

          if found:
              print(
                  "CHATGPT_CI_COMPLETION_PUSH_DEDUPLICATED "
                  f"pr={pr_number} run_id={run_id} attempt={run_attempt}"
              )
          else:
              payload = json.dumps({"body": body}, ensure_ascii=False).encode("utf-8")
              request = urllib.request.Request(
                  comments_url,
                  data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  created = json.load(response)
              print(
                  "CHATGPT_CI_COMPLETION_PUSH_CREATED "
                  f"pr={pr_number} comment={created.get('id')} run_id={run_id} "
                  f"attempt={run_attempt} conclusion={packet['conclusion']}"
              )
          PY

      - name: Publish non-authority summary
        if: always()
        run: |
          {
            echo '## ChatGPT CI Completion Push v0.1'
            echo
            echo '- Trigger: `workflow_run: completed` for `KuuOS PR Governance Gate`.'
            echo '- Delivery surface: deduplicated pull-request comment for ChatGPT Work webhook activation.'
            echo '- The comment is a wake-up signal only, not CI truth.'
            echo '- After activation, perform one fresh exact GitHub MCP observation; do not poll for completion.'
            echo '- Existing durable re-entry remains independent fallback storage.'
          } >> "$GITHUB_STEP_SUMMARY"
