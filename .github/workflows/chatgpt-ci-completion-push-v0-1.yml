name: ChatGPT CI Completion Push v0.1

on:
  workflow_run:
    workflows:
      - "KuuOS PR Governance Gate"
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: chatgpt-ci-completion-push-v01-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      ${{
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    name: Emit bounded PR completion wake-up
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run wake-up regression tests
        id: regression
        run: >-
          python3 -m unittest -v
          tests.test_chatgpt_ci_completion_push_v0_2
          tests.test_chatgpt_ci_completion_commit_wakeup_v0_1

      - name: Publish deduplicated PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          USER_AGENT: KuuOS-ChatGPT-CI-Completion-Push-v0.2
        run: python3 scripts/chatgpt_ci_completion_push_v0_2.py

      - name: Publish immutable CI Inbox commit update
        if: ${{ always() && steps.regression.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          INBOX_BRANCH: infra/chatgpt-ci-inbox-events-v0-1
          INBOX_PULL_REQUEST: "1663"
          USER_AGENT: KuuOS-ChatGPT-CI-Commit-Wakeup-v0.1
        run: python3 scripts/chatgpt_ci_completion_commit_wakeup_v0_1.py

      - name: Publish non-authority summary
        if: always()
        run: |
          {
            echo '## ChatGPT CI Completion Push v0.1 / resolver v0.2'
            echo
            echo '- Trigger: `workflow_run: completed` for `KuuOS PR Governance Gate`.'
            echo '- Exact source PR/run/head identity is resolved from the completed workflow run or exact commit association.'
            echo '- Delivery surface A: deduplicated pull-request comment.'
            echo '- Delivery surface B: immutable receipt commit on the persistent CI Inbox PR #1663.'
            echo '- Comment and commit-update receipts are wake-up signals only, never CI truth.'
            echo '- Work must freshly re-observe the exact source run through GitHub MCP and deduplicate by exact identity.'
          } >> "$GITHUB_STEP_SUMMARY"
