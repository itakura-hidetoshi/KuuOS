name: KuuOS Gauge-Field Self-Organization v0.60

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'runtime/kuuos_gauge_field_self_organization_types_v0_60.py'
      - 'runtime/kuuos_discrete_gauge_connection_v0_60.py'
      - 'runtime/kuuos_gauge_field_self_organization_v0_60.py'
      - 'tests/test_kuuos_gauge_field_*_v0_60.py'
      - 'scripts/check_kuuos_gauge_field_self_organization_v0_60.py'
      - 'scripts/ci_subsystem_lean_scope.py'
      - 'docs/KUUOS_GAUGE_FIELD_SELF_ORGANIZATION_v0_60.md'
      - 'manifests/kuuos_gauge_field_self_organization_v0_60.json'
      - 'formal/KUOS/WORLD/KuuOSGaugeFieldSelfOrganizationV0_60.lean'
      - 'formal/KuuOSFormalV0_60.lean'
      - 'formal/KUOS.lean'
      - 'formal/KuuOSFormal.lean'
      - 'lakefile.toml'
      - '.github/workflows/kuuos-gauge-field-self-organization-v0-60.yml'
  pull_request:
    paths:
      - 'runtime/kuuos_gauge_field_self_organization_types_v0_60.py'
      - 'runtime/kuuos_discrete_gauge_connection_v0_60.py'
      - 'runtime/kuuos_gauge_field_self_organization_v0_60.py'
      - 'tests/test_kuuos_gauge_field_*_v0_60.py'
      - 'scripts/check_kuuos_gauge_field_self_organization_v0_60.py'
      - 'scripts/ci_subsystem_lean_scope.py'
      - 'docs/KUUOS_GAUGE_FIELD_SELF_ORGANIZATION_v0_60.md'
      - 'manifests/kuuos_gauge_field_self_organization_v0_60.json'
      - 'formal/KUOS/WORLD/KuuOSGaugeFieldSelfOrganizationV0_60.lean'
      - 'formal/KuuOSFormalV0_60.lean'
      - 'formal/KUOS.lean'
      - 'formal/KuuOSFormal.lean'
      - 'lakefile.toml'
      - '.github/workflows/kuuos-gauge-field-self-organization-v0-60.yml'

permissions:
  contents: read

concurrency:
  group: kuuos-gauge-v060-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  gauge-field-v060:
    name: Gauge-field v0.60 runtime and Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      # PR Governance checks the full public aggregate at the exact HEAD.
      # This subsystem check still tests runtime/registration on every trigger,
      # but root-only, global-Lake and documentation edits need no SECOND Lean build.
      - name: Select subsystem Lean scope (fail closed)
        id: lean-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          elif [[ -z "${BASE_SHA:-}" ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            PYTHONPATH=. python3 scripts/ci_subsystem_lean_scope.py \
              --workflow .github/workflows/kuuos-gauge-field-self-organization-v0-60.yml \
              --base "${BASE_SHA}" --head HEAD \
              --github-output "${GITHUB_OUTPUT}" \
              --delegated-path formal/KuuOSFormal.lean \
              --delegated-path formal/KUOS.lean \
              --delegated-path docs/KUUOS_GAUGE_FIELD_SELF_ORGANIZATION_v0_60.md
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime and validator
        run: >-
          python3 -m compileall -q
          runtime/kuuos_gauge_field_self_organization_types_v0_60.py
          runtime/kuuos_discrete_gauge_connection_v0_60.py
          runtime/kuuos_gauge_field_self_organization_v0_60.py
          tests/test_kuuos_gauge_field_self_organization_v0_60.py
          tests/test_kuuos_gauge_field_fixed_connection_v0_60.py
          tests/test_kuuos_gauge_field_fixed_domain_v0_60.py
          scripts/check_kuuos_gauge_field_self_organization_v0_60.py
      - name: Run gauge-field runtime validation
        run: PYTHONPATH=. python3 scripts/check_kuuos_gauge_field_self_organization_v0_60.py
      - name: Verify canonical registration
        shell: bash
        run: |
          grep -Fq 'import KUOS.WORLD.KuuOSGaugeFieldSelfOrganizationV0_60' formal/KUOS.lean
          grep -Fq 'import KUOS.WORLD.KuuOSGaugeFieldSelfOrganizationV0_60' formal/KuuOSFormal.lean
          grep -Fq '"KuuOSFormalV0_60"' lakefile.toml
      # Read ONLY the trusted default/base-branch cache published by
      # lean-formal-validation.yml. Never create a PR-shared package cache.
      - name: Restore trusted main Lake workspace (read-only)
        id: trusted-lake-cache
        if: steps.lean-scope.outputs.needed == 'true'
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report trusted Lake cache origin
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        env:
          CACHE_KEY: ${{ steps.trusted-lake-cache.outputs.cache-matched-key }}
        run: echo "Trusted main Lake cache: ${CACHE_KEY:-miss}"

      - name: Set up pinned Lean and Lake
        if: steps.lean-scope.outputs.needed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      # A cache prefix is not proof that pinned sources/oleans exist.
      # Strictly verify the toolchain and committed manifest on every run.
      - name: Resolve pinned dependencies only when missing
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Build v0.60 formal root
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -o pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KuuOSFormalV0_60 2>&1 | tee gauge-v060-build.log
      # Full aggregate is already checked at PR exact HEAD by Governance
      # and on main by lean-formal-validation; manual dispatch retains it.
      - name: Build aggregate formal root
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -o pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KuuOSFormal 2>&1 | tee aggregate-formal-build.log
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-gauge-field-v060-diagnostics
          path: |
            gauge-v060-build.log
            aggregate-formal-build.log
          if-no-files-found: ignore
