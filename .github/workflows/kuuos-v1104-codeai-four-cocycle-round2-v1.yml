name: KuuOS v1.104 CodeAI second-round finite cocycle correction

on:
  pull_request:
    paths:
      - "scripts/kuuos_v1104_codeai_four_cocycle_round2_v1.py"
      - ".github/workflows/kuuos-v1104-codeai-four-cocycle-round2-v1.yml"

permissions:
  contents: read

jobs:
  v1104_source_state:
    name: Determine exact unmodified versus promoted v1.104 source
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      needs_codegen: ${{ steps.source_state.outputs.needs_codegen }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check original absence or exactly verified candidate Git blob
        id: source_state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          target=Path('formal/KUOS/DependentOriginationDoubleDeloopingTypeAFourDimensionalCocycleV1_104.lean')
          promoted='6c4c3a2243796aa19d494c685b1b52796feeb2dd'
          if not target.exists():
              value='true'
              status='MISSING_SOURCE_CANDIDATES_ALLOWED'
          else:
              raw=target.read_bytes()
              blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if blob!=promoted:
                  raise RuntimeError('v1.104 unrecognized proof blob; refuse CodeAI re-generation: '+blob)
              value='false'
              status='EXACT_PROMOTED_SOURCE_USE_INDEPENDENT_CI'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('needs_codegen='+value,file=output)
          print('KUUOS_V1104_STAGE_ROUTING',status,value)
          PY

  codeai-v1104-round2-all-direct-then-real-mcp:
    needs: v1104_source_state
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 && needs.v1104_source_state.outputs.needs_codegen == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout immutable source HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup fixed Lean and mathlib
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned PR build cache read-only
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve pinned mathlib
        run: lake exe cache get
      - name: Strictly validate imported v1.103 dependency closure
        run: |
          set -euo pipefail
          timeout 1800 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAHighDimensionalFillersV1_103
      - name: Install actual Lean MCP transport
        run: python3 -m pip install uv
      - name: CodeAI multi-candidate generate, direct Lean every candidate, then real Lean MCP only on green
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1104_codeai_four_cocycle_round2_v1.py
          PYTHONPATH=. python3 scripts/kuuos_v1104_codeai_four_cocycle_round2_v1.py
      - name: Preserve candidate source digests, full errors and MCP receipts without promoting red proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1104-codeai-four-cocycle-round2-${{ github.run_id }}
          path: |
            /tmp/kuuos-v1104-codeai-round2/
            /tmp/kuuos-v1104-round2-real-mcp/
          if-no-files-found: warn
          retention-days: 30
