name: "KuuOS v1.106 CodeAI R1 typed pushout descent local trials (no independent CI on RED)"

on:
  push:
    branches:
      - 'research/v1106-codeai-original-direct-20261124'
    paths:
      - '.github/workflows/kuuos-v1106-codeai-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1106-source-bound-local-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact v1.106 research branch with no credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Python 3.12 for pinned semantic MCP
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup pinned Lean without building whole PR
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore fixed Lake cache when present
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Bootstrap local lean-lsp-mcp pinned to 0.30.0
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Preflight exact source and CodeAI candidate Git blobs
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ci_kuuos_v1106_codeai_r1_local.py
          python3 -m py_compile scripts/kuuos_sandbox_lean_cycle_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts import kuuos_sandbox_lean_cycle_v1 as c
          expected = {
              'formal/KUOS/DependentOriginationDoubleDeloopingTypeCTerminalRLPStandardRightV1_106.lean': '6e06ac88c2b1cdadcb0d0f7496281892a3549c64',
              'legacy/v5.291/formal/KUOS/DependentOriginationDoubleDeloopingTypeCTerminalRLPStandardRightV1_106.lean': '6e06ac88c2b1cdadcb0d0f7496281892a3549c64',
              'formal/KUOS/DependentOriginationDoubleDeloopingTypeCOuterHornCocycleCompletionV1_105.lean': '725b4d73037655576d495e32a6e202cd1affaf15',
              'formal/KUOS/DependentOriginationDoubleDeloopingTypeADimensionFourFamilyRLPV1_104.lean': '5c911aaeb9a21baff57f6af8c8655309af47d027',
              'scripts/ci_kuuos_v1106_codeai_r1_local.py': '28020bb09389317fe36705488c4297fd94062d34',
              'scripts/kuuos_sandbox_lean_cycle_v1.py': '5383253dbe9cda9cab90a410c2fd66ee6b9d6f41',
              'research/codeai/v1106/r1/A-explicit-namespace.lean': 'c1900a7daf2469ffe8e387981ddbcdee96c33ce0',
              'research/codeai/v1106/r1/B-typed-congr.lean': 'ac54b935d2f5c3145e22ed527ecb5f1e54425da4',
          }
          for path,blob in expected.items():
              assert c.git_blob(Path(path).read_bytes())==blob,path
          assert Path('lean-toolchain').read_text().strip()=='leanprover/lean4:v4.30.0-rc2'
          assert [p['rev'] for p in json.loads(Path('lake-manifest.json').read_text())['packages']
                  if p['name']=='mathlib'] == ['5450b53e5ddc75d46418fabb605edbf36bd0beb6']
          print('KUUOS_V1106_ORIGINAL_V105_TWO_CANDIDATES_AND_PINNED_TOOLCHAIN_EXACT')
          PY
      - name: Build v1.105 exact predecessor only
        run: |
          set -euo pipefail
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true \
            build KUOS.DependentOriginationDoubleDeloopingTypeCOuterHornCocycleCompletionV1_105
      - name: CodeAI direct Lean serial trials, 18 axiom audit and real MCP only after GREEN
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/ci_kuuos_v1106_codeai_r1_local.py
      - name: Preserve exact RED diagnostics and local source-bound receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1106-r1-two-local-direct-receipts
          path: /tmp/kuuos-v1106-r1-trials/
          if-no-files-found: warn
          retention-days: 30
      - name: Export exact candidate only when local direct plus axioms and real MCP GREEN
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1106-r1-local-green-selected-source
          path: /tmp/kuuos-v1106-r1-green/
          if-no-files-found: error
          retention-days: 30
