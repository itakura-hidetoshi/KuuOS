name: Prepare Explicit Kuu Consumer Migration

on:
  pull_request:
    paths:
      - 'scripts/migrate_kuu_consumers.py'
      - 'scripts/formal_package_boundary.py'
      - 'scripts/run_formal_package.py'
      - 'tests/test_kuu_consumer_migration.py'
      - 'tests/test_formal_package_boundary.py'
      - '.github/workflows/kuu-prepare-consumer-migration.yml'

permissions:
  contents: read

jobs:
  prepare-objects:
    if: github.repository == 'itakura-hidetoshi/KuuOS' && github.event.pull_request.number == 2338 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'formal/v5-292-independent-kuu-foundation-restructure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check migration and package boundaries
        run: python3 -m unittest tests.test_kuu_consumer_migration tests.test_formal_package_boundary -v
      - name: Stage reviewed Git objects only; do not update any branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/migrate_kuu_consumers.py --publish-objects
