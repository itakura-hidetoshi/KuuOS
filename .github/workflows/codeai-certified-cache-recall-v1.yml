name: CodeAI v0.5 certified cache recall pilot — sandbox then independent
on:
  push:
    branches: [research/codeai-certified-cache-recall-v1-20261126]
    paths:
      - ".github/workflows/codeai-certified-cache-recall-v1.yml"
permissions:
  contents: read
  actions: read
env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: '.'
concurrency:
  group: codeai-certified-cache-recall-v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sandbox-source-then-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Negative observation admission fixtures
        run: python3 -m unittest -v tests.test_codeai_prior_proof_kernel_recall_v0_4 tests.test_codeai_prior_proof_kernel_frontier_v0_5
      - name: Install exact pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-e1d754e8e0fc9382001a2e698751aa11d4272b84
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore admitted canonical Lean project artifact (pilot requires actual hit)
        id: verified_project
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_verified_lean_project_cache_v1.py restore --base e1d754e8e0fc9382001a2e698751aa11d4272b84
      - name: Require exact-scope actual production cache restore
        env:
          RESTORED: ${{ steps.verified_project.outputs.restored }}
          SCOPE: ${{ steps.verified_project.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          echo KUUOS_CODEAI_CERTIFIED_CACHE_HIT
      - name: Build original selected modules and dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts/prior-proof-kernel-v05
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build +Kuu.LivingEngi.SourceAwareOverlapDescentCriterion KUOS.Architecture.QiWuxingNativeC60GaugeV3_4 > artifacts/prior-proof-kernel-v05/dependency-build.log 2>&1 || { tail -n 100 artifacts/prior-proof-kernel-v05/dependency-build.log; exit 1; }
          tail -n 20 artifacts/prior-proof-kernel-v05/dependency-build.log
      - name: Direct source-local Lean types, proof constants and axiom observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/codeai_prior_proof_kernel_frontier_v0_5.py --phase direct --out artifacts/prior-proof-kernel-v05
      - name: Install real pinned Lean MCP launcher
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Actual Lean MCP hover, diagnostics and verify only after direct green
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/codeai_prior_proof_kernel_frontier_v0_5.py --phase mcp --out artifacts/prior-proof-kernel-v05
      - name: Existing 13-declaration memory and deterministic CodeAI boundary replay
        env:
          GH_TOKEN: ${{ github.token }}
          KUUOS_KERNEL_FIRST: artifacts/prior-proof-kernel-v05
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_codeai_prior_proof_kernel_memory_v0_5 tests.test_codeai_prior_proof_kernel_research_gate_v0_5 2>&1 | tee artifacts/prior-proof-kernel-v05/memory-replay.log
          grep -F 'KUUOS_V05_ACTUAL_COMBINED_RECALL 13/13' artifacts/prior-proof-kernel-v05/memory-replay.log
          grep -F 'KUUOS_ACTUAL_CODEAI_V05_COMBINED_BOUNDARY_REPLAY' artifacts/prior-proof-kernel-v05/memory-replay.log
      - name: Preserve actual observation or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeai-certified-cache-recall-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prior-proof-kernel-v05/
          retention-days: 30
          if-no-files-found: warn
  independent-source-observation:
    needs: sandbox-source-then-mcp
    if: needs.sandbox-source-then-mcp.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: codeai-certified-cache-recall-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: first-recall/
      - name: Install exact pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-e1d754e8e0fc9382001a2e698751aa11d4272b84
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore admitted canonical Lean project artifact (pilot requires actual hit)
        id: verified_project
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_verified_lean_project_cache_v1.py restore --base e1d754e8e0fc9382001a2e698751aa11d4272b84
      - name: Require exact-scope actual production cache restore
        env:
          RESTORED: ${{ steps.verified_project.outputs.restored }}
          SCOPE: ${{ steps.verified_project.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          echo KUUOS_CODEAI_CERTIFIED_CACHE_HIT
      - name: Build original selected modules and dependencies
        run: |
          set -euo pipefail
          mkdir -p artifacts/prior-proof-kernel-v05
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build +Kuu.LivingEngi.SourceAwareOverlapDescentCriterion KUOS.Architecture.QiWuxingNativeC60GaugeV3_4 > artifacts/prior-proof-kernel-v05/dependency-build.log 2>&1 || { tail -n 100 artifacts/prior-proof-kernel-v05/dependency-build.log; exit 1; }
          tail -n 20 artifacts/prior-proof-kernel-v05/dependency-build.log
      - name: Independently re-elaborate and compare source-local observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/codeai_prior_proof_kernel_frontier_v0_5.py --phase independent --out artifacts/prior-proof-kernel-v05 --first first-recall
      - name: Preserve actual observation or failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeai-certified-cache-recall-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prior-proof-kernel-v05/
          retention-days: 30
          if-no-files-found: warn
