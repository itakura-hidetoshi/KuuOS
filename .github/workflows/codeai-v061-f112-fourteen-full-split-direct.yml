        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeai-v061-f112-fourteen-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/codeai-v061-f112-fourteen-full-decomposition/
