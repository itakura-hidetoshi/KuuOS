name: CapabilityOS Qi-WORLD v0.60

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runtime/kuuos_capabilityos_types_v0_60.py"
      - "runtime/kuuos_capabilityos_qi_world_kernel_v0_60.py"
      - "runtime/kuuos_capabilityos_qi_world_scenarios_v0_60.py"
      - "scripts/check_capabilityos_qi_world_kernel_v0_60.py"
      - "tests/test_capabilityos_qi_world_kernel_v0_60.py"
      - "formal/KUOS/CapabilityOS/QiWorldCapabilityKernelV0_60.lean"
      - "formal/KUOS.lean"
      - "formal/KuuOSFormal.lean"
      - "docs/KUUOS_CAPABILITYOS_QI_WORLD_KERNEL_v0_60.md"
      - "manifests/kuuos_capabilityos_qi_world_kernel_v0_60.json"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/ci_subsystem_lean_scope.py"
      - "scripts/ci_codeai_lean_scope.py"
      - ".github/workflows/capabilityos-qi-world-v0-60-validation.yml"
  pull_request:
    paths:
      - "runtime/kuuos_capabilityos_types_v0_60.py"
      - "runtime/kuuos_capabilityos_qi_world_kernel_v0_60.py"
      - "runtime/kuuos_capabilityos_qi_world_scenarios_v0_60.py"
      - "scripts/check_capabilityos_qi_world_kernel_v0_60.py"
      - "tests/test_capabilityos_qi_world_kernel_v0_60.py"
      - "formal/KUOS/CapabilityOS/QiWorldCapabilityKernelV0_60.lean"
      - "formal/KUOS.lean"
      - "formal/KuuOSFormal.lean"
      - "docs/KUUOS_CAPABILITYOS_QI_WORLD_KERNEL_v0_60.md"
      - "manifests/kuuos_capabilityos_qi_world_kernel_v0_60.json"
      - "lakefile.toml"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/ci_subsystem_lean_scope.py"
      - "scripts/ci_codeai_lean_scope.py"
      - ".github/workflows/capabilityos-qi-world-v0-60-validation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python surfaces
        run: >-
          python3 -m compileall -q
          runtime/kuuos_capabilityos_types_v0_60.py
          runtime/kuuos_capabilityos_qi_world_kernel_v0_60.py
          runtime/kuuos_capabilityos_qi_world_scenarios_v0_60.py
          scripts/check_capabilityos_qi_world_kernel_v0_60.py
          tests/test_capabilityos_qi_world_kernel_v0_60.py
      - name: Validate manifest JSON
        run: >-
          python3 -m json.tool
          manifests/kuuos_capabilityos_qi_world_kernel_v0_60.json
          > /dev/null
      - name: Validate CapabilityOS v0.60
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/check_capabilityos_qi_world_kernel_v0_60.py \
            2>&1 | tee capabilityos-v0-60-runtime.log
      - name: Run CapabilityOS v0.60 unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest -v \
            tests.test_capabilityos_qi_world_kernel_v0_60 \
            2>&1 | tee -a capabilityos-v0-60-runtime.log
      - name: Run Qi-WORLD v2.3 regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/check_qi_world_yinyang_process_blocker_complementarity_v2_3.py \
            2>&1 | tee -a capabilityos-v0-60-runtime.log
      - name: Run MemoryOS v0.37 regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 scripts/check_memoryos_predictive_shielded_memory_v0_37.py \
            2>&1 | tee -a capabilityos-v0-60-runtime.log
      # On a PR changing only the public aggregate, exact-head Governance
      # already compiles the formal closure; retain runtime and static checks.
      - name: Preserve original public roots and CapabilityOS import
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_public_proof_roots.py
          grep -Fq 'import KUOS.CapabilityOS.QiWorldCapabilityKernelV0_60' formal/KUOS.lean

      - name: Select subsystem Lean scope (fail closed)
        id: lean-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "needed=true" >> "${GITHUB_OUTPUT}"
          else
            PYTHONPATH=. python3 scripts/ci_subsystem_lean_scope.py \
              --workflow .github/workflows/capabilityos-qi-world-v0-60-validation.yml \
              --base "${BASE_SHA}" --head HEAD \
              --github-output "${GITHUB_OUTPUT}" \
              --delegated-path formal/KuuOSFormal.lean \
              --delegated-path formal/KUOS.lean \
              --delegated-path docs/KUUOS_CAPABILITYOS_QI_WORLD_KERNEL_v0_60.md
          fi

      # Restore the multi-GB Mathlib/package workspace from main, using
      # the exact base SHA if available and a validated prior main fallback.
      # A separate smaller F112 base build overlay is applied below.
      # All restored oleans are still checked by Lake.
      - name: Restore validated parent/main Lake workspace cache
        if: steps.lean-scope.outputs.needed == 'true'
        id: lean-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      # The validated base/main workspace key can be absent when a branch was
      # published with [skip ci]. In that case restore the already available
      # leanprover/lean-action cache, whose documented key starts with lake-.
      # This is restore-only; it neither adds a new CI job nor overwrites
      # the trusted main cache. Lake checks all source dependencies as usual.
      - name: Restore shared lean-action Lake cache on main cache miss
        if: steps.lean-scope.outputs.needed == 'true' && steps.lean-workspace-cache.outputs.cache-matched-key == ''
        id: lean-action-workspace-cache
        uses: actions/cache/restore@v5
        with:
          path: ./.lake
          key: lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-

      - name: Report shared lean-action cache restore
        if: steps.lean-scope.outputs.needed == 'true' && steps.lean-workspace-cache.outputs.cache-matched-key == ''
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.lean-action-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "lean-action Lake cache matched key: ${CACHE_MATCHED_KEY:-none}"

      - name: Report Lake workspace cache restore
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lean-workspace-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.lean-workspace-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "Lake cache exact hit: ${CACHE_HIT:-false}"
          echo "Lake cache matched key: ${CACHE_MATCHED_KEY:-none}"

      # Overlay the most recent local project build from this PR only.  This
      # cache is never restored by main and therefore cannot contaminate the
      # trusted default-branch Lake workspace.  It lets a RED Lean iteration
      # reuse the successfully compiled dependency prefix on the next head.
      - name: Restore PR-local Lean build overlay
        if: github.event_name == 'pull_request' && steps.lean-scope.outputs.needed == 'true'
        id: lean-pr-build-cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr${{ github.event.pull_request.number }}-

      - name: Report PR-local Lean build overlay restore
        if: github.event_name == 'pull_request' && steps.lean-scope.outputs.needed == 'true'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.lean-pr-build-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.lean-pr-build-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          echo "PR build cache exact hit: ${CACHE_HIT:-false}"
          echo "PR build cache matched key: ${CACHE_MATCHED_KEY:-none}"

      - name: Set up pinned Lean and Lake
        if: steps.lean-scope.outputs.needed == 'true'
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      # Follow the already validated exact-pinned central Lean setup.
      - name: Resolve pinned Lake dependencies only if missing
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then
            lake update
          fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then
            lake exe cache get
          fi
          git diff --exit-code -- lake-manifest.json lean-toolchain
      - name: Strictly compile CapabilityOS v0.60 formal module
        if: steps.lean-scope.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true \
            build KUOS.CapabilityOS.QiWorldCapabilityKernelV0_60 \
            2>&1 | tee capabilityos-v0-60-lean-module.log
      # Full integrated proof check is owned by PR Governance and main-push Lean CI.
      - name: Strictly compile formal root
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true \
            -KleanArgs=-DsorryAsError=true build KuuOSFormal \
            2>&1 | tee capabilityos-v0-60-lean-root.log
      # Read-only PR consumer: the central exact-head Governance job is the
      # sole writer of PR project overlays and main owns trusted .lake caches.

      - name: Upload CapabilityOS v0.60 diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: capabilityos-v0-60-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            capabilityos-v0-60-runtime.log
            capabilityos-v0-60-lean-module.log
            capabilityos-v0-60-lean-root.log
          if-no-files-found: warn
          retention-days: 14
