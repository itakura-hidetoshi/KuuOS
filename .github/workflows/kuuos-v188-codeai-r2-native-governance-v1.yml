name: KuuOS v1.88 R2 real native CodeAI governed synthesis
on:
  push:
    branches:
      - 'validation/kuuos-v188-r2-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-codeai-r2-governed-synthesis:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real source-bound KuuOS CodeAI source observation, candidate and rejection boundary
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r2_native_governance_v1.py
      - name: Preserve source-bound CodeAI receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r2-native-codeai-receipt
          path: artifacts/codeai-v188-r2-native-governance
          retention-days: 30
          if-no-files-found: warn
