name: KuuOS v1.89 R3 PR-adopted original-name Strict Lean 22 axioms
on:
  push:
    branches:
      - 'fix/kuuos-v127-v129-ulift-20261115'
    paths:
      - 'formal/KUOS/DependentOriginationStandardArbitraryScalingWaypointV1_89.lean'
      - 'formal/KUOS/DependentOriginationStandardArbitraryScalingWaypointCodeAICandidateR3V1_89.lean'
      - 'scripts/ci_kuuos_v189_r3_adopted_exact_source_v1.py'
      - '.github/workflows/kuuos-v189-r3-adopted-exact-source-v1.yml'
      - 'tests/test_public_root_restoration.py'
      - 'lean-toolchain'
      - 'lake-manifest.json'
permissions:
  contents: read
env:
  PYTHONPATH: .
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  v189-r3-pr-adopted-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Strict pinned v1.89 R3 PR-adopted original name and 22 axiom reports
        run: |
          set -euo pipefail
          python3 -c 'from scripts.ci_kuuos_v176_exact_source_audit_v1 import verify_inputs; verify_inputs()'
          lake exe cache get
          python3 scripts/ci_kuuos_v189_r3_adopted_exact_source_v1.py
      - name: Preserve PR-adopted v1.89 exact-head Lean receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v189-r3-pr-adopted-22
          path: /tmp/kuuos-v189-r3-pr-adopted-22
          retention-days: 30
          if-no-files-found: warn
