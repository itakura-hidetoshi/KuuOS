name: KuuOS v1.88 R9 native CodeAI source-bound proposal and authority rejection
on:
  push:
    branches:
      - 'validation/kuuos-v188-r9-native-codeai-governance-20261122'
permissions:
  contents: read
env:
  PYTHONPATH: .
  SOURCE_HEAD: ${{ github.sha }}
jobs:
  native-r9-codeai-proposal:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run actual KuuOS-native CodeAI R9 candidate and false authority rejection
        run: |
          set -euo pipefail
          python3 scripts/ci_kuuos_v188_codeai_r9_native_governance_v1.py
      - name: Preserve source-bound R9 CodeAI receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v188-r9-native-codeai-receipt
          path: artifacts/codeai-v188-r9-native-governance
          retention-days: 30
          if-no-files-found: warn
