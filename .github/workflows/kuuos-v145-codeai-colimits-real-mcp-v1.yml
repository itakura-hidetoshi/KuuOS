name: KuuOS v1.45 CodeAI colimits presentability direct Lean real MCP and independent audit

on:
  pull_request:
    paths:
      - '.github/workflows/kuuos-v145-codeai-colimits-real-mcp-v1.yml'
      - 'formal/KUOS/DependentOriginationScaledColimitsPresentabilityV1_45.lean'

permissions:
  contents: read

env:
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
  PYTHONPATH: .
  V145_CHECKOUT_BLOB: '18fd6d5682a450ee8b4e0a881a3889d01ac02906'
  SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  codeai-v145-direct-and-real-mcp:
    if: github.event.pull_request.number == 3555 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - name: Restore fixed mathlib and compile exact v1.43 dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          assert require_pins(pathlib.Path('.').resolve())['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          b=pathlib.Path('formal/KUOS/DependentOriginationScaledSmallObjectArgumentV1_44.lean').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='ea3d9c2edff775235af266d10b87316f65aeb60d'
          PY
          lake exe cache get
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationScaledSmallObjectArgumentV1_44
      - name: CodeAI negative controls and pinned direct Lean of colimit candidates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,tempfile
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,FORBIDDEN_NEW
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationScaledColimitsPresentabilityV1_45.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v145-codeai')
          out.mkdir(parents=True,exist_ok=True)
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(original)==os.environ['V145_CHECKOUT_BLOB']=='18fd6d5682a450ee8b4e0a881a3889d01ac02906'
          baseline=original.decode()
          patches=json.loads(r'''[{"old":"open KUOS.DependentOriginationScaledTerminalRLPV1_41","new":"open KUOS.DependentOriginationScaledTerminalRLPV1_41\nopen KUOS.DependentOriginationScaledTerminalRLPV1_41.ScaledSSet"},{"old":"noncomputable def colimitScaling","new":"@[reducible] noncomputable def colimitScaling"},{"old":"    { map := colimit.desc (forget.mapCocone s)","new":"    { map := colimit.desc (D ⋙ forget) (forget.mapCocone s)"},{"old":"        · rw [SSet.σ_naturality_apply _ 0 x]","new":"        · let f : colimit (D ⋙ forget) ⟶ s.pt.carrier :=\n            colimit.desc (D ⋙ forget) (forget.mapCocone s)\n          change s.pt.scaling.thin (f.app (op ⦋2⦌)\n            ((colimit (D ⋙ forget)).σ 0 x))\n          rw [SSet.σ_naturality_apply f 0 x]"},{"old":"        · rw [SSet.σ_naturality_apply _ 1 x]","new":"        · let f : colimit (D ⋙ forget) ⟶ s.pt.carrier :=\n            colimit.desc (D ⋙ forget) (forget.mapCocone s)\n          change s.pt.scaling.thin (f.app (op ⦋2⦌)\n            ((colimit (D ⋙ forget)).σ 1 x))\n          rw [SSet.σ_naturality_apply f 1 x]"},{"old":"        · have h := (s.ι.app j).scaled hx\n          simpa [forget, colimitCocone, colimitLeg, colimitObj] using h }","new":"        · have h := (s.ι.app j).scaled x hx\n          have hfac :\n              colimit.ι (D ⋙ forget) j ≫\n                colimit.desc (D ⋙ forget) (forget.mapCocone s) =\n                  (s.ι.app j).map := by\n            simpa only [Functor.mapCocone_ι_app, forget] using\n              (colimit.ι_desc (forget.mapCocone s) j)\n          change s.pt.scaling.thin\n            ((colimit.desc (D ⋙ forget) (forget.mapCocone s)).app (op ⦋2⦌)\n              ((colimit.ι (D ⋙ forget) j).app (op ⦋2⦌) x))\n          rw [← NatTrans.comp_app_apply, hfac]\n          exact h }"},{"old":"    simp [colimitCocone, colimitLeg, colimitObj, forget]","new":"    change\n      colimit.ι (D ⋙ forget) j ≫\n        colimit.desc (D ⋙ forget) (forget.mapCocone s) =\n          (s.ι.app j).map\n    simpa only [Functor.mapCocone_ι_app, forget] using\n      (colimit.ι_desc (forget.mapCocone s) j)"},{"old":"    simpa [colimitCocone, colimitLeg, colimitObj, forget] using h","new":"    change colimit.ι (D ⋙ forget) j ≫ m.map =\n      colimit.ι (D ⋙ forget) j ≫\n        colimit.desc (D ⋙ forget) (forget.mapCocone s)\n    calc\n      _ = (s.ι.app j).map := by\n        simpa [colimitCocone, colimitLeg, colimitObj, forget] using h\n      _ = _ := by\n        simpa only [Functor.mapCocone_ι_app, forget] using\n          (colimit.ι_desc (forget.mapCocone s) j).symm"},{"old":"      dsimp [scaledHornAttachmentGenerators] at hi","new":"      simp only [scaledHornAttachmentGenerators] at hi"},{"old":"          dsimp [scaledHornAttachmentGeneratorHom]\n","new":""},{"old":"noncomputable def canonicalGeneratedScaledWeakFactorizationSystem_unconditional :","new":"@[reducible] noncomputable def canonicalGeneratedScaledWeakFactorizationSystem_unconditional :"},{"old":"  KUOS.DependentOriginationScaledSmallObjectArgumentV1_44.\n    canonicalGeneratedScaledWeakFactorizationSystem_of_smallObject inferInstance","new":"  KUOS.DependentOriginationScaledSmallObjectArgumentV1_44.canonicalGeneratedScaledWeakFactorizationSystem_of_smallObject\n    inferInstance"},{"old":"  KUOS.DependentOriginationScaledSmallObjectArgumentV1_44.\n    canonicalGeneratedScaledAnodyne_eq_cellularClosure inferInstance","new":"  KUOS.DependentOriginationScaledSmallObjectArgumentV1_44.canonicalGeneratedScaledAnodyne_eq_cellularClosure\n    inferInstance"}]''')
          def apply_hunks(source,ids):
              s=source
              for i in ids:
                  p=patches[i]
                  assert s.count(p['old'])==1,('ambiguous CodeAI patch',i)
                  s=s.replace(p['old'],p['new'],1)
              return s
          variants={'namespace-and-classes':apply_hunks(baseline,[0,1,10]),
                    'research-exact':apply_hunks(baseline,list(range(len(patches))))}
          chosen=variants['research-exact']
          assert blob(chosen.encode())=='c5f22f11809a82d4b11fff94091fd7b4f946d8ae'
          def decls(s):
              return re.findall(r'^(?:@\[[^\]]+\] )?(?:noncomputable )?(?:def|instance|theorem|lemma|structure|abbrev)\s+([A-Za-z_][A-Za-z0-9_]*)',s,re.M)
          for name,s in variants.items():
              assert not FORBIDDEN_NEW.search(s),('new axiom/sorry',name)
              assert decls(s)==decls(baseline),('declaration changed',name)
              assert 'canonicalGeneratedScaledWeakFactorizationSystem_unconditional' in s
              assert 'canonicalGeneratedScaledAnodyne_eq_cellularClosure_unconditional' in s
          rows=[]
          try:
              for name,s in [('baseline',baseline),*variants.items()]:
                  target.write_text(s)
                  with tempfile.TemporaryDirectory(prefix='kuuos-v145-direct-') as tmp:
                      olean=pathlib.Path(tmp)/'candidate.olean'
                      p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true','-o',str(olean),rel],cwd=root,capture_output=True,text=True,timeout=600)
                      log=p.stdout+'\n'+p.stderr
                      errors=[line for line in log.splitlines() if re.search(r'\berror(?:\([^)]*\))?:',line)]
                      row={'candidate':name,'candidate_blob':blob(s.encode()),'candidate_sha256':digest(s),'exit_code':p.returncode,'olean_exists':olean.is_file(),'errors':errors,'success':p.returncode==0 and olean.is_file() and not errors and 'sorryAx' not in log}
                      rows.append(row)
                      (out/(name+'.log')).write_text(log)
                      print('KUUOS_V145_CODEAI_DIRECT '+json.dumps(row,sort_keys=True))
              assert not rows[0]['success'] and rows[0]['exit_code']!=0
              assert 'Unknown identifier' in (out/'baseline.log').read_text()
              selected=next(row for row in rows if row['candidate']=='research-exact')
              assert selected['success'],('candidate not certified',selected['errors'])
              (out/'source.lean').write_text(chosen)
              (out/'manifest.json').write_text(json.dumps({'source_head':os.environ['SOURCE_HEAD'],'checkout_blob':blob(original),'candidate_blob':selected['candidate_blob'],'candidate_sha256':selected['candidate_sha256'],'candidates':rows,'declaration_inventory_preserved':True,'canonical_generated_wfs_proof_not_standard_class':True,'source_restored':True,'git_write_performed':False,'independent_ci_success':False},indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V145_CODEAI_NEGATIVE_CONTROL_AND_DIRECT_LEAN_COMPLETE')
          PY
      - name: Install real Lean MCP prerequisites
        run: |
          python3 -m pip install --disable-pip-version-check uv
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
      - name: Successful candidate only through actual KuuOS Lean MCP loop and second direct check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          from scripts.kuuos_lean_mcp_repair_loop_v1 import digest,run_loop,mcp_tactic_provider
          root=pathlib.Path('.').resolve()
          rel='formal/KUOS/DependentOriginationScaledColimitsPresentabilityV1_45.lean'
          target=root/rel
          original=target.read_bytes()
          out=pathlib.Path('/tmp/kuuos-v145-codeai')
          source=(out/'source.lean').read_bytes()
          try:
              target.write_bytes(source)
              p=subprocess.run(['lake','-KleanArgs=-DwarningAsError=true','-KleanArgs=-DsorryAsError=true','build','KUOS.DependentOriginationScaledColimitsPresentabilityV1_45'],cwd=root,capture_output=True,text=True,timeout=3600)
              (out/'complete-build.log').write_text(p.stdout+'\n'+p.stderr)
              print(p.stdout,p.stderr)
              assert p.returncode==0
              receipt=run_loop(root=root,rel_file=rel,output_dir=pathlib.Path('/tmp/kuuos-v145-live-mcp'),expected_sha256=digest(source),provider=mcp_tactic_provider,max_iterations=1)
              assert receipt['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY'
              assert receipt['source_restored'] and not receipt['independent_ci_success'] and not receipt['git_write_performed']
              assert receipt['candidate_sha256']==digest(source)
              assert receipt['rounds'][0]['semantic_success'] and not receipt['rounds'][0]['errors']
              assert receipt['rounds'][0]['direct_lean']['exit_code']==0
              (out/'mcp.json').write_text(json.dumps(receipt,indent=2)+'\n')
          finally:
              target.write_bytes(original)
          assert target.read_bytes()==original
          print('KUUOS_V145_CODEAI_DIRECT_THEN_REAL_MCP_SUCCESS_NOT_INDEPENDENT_CI')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v145-codeai-candidate
          path: /tmp/kuuos-v145-codeai
          retention-days: 30
          if-no-files-found: error

  independent-v145-kernel-and-eighteen-axioms:
    needs: codeai-v145-direct-and-real-mcp
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-v142-pinned-attachment-mathlib-5450-v1
      - uses: actions/download-artifact@v4
        with:
          name: kuuos-v145-codeai-candidate
          path: /tmp/kuuos-v145-independent
      - name: Independently bind source HEAD pins candidate bytes and real MCP receipt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          from scripts.check_kuuos_lean_lsp_mcp_compatibility_v7_17 import require_pins
          root=pathlib.Path('.').resolve()
          assert require_pins(root)['mathlib_sha']=='5450b53e5ddc75d46418fabb605edbf36bd0beb6'
          p=pathlib.Path('/tmp/kuuos-v145-independent')
          m=json.loads((p/'manifest.json').read_text())
          r=json.loads((p/'mcp.json').read_text())
          source=(p/'source.lean').read_bytes()
          dest=root/'formal/KUOS/DependentOriginationScaledColimitsPresentabilityV1_45.lean'
          def blob(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert m['source_head']==os.environ['SOURCE_HEAD']
          assert blob(dest.read_bytes())==m['checkout_blob']==os.environ['V145_CHECKOUT_BLOB']
          assert blob(source)==m['candidate_blob']=='c5f22f11809a82d4b11fff94091fd7b4f946d8ae'
          assert hashlib.sha256(source).hexdigest()==m['candidate_sha256']==r['candidate_sha256']
          assert m['declaration_inventory_preserved'] and m['canonical_generated_wfs_proof_not_standard_class'] and m['source_restored'] and not m['git_write_performed'] and not m['independent_ci_success']
          assert r['status']=='LOCAL_LEAN_GREEN_CANDIDATE_ONLY' and r['source_restored'] and not r['independent_ci_success'] and not r['git_write_performed']
          assert r['rounds'][0]['direct_lean']['exit_code']==0 and r['rounds'][0]['semantic_success'] and not r['rounds'][0]['errors']
          dep=root/'formal/KUOS/DependentOriginationScaledSmallObjectArgumentV1_44.lean'
          assert blob(dep.read_bytes())=='833c8e772b7f35a3b5bd36995703ed257bac20c7'
          dest.write_bytes(source)
          print('KUUOS_V145_INDEPENDENT_EXACT_SOURCE_PIN_AND_MCP_RECEIPT_MATCH')
          PY
          lake exe cache get
      - name: Independent full strict Lean v1.45 dependency closure
        run: |
          set -euo pipefail
          lake -KleanArgs=-DwarningAsError=true -KleanArgs=-DsorryAsError=true build KUOS.DependentOriginationScaledColimitsPresentabilityV1_45 2>&1 | tee /tmp/kuuos-v145-independent/build.log
      - name: Eighteen canonical generated declarations independent axiom audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,subprocess
          ns='KUOS.DependentOriginationScaledColimitsPresentabilityV1_45'
          names=["ScaledSSet.forget","ScaledSSet.minimallyScale","ScaledSSet.minimalHomEquiv","ScaledSSet.minimalCoyonedaIso","ScaledSSet.colimitScaling","ScaledSSet.colimitCoconeIsColimit","ScaledSSet.forgetColimitCoconeIsColimit","ScaledSSet.hasColimitsOfShape","ScaledSSet.forget_preservesColimitsOfShape","ScaledSSet.hasColimits","ScaledSSet.forget_preservesColimits","ScaledSSet.minimallyScaled_isFinitelyPresentable","hornCylinderAttachment_finite","minimallyScaledHornCylinderAttachment_isFinitelyPresentable","canonicalScaled_isCardinalForSmallObjectArgument","canonicalScaled_hasSmallObjectArgument","canonicalGeneratedScaledWeakFactorizationSystem_unconditional","canonicalGeneratedScaledAnodyne_eq_cellularClosure_unconditional"]
          audit=pathlib.Path('formal/KUOS/DependentOriginationV145IndependentAxiomAudit.lean')
          audit.write_text('import '+ns+'\n'+'\n'.join('#print axioms '+ns+'.'+n for n in names)+'\n')
          p=subprocess.run(['lake','env','lean','-DwarningAsError=true','-Dweak.sorryAsError=true',str(audit)],capture_output=True,text=True,timeout=600)
          log=p.stdout+'\n'+p.stderr
          print(log)
          pathlib.Path('/tmp/kuuos-v145-independent/axioms.log').write_text(log)
          assert p.returncode==0 and 'sorryAx' not in log and 'error:' not in log
          rows=re.findall(r"'([^']+)'\s+(?:depends on axioms:\s*\[([^\]]*)\]|does not depend on any axioms)",log,re.S)
          assert len(rows)==len(names) and {x[0] for x in rows}=={ns+'.'+n for n in names}
          allowed={'propext','Classical.choice','Quot.sound'}
          for _,ax in rows:
              assert {x.strip() for x in ax.split(',') if x.strip()}<=allowed
          src=pathlib.Path('formal/KUOS/DependentOriginationScaledColimitsPresentabilityV1_45.lean').read_text()
          assert 'canonicalGeneratedScaledWeakFactorizationSystem_unconditional' in src and 'canonicalGeneratedScaledAnodyne_eq_cellularClosure_unconditional' in src
          print('KUUOS_V145_EIGHTEEN_DECLARATIONS_STANDARD_AXIOMS_CANONICAL_GENERATED_SCOPE')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuuos-v145-independent-proof-audit
          path: /tmp/kuuos-v145-independent
          retention-days: 30
          if-no-files-found: error
