name: KuuOS v1.111 CodeAI MemoryOS concrete four-dimensional type-A RLP witness

on:
  pull_request:
    paths:
      - "scripts/kuuos_v1111_codeai_typeA_four_rlp_v1.py"
      - ".github/workflows/kuuos-v1111-codeai-typeA-four-rlp-v1.yml"

permissions:
  contents: read

jobs:
  v1111-codeai-memoryos-direct-lean-real-mcp:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3522 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup exact fixed Lean 4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned build overlay read-only
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve exact fixed mathlib
        run: lake exe cache get
      - name: Strict imported v1.110 four-horn restriction dependency closure
        run: |
          set -euo pipefail
          timeout 3000 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingTypeAFourHornRestrictionV1_110
      - name: Install pinned real Lean MCP transport
        run: python3 -m pip install uv
      - name: CodeAI three source-bound literal filler/RLP candidates fixed direct Lean then green-only real MCP
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/kuuos_v1111_codeai_typeA_four_rlp_v1.py
          PYTHONPATH=. python3 scripts/kuuos_v1111_codeai_typeA_four_rlp_v1.py
      - name: Archive immutable candidate/Lean/MCP receipts; never claim independent certification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v1111-codeai-real-four-rlp-${{ github.run_id }}
          path: |
            /tmp/kuuos-v1111-codeai-literal-four-rlp/
            /tmp/kuuos-v1111-real-mcp-four-rlp/
            /tmp/kuuos-v1111-memoryos/
          if-no-files-found: warn
          retention-days: 30
