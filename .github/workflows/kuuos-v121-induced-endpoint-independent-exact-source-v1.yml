name: KuuOS v1.121 independent exact-source induced Type-A endpoint RLP and cylinder lift

on:
  pull_request:
    types: [synchronize]
    paths:
      - "formal/KUOS/DependentOriginationDoubleDeloopingInducedEndpointRLPV1_121.lean"
      - ".github/workflows/kuuos-v121-induced-endpoint-independent-exact-source-v1.yml"
      - "memoryos/external/github/2026/11/kuuos_v121_induced_endpoint_codeai_success_v1.json"

permissions:
  contents: read
  actions: read

jobs:
  independent-endpoint-source:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 3562 && github.event.pull_request.draft == true && github.event.pull_request.head.ref == 'validation/kuuos-v121-induced-endpoint-on-certified-v120-20261116' && github.event.pull_request.base.sha == '7c64a89b81681f997483d0873887df2f700d1244' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - name: Checkout byte-identical promoted actual cylinder RLP source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned actual CodeAI real Lean MCP and second direct receipts
        uses: actions/download-artifact@v4
        with:
          name: kuuos-v121-endpoint-codeai-43863005594
          run-id: 43863005594
          github-token: ${{ github.token }}
          path: /tmp/kuuos-v121-endpoint-independent-evidence
      - name: Verify proof/source byte identity, declared pin, provenance, and source/test merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/kuuos-v121-endpoint-independent
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,urllib.request
          repo="itakura-hidetoshi/KuuOS"
          path=Path("formal/KUOS/DependentOriginationDoubleDeloopingInducedEndpointRLPV1_121.lean")
          expected="1b0f52b0c5604373e046ed269fe4f4c0d2599d17"
          expected_sha256="d52f22e04fdefeac3c619dbcfcd96c360b62713ad4ce57b6b80e29e0ee1dd3f4"
          producer_run=43863005594
          producer_head="10e190c73912f6fe868432d8cc9451a18701897b"
          producer_tree="a2aed93720afac62d0ecf3f56eac715147c21686"
          def blob(b):
              return hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          def github(route):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+route,
                headers={"Accept":"application/vnd.github+json",
                  "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                  "User-Agent":"KuuOS-v121-endpoint-independent"})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)
          raw=path.read_bytes()
          assert blob(raw)==expected and hashlib.sha256(raw).hexdigest()==expected_sha256
          source=raw.decode("utf-8")
          assert re.search(r"\b(sorry|admit|axiom|unsafe|native_decide)\b",source) is None
          assert Path("lean-toolchain").read_text().strip()=="leanprover/lean4:v4.30.0-rc2"
          manifest=json.loads(Path("lake-manifest.json").read_text())
          assert [x.get("rev") for x in manifest["packages"] if x.get("name")=="mathlib"]==["5450b53e5ddc75d46418fabb605edbf36bd0beb6"]
          pinned={
           "formal/KUOS/DependentOriginationDoubleDeloopingTypeCTerminalRLPPinnedV1_121.lean":"24cc915ad7693a7083ccd19c2614cb5339778381",
           "formal/KUOS/DependentOriginationDoubleDeloopingTypeCOuterHornCocycleCompletionPinnedV1_121.lean":"90672c999cb7f76c448d8932875900ee871bf80f",
           "formal/KUOS/DependentOriginationDoubleDeloopingTypeAFaceValueBridgeV1_121.lean":"51c84705c4eaffe6f607fb87f0891662613cdb94",
           "formal/KUOS/DependentOriginationStandardTypeAEndpointOppositeCellCertificateV1_77.lean":"e7d422b89b4a4fa5180790b0c5d49c51b7239786",
           "formal/KUOS/DependentOriginationStandardABCLeibnizCellularComparisonV1_59.lean":"2b852bcd457831d25d50e8ed9dd3ac6a44f6f85e",
           "formal/KUOS/DependentOriginationStandardTypeAEndpointPushoutProductV1_50.lean":"1f24c5e7b30d1392ccd16c8b7b3ed7387b7d72a9",
          }
          for p,sha in pinned.items():
              assert blob(Path(p).read_bytes())==sha,p
          ev=Path("/tmp/kuuos-v121-endpoint-independent-evidence")
          candidates=list(ev.rglob("candidate.lean"))
          receipts=list(ev.rglob("receipt.json"))
          portfolios=list(ev.rglob("portfolio.json"))
          assert len(candidates)==1 and candidates[0].read_bytes()==raw
          assert len(receipts)==1 and len(portfolios)==1
          rec=json.loads(receipts[0].read_text())
          portfolio=json.loads(portfolios[0].read_text())
          assert rec["source_head"]==portfolio["source_head"]==producer_head
          assert portfolio["source_tree"]==producer_tree and portfolio["candidate_count"]==3
          assert portfolio["certified_terminal_blob"]==pinned["formal/KUOS/DependentOriginationDoubleDeloopingTypeCTerminalRLPPinnedV1_121.lean"]
          assert portfolio["certified_terminal_run"]==43862315102
          assert len(portfolio["candidates"])==3 and all(c["status"]=="SUCCESS" and c["exit_code"]==0 and c["error_count"]==0 and c["olean_exists"] is True for c in portfolio["candidates"])
          assert rec["selected"]=="membership-explicit" and rec["selected_blob"]==expected
          assert rec["mcp_success"] is True and rec["mcp_errors"]==0
          assert rec["second_direct_success"] is True and rec["second_direct_exit"]==0
          assert rec["source_restored"] is True and portfolio["independent_ci_certified"] is False
          p=github("actions/runs/"+str(producer_run))
          assert p["head_sha"]==producer_head and p["status"]=="completed" and p["conclusion"]=="success"
          t=github("actions/runs/43862315102")
          assert t["head_sha"]=="a60846ccdf65becf08cd1492515cf6536521bf52"
          assert t["status"]=="completed" and t["conclusion"]=="success"
          event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          pr=event["pull_request"]
          head=os.environ["HEAD"]
          assert event["repository"]["full_name"]==repo and event["number"]==3562
          assert pr["draft"] is True and pr["head"]["sha"]==head
          assert pr["base"]["sha"]=="7c64a89b81681f997483d0873887df2f700d1244"
          live=github("pulls/3562")
          assert live["head"]["sha"]==head and live["draft"] is True and live["state"]=="open"
          source_git=github("git/commits/"+head)
          merge_ref=github("git/ref/pull/3562/merge")
          merge_git=github("git/commits/"+merge_ref["object"]["sha"])
          source_tree=source_git["tree"]["sha"]
          assert source_tree==merge_git["tree"]["sha"]

          names=re.findall(r"(?m)^(?:noncomputable\s+)?(?:theorem|def|lemma|structure)\s+([A-Za-z0-9_']+)",source)
          assert names==[
            "natDoubleDelooping_typeA_inducedEndpoint_rlp",
            "natDoubleDelooping_typeA_inducedEndpoint_actualExtension",
            "natDoubleDelooping_typeA_inducedEndpoint_chosenLift",
            "natDoubleDelooping_typeA_inducedEndpoint_chosenLift_fac"
          ],names
          prefix="KUOS.DependentOriginationDoubleDeloopingInducedEndpointRLPV1_121."
          audit=["import KUOS.DependentOriginationDoubleDeloopingInducedEndpointRLPV1_121",""]
          for name in names:
              audit.extend(["#check "+prefix+name,"#print axioms "+prefix+name])
          out=Path("/tmp/kuuos-v121-endpoint-independent")
          (out/"AxiomAudit.lean").write_text("\n".join(audit)+"\n")
          (out/"names.json").write_text(json.dumps([prefix+n for n in names],indent=2)+"\n")
          admission={"head":head,"source_tree":source_tree,
            "test_merge_tree":merge_git["tree"]["sha"],
            "source_blob":expected,"producer_run":producer_run,
            "producer_head":producer_head,"terminal_independent_run":43862315102,
            "direct_lean_green":3,"mcp_green":True,"second_direct_green":True,
            "axiom_audit_declarations":4,"independent_certified":False}
          (out/"admission.json").write_text(json.dumps(admission,indent=2,sort_keys=True)+"\n")
          print("KUUOS_ENDPOINT_INDEPENDENT_PRODUCER_ADMISSION",json.dumps(admission,sort_keys=True))
          PY
      - name: Setup pinned Lean v4.30.0-rc2
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Restore pinned real terminal and geometry closure cache
        uses: actions/cache/restore@v5
        with:
          path: .lake/build
          key: kuuos-v121-terminal-source-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-24cc915ad7693a7083ccd19c2614cb5339778381
          restore-keys: |
            kuuos-v121-terminal-typec-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-90672c999cb7f76c448d8932875900ee871bf80f
            kuuos-pr-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-pr3522-
      - name: Resolve exact pinned mathlib
        run: lake exe cache get
      - name: Independently strict-build exact induced Type-A endpoint RLP and all imports
        run: |
          set -euo pipefail
          timeout 3200 lake -KleanArgs=-DwarningAsError=true -KleanArgs=-Dweak.sorryAsError=true build KUOS.DependentOriginationDoubleDeloopingInducedEndpointRLPV1_121 2>&1 | tee /tmp/kuuos-v121-endpoint-independent/build.log
      - name: Audit all four declarations including chosen lift and its equation
        run: |
          set -euo pipefail
          lake env lean -DwarningAsError=true -Dweak.sorryAsError=true /tmp/kuuos-v121-endpoint-independent/AxiomAudit.lean 2>&1 | tee /tmp/kuuos-v121-endpoint-independent/axioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          p=Path("/tmp/kuuos-v121-endpoint-independent")
          names=json.loads((p/"names.json").read_text())
          log=(p/"axioms.log").read_text()
          assert not re.search(r"(?m)(warning:|error:|sorryAx)",log)
          uses=re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log,re.S)
          free=re.findall(r"'([^']+)' does not depend on any axioms",log)
          checked={n for n,_ in uses}|set(free)
          assert checked==set(names),{"missing":list(set(names)-checked),"extra":list(checked-set(names))}
          ax=set()
          for _,s in uses: ax.update(x.strip() for x in s.split(",") if x.strip())
          assert ax.issubset({"propext","Classical.choice","Quot.sound"}),sorted(ax)
          report={"declarations":4,"checked":len(checked),
            "axioms":sorted(ax),"sorryAx":0,"warnings":0,"errors":0,
            "source_blob":"1b0f52b0c5604373e046ed269fe4f4c0d2599d17",
            "scope":"actual induced-scaled endpoint RLP, cylinder extension, chosen lift and commuting equation"}
          (p/"axiom_receipt.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("KUUOS_ENDPOINT_INDEPENDENT_AXIOMS_GREEN",json.dumps(report,sort_keys=True))
          PY
      - name: Archive exact-source independent Lean, axiom and Git tree receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuuos-v121-endpoint-independent-${{ github.run_id }}
          path: /tmp/kuuos-v121-endpoint-independent/
          if-no-files-found: warn
          retention-days: 30
