name: KuuOS certified Lean project cache v1 isolated sandbox
on:
  push:
    branches: [research/verified-lean-cross-pr-cache-v1-20261125]
    paths:
      - 'scripts/ci_verified_lean_project_cache_v1.py'
      - 'tests/test_ci_verified_lean_project_cache_v1.py'
      - '.github/workflows/lean-certified-project-cache-sandbox-v1.yml'
      - '.github/workflows/lean-certified-project-cache-v1.yml'
      - '.github/workflows/pr-governance-gate.yml'
permissions:
  contents: read
jobs:
  sandbox:
    name: Negative authority fixtures and actual pinned Lean transport fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run cache trust and existing routing tests
        run: python3 -m unittest -v tests.test_ci_verified_lean_project_cache_v1 tests.test_ci_lean_cache_topology tests.test_ci_f112_additive_root_route
      - name: Install exact pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - name: Compile actual pinned Lean fixture (not canonical proof)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cache-fixture/lib/lean"
          printf 'def cacheProbe : Nat := 42\n' > "$RUNNER_TEMP/cache-fixture/KuuOSFormal.lean"
          cd "$RUNNER_TEMP/cache-fixture"
          lean -DwarningAsError=true -DsorryAsError=true -o lib/lean/KuuOSFormal.olean KuuOSFormal.lean
          printf 'Build completed successfully (1 jobs).\n' > fixture-only.log
      - name: Pack fixture-only archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          from scripts.ci_verified_lean_project_cache_v1 import pack_payload
          p=Path(os.environ["RUNNER_TEMP"])/"cache-fixture"
          pack_payload(p,Path("fixture-payload"),{"fixture_only":True},os.environ["GITHUB_SHA"],
                       int(os.environ["GITHUB_RUN_ID"]),int(os.environ["GITHUB_RUN_ATTEMPT"]),p/"fixture-only.log")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-cache-transport-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixture-payload/
          if-no-files-found: error
          retention-days: 7
  independent:
    name: Independent runner actual Lean import after validated transport
    needs: sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: isolated-cache-transport-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: fixture-payload
      - name: Install exact pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - name: Validate fixture and import actual transported Lean artifact
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          from scripts.ci_verified_lean_project_cache_v1 import verify_payload,digest
          scope={"fixture_only":True}
          evidence={"source_head":os.environ["GITHUB_SHA"],"run_id":int(os.environ["GITHUB_RUN_ID"]),
                    "run_attempt":int(os.environ["GITHUB_RUN_ATTEMPT"]),"scope_digest":digest(scope)}
          verify_payload(Path("fixture-payload"),Path("fixture-restored"),scope,evidence)
          PY
          printf 'import KuuOSFormal\nexample : cacheProbe = 42 := rfl\n' > "$RUNNER_TEMP/CacheProbeImport.lean"
          LEAN_PATH="$PWD/fixture-restored/lib/lean" lean -DwarningAsError=true -DsorryAsError=true "$RUNNER_TEMP/CacheProbeImport.lean"
          echo KUUOS_CACHE_ACTUAL_LEAN_FIXTURE_TRANSPORT_GREEN
