name: CodeAI finite obstruction basis completeness v1 R63 R3
on:
  push:
    branches: [research/codeai-nogo-memory-v1-20261126]
    paths:
      - ".github/workflows/codeai-olean-finite-obstruction-basis-completeness-v1-r63-r3.yml"
permissions:
  contents: read
  actions: read
env:
  CANONICAL_HEAD: a316e66f8a3a3f8dca2ae5177e4f04e7cc1dd063
  MATHLIB_NO_CACHE_ON_UPDATE: '1'
concurrency:
  group: codeai-olean-finite-obstruction-basis-completeness-v1-r63-r3
  cancel-in-progress: false
jobs:
  sandbox:
    name: R63 R3 sandbox finite obstruction basis completeness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.CANONICAL_HEAD }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore verified canonical project olean archive
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$CANONICAL_HEAD" python3 scripts/ci_verified_lean_project_cache_v1.py restore --base "$CANONICAL_HEAD"
      - name: Require verified archive and fixed proof scope
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          SCOPE: ${{ steps.cache.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          test -f .lake/build/lib/lean/KuuOSFormal.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - name: Require pinned mathlib for selected typed application
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          test -f .lake/build/lib/lean/KUOS/WORLD/KuuOSRepositoryAlignmentNormalFormV0_80.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r62-r2-local-45992685030-1
          path: r62-local
          run-id: 45992685030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r62-r2-independent-45992685030-1
          path: r62-independent
          run-id: 45992685030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r63-local-45995740432-1
          path: r1-failure
          run-id: 45995740432
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r63-r2-local-45996539807-1
          path: r2-failure
          run-id: 45996539807
          github-token: ${{ github.token }}
      - name: Verify R63 R3 finite obstruction basis completeness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_olean_finite_obstruction_basis_completeness_v1_r63_r3.py --out artifacts/olean-r63 --phase direct --r62-local r62-local --r62-independent r62-independent --r1-failure r1-failure --r2-failure r2-failure
      - name: Install actual Lean MCP launcher
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check uv==0.13.10
          if ! command -v rg >/dev/null 2>&1; then
            test -f /etc/apt/sources.list.d/ubuntu.sources
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- update -qq
            sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- install -y -qq ripgrep
          fi
          uv --version
          rg --version
      - name: Actual Lean MCP R63 R3 finite obstruction basis audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_olean_finite_obstruction_basis_completeness_v1_r63_r3.py --out artifacts/olean-r63 --phase mcp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-olean-r63-r3-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/olean-r63/
          if-no-files-found: warn
  independent:
    name: R63 R3 independent finite obstruction basis completeness
    needs: sandbox
    if: needs.sandbox.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANONICAL_HEAD }}
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: pilot
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: bash scripts/bootstrap_pinned_lean_ci.sh
      - uses: actions/cache/restore@v5
        with:
          path: .lake
          key: kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ env.CANONICAL_HEAD }}
          restore-keys: |
            kuuos-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-
      - name: Restore verified canonical project olean archive
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_SHA="$CANONICAL_HEAD" python3 scripts/ci_verified_lean_project_cache_v1.py restore --base "$CANONICAL_HEAD"
      - name: Require verified archive and fixed proof scope
        env:
          RESTORED: ${{ steps.cache.outputs.restored }}
          SCOPE: ${{ steps.cache.outputs.scope_digest }}
        run: |
          set -euo pipefail
          test "$RESTORED" = true
          test "$SCOPE" = 2d9d0c313b6f7d8e4df0900fd0977324999a4200c1ed3c1adb178706370dbd6b
          test -f .lake/build/lib/lean/KuuOSFormal.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - name: Require pinned mathlib for selected typed application
        run: |
          set -euo pipefail
          if [[ ! -d .lake/packages/mathlib ]]; then lake update; fi
          if [[ ! -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean ]]; then lake exe cache get; fi
          test -f .lake/build/lib/lean/KUOS/WORLD/KuuOSRepositoryAlignmentNormalFormV0_80.olean
          git diff --exit-code -- formal lean lakefile.toml lake-manifest.json lean-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r62-r2-local-45992685030-1
          path: r62-local
          run-id: 45992685030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r62-r2-independent-45992685030-1
          path: r62-independent
          run-id: 45992685030
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r63-local-45995740432-1
          path: r1-failure
          run-id: 45995740432
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r63-r2-local-45996539807-1
          path: r2-failure
          run-id: 45996539807
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: codeai-olean-r63-r3-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: first-recall
      - name: Independently verify R63 R3 finite obstruction basis completeness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pilot/scripts/check_codeai_olean_finite_obstruction_basis_completeness_v1_r63_r3.py --out artifacts/olean-r63 --phase independent --r62-local r62-local --r62-independent r62-independent --r1-failure r1-failure --r2-failure r2-failure --first first-recall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeai-olean-r63-r3-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/olean-r63/
          if-no-files-found: warn
